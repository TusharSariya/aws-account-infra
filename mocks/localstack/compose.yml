services:
  localstack:
    image: localstack/localstack:4.4.0
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      SERVICES: ${LOCALSTACK_SERVICES:-s3,sqs,sts,ssm,lambda,scheduler,iam,logs}
    volumes:
      - ./init:/etc/localstack/init/ready.d:ro
      # Lambda zip execution (court-booker integration tests) needs the host Docker engine.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # Service health can precede ready-hook completion on constrained runners.
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          status = json.load(urllib.request.urlopen('http://localhost:4566/_localstack/init/ready', timeout=2));
          scripts = {script['name']: script['state'] for script in status['scripts']};
          assert status['completed'] and scripts.get('10-bootstrap.sh') == 'SUCCESSFUL' and all(state == 'SUCCESSFUL' for state in scripts.values())
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
