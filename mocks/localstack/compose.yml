services:
  localstack:
    image: localstack/localstack:4.4.0
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      SERVICES: ${LOCALSTACK_SERVICES:-s3,sqs,sts}
    volumes:
      - ./init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
