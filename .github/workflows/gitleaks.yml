name: gitleaks

# Secret scanning across the full git history. Runs the MIT-licensed gitleaks CLI
# directly (NOT gitleaks-action, which requires a paid GITLEAKS_LICENSE for org-owned
# repos — this repo lives under the TusharSariyaOrg org). No AWS creds. Always runs on
# every PR, so the single `gitleaks` job is a stable required-check context.
on:
  pull_request:

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.21.2

jobs:
  gitleaks:
    runs-on: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos-light"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `detect` scans every commit

      - uses: ./.github/actions/talos-runner-setup
      - name: install gitleaks
        run: |
          if ! command -v gitleaks >/dev/null || [[ "$(gitleaks version)" != "$GITLEAKS_VERSION" ]]; then
            python3 scripts/cache_download.py "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba "$RUNNER_TEMP/gitleaks.tgz" ${HOMELAB_DEPENDENCY_CACHE:+--cache}
            tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
            sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          fi
          gitleaks version

      - name: scan
        run: gitleaks detect --redact --no-banner --exit-code 1
