name: lambda-package

# Test court-booker natively on the checks runner, then build arm64 zips under
# apps/lambda/python/<runtime>/<name> (QEMU ARM helper on x64 runners).
# PRs upload candidate/<name>/<sha>.zip; main uploads stable/<name>/<sha>.zip.
# Does not retarget Lambda; set booker_api_zip_key to a stable/ key and apply.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lambda-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "992382747916"
  LAMBDA_ZIP_BUCKET: lambda-releases-992382747916-us-east-1
  LAMBDA_CANDIDATE_ROLE_ARN: arn:aws:iam::992382747916:role/github-ci-lambda-candidate
  LAMBDA_STABLE_ROLE_ARN: arn:aws:iam::992382747916:role/github-ci-lambda-stable

jobs:
  test:
    needs: select
    if: contains(fromJSON(needs.select.outputs.applications), 'court-booker') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-24.04-arm","talos":"homelab-talos-checks"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/talos-runner-setup
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', 'config/ci-python-pins.txt') }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          cache-local-path: ${{ env.UV_CACHE_DIR || format('{0}/uv-cache', runner.temp) }}
          python-version: '3.14'
      - name: Court-booker tests
        run: uv run --frozen --directory apps/lambda/python/3.14/court-booker pytest
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', 'config/ci-python-pins.txt') }}
          mode: save
          password: ${{ secrets.NEXUS_BUILD_CACHE_PASSWORD }}
        if: ${{ success() }}
  package:
    if: contains(fromJSON(needs.select.outputs.applications), 'court-booker') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-24.04-arm","talos":"homelab-talos-docker-small"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/talos-runner-setup
        with:
          docker: 'true'
          aws: 'true'
          packages: python3-venv python3-pip zip
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', 'config/ci-python-pins.txt') }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          cache-local-path: ${{ env.UV_CACHE_DIR || format('{0}/uv-cache', runner.temp) }}
          python-version: "3.14"
      - uses: docker/setup-qemu-action@v3
        if: runner.arch == 'X64'
        with:
          platforms: arm64
          cache-image: false
      - uses: ./.github/actions/talos-build-cache
        id: cache
        with:
          platform: linux/arm64
          password: ${{ secrets.NEXUS_BUILD_CACHE_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
          buildkitd-config: ${{ steps.cache.outputs.config }}
          driver-opts: ${{ steps.cache.outputs.driver-opts }}
        if: runner.arch == 'X64'
      - id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.event_name == 'pull_request' && env.LAMBDA_CANDIDATE_ROLE_ARN || env.LAMBDA_STABLE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Package and upload
        if: steps.aws.outcome == 'success'
        env:
          TAG: ${{ github.sha }}
          LAMBDA_ZIP_PREFIX: ${{ github.event_name == 'pull_request' && 'candidate/court-booker' || 'stable/court-booker' }}
        run: |
          chmod +x scripts/lambda-package.sh
          if [[ "$RUNNER_ARCH" == X64 ]]; then
            bash scripts/lambda-package-arm.sh package "$TAG"
          else
            ./scripts/lambda-package.sh python/3.14/court-booker "$TAG"
          fi
      - name: Skip until account apply
        if: steps.aws.outcome != 'success'
        run: echo "lambda-releases OIDC role not applied yet; skipping upload."
      - name: Comment key on PR
        if: github.event_name == 'pull_request' && steps.aws.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ github.sha }}';
            const key = `candidate/court-booker/${tag}.zip`;
            const body = `### lambda-package — candidate\n\n\`${key}\`\n\nPromote by uploading the same sha to \`stable/\` on main, then set \`booker_api_zip_key\` and apply.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', 'config/ci-python-pins.txt') }}
          mode: save
          password: ${{ secrets.NEXUS_BUILD_CACHE_PASSWORD }}
        if: ${{ success() }}
    needs: [select, test]
  select:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos-light"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    outputs:
      checks: ${{ steps.select.outputs.checks }}
      applications: ${{ steps.select.outputs.applications }}
      units: ${{ steps.select.outputs.units }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/talos-runner-setup
      - id: select
        run: python3 scripts/ci-relevant-changes.py
  iracing-calendar:
    needs: select
    if: contains(fromJSON(needs.select.outputs.applications), 'iracing-calendar') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-24.04-arm","talos":"homelab-talos-checks"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/talos-runner-setup
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', 'config/ci-python-pins.txt') }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          cache-local-path: ${{ env.UV_CACHE_DIR || format('{0}/uv-cache', runner.temp) }}
          python-version: '3.14'
      - name: iRacing calendar tests
        run: |
          uv run --frozen --directory apps/lambda/python/3.14/iracing-calendar pytest
          uv run --frozen --directory apps/lambda/python/3.14/iracing-calendar ruff check .
          uv run --frozen --directory apps/lambda/python/3.14/iracing-calendar ruff format --check .
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', 'config/ci-python-pins.txt') }}
          mode: save
          password: ${{ secrets.NEXUS_BUILD_CACHE_PASSWORD }}
        if: ${{ success() }}
  zwift-calendar:
    needs: select
    if: contains(fromJSON(needs.select.outputs.applications), 'zwift-calendar') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-24.04-arm","talos":"homelab-talos-checks"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/talos-runner-setup
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', 'config/ci-python-pins.txt') }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          cache-local-path: ${{ env.UV_CACHE_DIR || format('{0}/uv-cache', runner.temp) }}
          python-version: '3.14'
      - name: Zwift calendar tests
        run: |
          uv run --frozen --directory apps/lambda/python/3.14/zwift-calendar pytest
          uv run --frozen --directory apps/lambda/python/3.14/zwift-calendar ruff check .
          uv run --frozen --directory apps/lambda/python/3.14/zwift-calendar ruff format --check .
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', 'config/ci-python-pins.txt') }}
          mode: save
          password: ${{ secrets.NEXUS_BUILD_CACHE_PASSWORD }}
        if: ${{ success() }}
  swim-calendar:
    needs: select
    if: contains(fromJSON(needs.select.outputs.applications), 'swim-calendar') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-24.04-arm","talos":"homelab-talos-checks"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/talos-runner-setup
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', 'config/ci-python-pins.txt') }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          cache-local-path: ${{ env.UV_CACHE_DIR || format('{0}/uv-cache', runner.temp) }}
          python-version: '3.14'
      - name: Swimming calendar tests
        run: uv run --frozen --directory apps/lambda/python/3.14/swim-calendar pytest
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', 'config/ci-python-pins.txt') }}
          mode: save
          password: ${{ secrets.NEXUS_BUILD_CACHE_PASSWORD }}
        if: ${{ success() }}
