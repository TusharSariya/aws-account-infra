name: lambda-package

# Build arm64 zips under apps/lambda/python/<runtime>/<name>.
# PRs upload candidate/<name>/<sha>.zip; main uploads stable/<name>/<sha>.zip.
# Does not retarget Lambda; set booker_api_zip_key to a stable/ key and apply.

on:
  pull_request:
    paths:
      - "apps/lambda/**"
      - "apps/ecr/court-booker/bookings.yaml"
      - "scripts/lambda-package.sh"
      - "scripts/lambda-package-arm.sh"
      - "apps/platform/ci_runner/arm-package/**"
      - ".github/workflows/lambda-package.yml"
  push:
    branches: [main]
    paths:
      - "apps/lambda/**"
      - "apps/ecr/court-booker/bookings.yaml"
      - "scripts/lambda-package.sh"
      - "scripts/lambda-package-arm.sh"
      - "apps/platform/ci_runner/arm-package/**"
      - ".github/workflows/lambda-package.yml"
  workflow_dispatch:

concurrency:
  group: lambda-package-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "992382747916"
  LAMBDA_ZIP_BUCKET: lambda-releases-992382747916-us-east-1
  LAMBDA_CANDIDATE_ROLE_ARN: arn:aws:iam::992382747916:role/github-ci-lambda-candidate
  LAMBDA_STABLE_ROLE_ARN: arn:aws:iam::992382747916:role/github-ci-lambda-stable

jobs:
  package:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-24.04-arm","talos":"homelab-talos"}')[vars.CI_EXECUTOR || 'github-hosted'] }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/talos-runner-setup
        with:
          docker: 'true'
          aws: 'true'
          packages: python3-venv python3-pip zip
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - uses: docker/setup-qemu-action@v3
        if: vars.CI_EXECUTOR == 'talos'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
        if: vars.CI_EXECUTOR == 'talos'
      - name: Test
        env:
          CI_EXECUTOR: ${{ vars.CI_EXECUTOR }}
        run: |
          if [[ "$CI_EXECUTOR" == talos ]]; then
            bash scripts/lambda-package-arm.sh test
          else
            uv run --directory apps/lambda/python/3.14/court-booker pytest
          fi
      - id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.event_name == 'pull_request' && env.LAMBDA_CANDIDATE_ROLE_ARN || env.LAMBDA_STABLE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Package and upload
        if: steps.aws.outcome == 'success'
        env:
          CI_EXECUTOR: ${{ vars.CI_EXECUTOR }}
          TAG: ${{ github.sha }}
          LAMBDA_ZIP_PREFIX: ${{ github.event_name == 'pull_request' && 'candidate/court-booker' || 'stable/court-booker' }}
        run: |
          chmod +x scripts/lambda-package.sh
          if [[ "$CI_EXECUTOR" == talos ]]; then
            bash scripts/lambda-package-arm.sh package "$TAG"
          else
            ./scripts/lambda-package.sh python/3.14/court-booker "$TAG"
          fi
      - name: Skip until account apply
        if: steps.aws.outcome != 'success'
        run: echo "lambda-releases OIDC role not applied yet; skipping upload."
      - name: Comment key on PR
        if: github.event_name == 'pull_request' && steps.aws.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ github.sha }}';
            const key = `candidate/court-booker/${tag}.zip`;
            const body = `### lambda-package — candidate\n\n\`${key}\`\n\nPromote by uploading the same sha to \`stable/\` on main, then set \`booker_api_zip_key\` and apply.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
