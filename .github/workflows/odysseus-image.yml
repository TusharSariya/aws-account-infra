name: odysseus-image
on:
  pull_request:
    paths:
      - 'apps/containers/odysseus/**'
      - 'scripts/odysseus-image-context.py'
      - 'scripts/odysseus-image-smoke.sh'
      - 'scripts/odysseus-smoke-controller.py'
      - 'scripts/odysseus-source-tests.py'
      - 'scripts/verify-ai-images.py'
      - '.github/workflows/odysseus-image.yml'
  push:
    branches: [main]
    paths:
      - 'apps/containers/odysseus/**'
      - 'scripts/odysseus-image-context.py'
      - 'scripts/odysseus-image-smoke.sh'
      - 'scripts/odysseus-smoke-controller.py'
      - 'scripts/odysseus-source-tests.py'
      - 'scripts/verify-ai-images.py'
      - '.github/workflows/odysseus-image.yml'
  workflow_dispatch:
    inputs:
      talos_acceptance:
        description: Run the explicit acceptance build on the deployed Talos compatibility runner
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: odysseus-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos"}')[(inputs.talos_acceptance || contains(github.event.pull_request.labels.*.name, 'arc-acceptance')) && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    timeout-minutes: 60
    environment: prod
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/talos-runner-setup
        with:
          docker: 'true'
          packages: gh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare checksum-verified upstream context
        id: source
        shell: bash
        run: |
          context=$(python3 scripts/odysseus-image-context.py "$RUNNER_TEMP/odysseus-source")
          python3 scripts/odysseus-source-tests.py "$context"
          echo "context=$context" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish private package
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.source.outputs.context }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/tusharsariyaorg/homelab-odysseus:${{ steps.source.outputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/TusharSariyaOrg/aws-account-infra
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
          provenance: mode=max
          sbom: true
      - name: Verify package remains private and report immutable reference
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          visibility=$(gh api /orgs/TusharSariyaOrg/packages/container/homelab-odysseus --jq .visibility)
          [[ "$visibility" == private ]]
          echo "Image: ghcr.io/tusharsariyaorg/homelab-odysseus@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo 'Commit this digest to workspace-values.yaml before requesting apply.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify packaged service startup and authentication
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: bash scripts/odysseus-image-smoke.sh "ghcr.io/tusharsariyaorg/homelab-odysseus@$IMAGE_DIGEST"
      - name: Record verified build output
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_COMMIT: ${{ steps.source.outputs.revision }}
        run: python3 scripts/verify-ai-images.py odysseus "ghcr.io/tusharsariyaorg/homelab-odysseus@$IMAGE_DIGEST" "$SOURCE_COMMIT" "$RUNNER_TEMP/receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: odysseus-image-receipt
          path: ${{ runner.temp }}/receipt.json
          retention-days: 90
          if-no-files-found: error
