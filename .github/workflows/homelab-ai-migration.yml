name: homelab-ai-migration
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type reset-three-ai-volumes-v1 to erase only the three pinned legacy AI volumes
        type: string
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: tofu-apply
  cancel-in-progress: false
jobs:
  reset:
    if: github.ref == 'refs/heads/main'
    # Circular maintenance: the macOS operator runner when vars.CI_OPERATOR == 'mac', else hosted.
    runs-on: ${{ vars.CI_OPERATOR == 'mac' && fromJSON('["self-hosted","macOS","homelab-operator"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    # Dispatch-only operator job: the operator environment deploys from main only.
    environment: operator
    steps:
      - name: Require the explicit single-use reset
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = reset-three-ai-volumes-v1
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        if: runner.os != 'macOS'
        with:
          use-cache: false
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:github-ci
          version: 1.102.4
          hostname: gh-ai-migration-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Accept private subnet route
        if: runner.os != 'macOS'
        run: sudo tailscale set --accept-routes=true
      - name: Require the operator Mac's existing tailnet session
        if: runner.os == 'macOS'
        run: tailscale status --json | python3 -c 'import json,sys; state = json.load(sys.stdin)["BackendState"]; assert state == "Running", "tailscale BackendState is " + state'
      - uses: ./.github/actions/talos-check
        with:
          operation: ai-migrate
          reset-confirm: ${{ inputs.confirm }}
          secrets-b64: ${{ secrets.TALOS_SECRETS_B64 }}
