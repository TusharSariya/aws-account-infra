name: ansible

on:
  pull_request:

permissions:
  contents: read

jobs:
  # display-mode.sh is the first root-privileged shell script in this repo that
  # stops system units, on a host whose only remote access is tailnet SSH. The
  # bats suite covers the greeter-UID guards, which are what stand between a
  # normal run and stopping the invoking user's own session manager.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and bats
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats
      # Every existing script already passes, so this is a gate that holds the
      # line rather than one that needs a cleanup first.
      - run: shellcheck scripts/*.sh scripts/git-hooks/* mocks/localstack/smoke.sh
      - run: bats tests/

  lint:
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: ansible/ansible.cfg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ansible-core==2.18.6 ansible-lint==25.5.0
      - run: ansible-galaxy collection install -r ansible/requirements.yml
      # ansible.cfg sets vault_password_file, and ansible-core ERRORS at startup if
      # that path is absent — regardless of whether anything needs decrypting. CI
      # cannot hold the real password, so give it a placeholder purely to satisfy the
      # existence check. The committed vault ciphertext then fails to decrypt, which
      # ansible-lint downgrades to a warning and skips; every other file still lints.
      - name: Provide a placeholder vault password (CI holds no real secret)
        run: |
          mkdir -p ~/.config/aws-account-infra
          printf 'ci-placeholder-not-a-real-password' > ~/.config/aws-account-infra/vault-password
          chmod 600 ~/.config/aws-account-infra/vault-password
      - run: ansible-lint ansible
      - name: syntax check
        run: |
          for playbook in ansible/playbooks/*.yml; do
            ansible-playbook -i ansible/inventories/example/hosts.yml "$playbook" --syntax-check
          done
