name: organization-validate

on:
  pull_request:
    paths:
      - live/aws/organization/**
      - live/external/**
      - modules/external/**
      - templates/service-stack/**
      - modules/aws/module_distribution/**
      - modules/aws/vended_account_baseline/**
      - catalog/policies/**
      - scripts/vend-account.sh
      - scripts/repository-tofu.py
      - scripts/external-provider-reconciler.py
      - scripts/supabase-restore.py
      - scripts/supabase-auth-canary.py
      - scripts/supabase-local-auth-canary.py
      - scripts/publish-module.sh
      - scripts/verify-module.sh
  push:
    branches: [main]
    paths:
      - live/aws/organization/**
      - live/external/**
      - modules/external/**
      - templates/service-stack/**
      - modules/aws/module_distribution/**
      - modules/aws/vended_account_baseline/**
      - catalog/policies/**
      - scripts/vend-account.sh
      - scripts/repository-tofu.py
      - scripts/external-provider-reconciler.py
      - scripts/supabase-restore.py
      - scripts/supabase-auth-canary.py
      - scripts/supabase-local-auth-canary.py
      - scripts/publish-module.sh
      - scripts/verify-module.sh

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - live/aws/organization/organization
          - live/aws/organization/accounts
          - live/aws/organization/access
          - live/aws/organization/bootstrap
          - live/aws/organization/repositories
          - live/aws/organization/security
          - live/aws/organization/external-control
          - live/aws/organization/template-bootstrap
          - live/external/supabase
          - modules/aws/module_distribution
          - modules/aws/vended_account_baseline
          - modules/external/supabase_project
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.11.5
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false -input=false
      - run: tofu validate

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python3 -m py_compile scripts/repository-tofu.py scripts/external-provider-reconciler.py scripts/supabase-restore.py scripts/supabase-auth-canary.py scripts/supabase-local-auth-canary.py
      - run: bash -n scripts/vend-account.sh scripts/publish-module.sh scripts/verify-module.sh
      - run: python3 -m json.tool catalog/policies/court-booker.json >/dev/null
      - run: python3 -m json.tool catalog/policies/platform.json >/dev/null
