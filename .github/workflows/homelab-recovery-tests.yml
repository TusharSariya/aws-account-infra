name: homelab-recovery-tests

on:
  workflow_call:
permissions:
  contents: read

jobs:
  backup-contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos-light"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/talos-runner-setup
      - name: Check recovery compatibility and failure guards
        run: python3 -m unittest discover -s scripts/tests -p test_homelab_backup.py

  identity:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos-light"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/talos-runner-setup
      - uses: ./.github/actions/setup-opentofu
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - name: Validate and test identity with mock AWS provider
        working-directory: live/aws/staging/workloads/homelab-recovery
        run: |
          tofu init -backend=false -lockfile=readonly -input=false
          tofu validate
          tofu test
      - name: Exercise disposable certificate chain
        run: bash scripts/tests/homelab-backup-certificates.sh
