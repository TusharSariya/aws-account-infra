name: homelab-ci-admission
on:
  pull_request:
    paths:
      - 'live/kubernetes/homelab-ci/**'
      - 'live/kubernetes/homelab-management/**'
      - 'controllers/homelab-capacity/**'
      - 'platform/automatic-power/**'
      - 'config/environments/kubernetes/homelab-ci/**'
      - 'charts/homelab-queue/**'
      - 'charts/homelab-cache/**'
      - 'charts/homelab-always-on/**'
      - 'charts/homelab-lifecycle/**'
      - 'charts/homelab-jobs/**'
      - 'apps/platform/lifecycle/**'
      - 'apps/platform/jobs/**'
      - 'config/environments/kubernetes/homelab/**'
      - 'scripts/homelab-power-hold.py'
      - 'apps/platform/cache/**'
      - 'apps/platform/storage/**'
      - 'scripts/cache_capacity.py'
      - 'scripts/cache_download.py'
      - 'scripts/cache_transport.py'
      - 'scripts/build_cache.py'
      - 'scripts/nexus_observation.py'
      - 'scripts/tests/test_build_cache.py'
      - 'scripts/tests/test_nexus_observation.py'
      - 'scripts/talos-cache-setup.sh'
      - 'scripts/tests/test_cache_transport.py'
      - 'scripts/tests/test_cache_download.py'
      - 'scripts/tests/test_registry_enrollment.py'
      - 'scripts/ci_scratch.py'
      - 'scripts/ci_measure.py'
      - 'scripts/ci_pod_usage.py'
      - 'scripts/tests/test_ci_pod_usage.py'
      - 'scripts/tests/test_local_cache.py'
      - 'scripts/tests/test_capacity_*.py'
      - 'scripts/homelab-ci.py'
      - 'scripts/kueue*'
      - 'scripts/runner_catalog.py'
      - 'scripts/tests/test_kueue_*.py'
      - 'scripts/tests/kueue_cel/**'
      - '.github/workflows/homelab-ci-admission.yml'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [plan, apply]
        default: plan
      confirm:
        description: Type homelab-ci to authorize an exact saved-plan apply
        type: string
        required: false
permissions:
  contents: read
  id-token: write
concurrency:
  # Only mutations share the deployment lock. PR plans must not cancel the
  # pending tofu-apply acceptance workflow (or be cancelled by it).
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && 'tofu-apply' || format('homelab-ci-plan-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # PR tests use the server; dispatched bootstrap remains independent of ARC.
    runs-on: ${{ github.event_name == 'pull_request' && 'homelab-talos-checks' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/talos-runner-setup
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', 'config/ci-python-pins.txt') }}
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: go
          toolchain: 1.26.1
          dependencies: ${{ hashFiles('**/go.sum', '**/go.mod') }}
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: providers
          toolchain: tofu-1.11.5
          dependencies: ${{ hashFiles('**/.terraform.lock.hcl') }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          cache-local-path: ${{ env.UV_CACHE_DIR || format('{0}/uv-cache', runner.temp) }}
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - uses: actions/setup-go@v6
        with:
          cache: false
          go-version: '1.26.1'
          cache-dependency-path: scripts/tests/kueue_cel/go.sum
      - uses: ./.github/actions/setup-opentofu
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - name: Verify admission artifacts, contracts and CEL behavior
        run: |
          uv run --with PyYAML==6.0.3 python scripts/homelab-ci.py setup
          uv run --with pytest --with PyYAML==6.0.3 --project controllers/homelab-capacity python -m pytest controllers/homelab-capacity/tests -q
          PYTHONPATH=scripts uv run --with pytest --with PyYAML==6.0.3 python -m pytest scripts/tests/test_homelab_node_readiness.py scripts/tests/test_homelab_power_hold.py scripts/tests/test_ci_management_preflight.py -q
          uv run --with PyYAML==6.0.3 python scripts/runner_catalog.py
          PYTHONPATH=scripts uv run --with PyYAML==6.0.3 python -m unittest discover -s scripts/tests -p 'test_kueue_*.py'
          for pattern in 'test_local_cache.py' 'test_capacity_*.py' 'test_cache_download.py' 'test_cache_transport.py' 'test_build_cache.py' 'test_nexus_observation.py' 'test_registry_enrollment.py' 'test_ci_pod_usage.py'; do
            PYTHONPATH=scripts uv run --with PyYAML==6.0.3 python -m unittest discover -s scripts/tests -p "$pattern"
          done
          uv run --with PyYAML==6.0.3 python scripts/tests/kueue_cel/generate.py "$RUNNER_TEMP/cel-cases.json"
          (cd scripts/tests/kueue_cel && CGO_ENABLED=0 go run . "$RUNNER_TEMP/cel-cases.json")
          tofu -chdir=live/kubernetes/homelab-management init -backend=false -input=false -lockfile=readonly
          tofu -chdir=live/kubernetes/homelab-management validate
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', 'config/ci-python-pins.txt') }}
          mode: save
          password: ${{ secrets.NEXUS_BUILD_CACHE_PASSWORD }}
        if: ${{ success() }}
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: go
          toolchain: 1.26.1
          dependencies: ${{ hashFiles('**/go.sum', '**/go.mod') }}
          mode: save
          password: ${{ secrets.NEXUS_BUILD_CACHE_PASSWORD }}
        if: ${{ success() }}
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: providers
          toolchain: tofu-1.11.5
          dependencies: ${{ hashFiles('**/.terraform.lock.hcl') }}
          mode: save
          password: ${{ secrets.NEXUS_BUILD_CACHE_PASSWORD }}
        if: ${{ success() }}
  admission:
    strategy:
      max-parallel: 1
      matrix:
        include:
          - {scope: management, root: homelab-management}
          - {scope: cache, root: homelab-ci}
    needs: contracts
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    # Bootstrap, upgrade and recovery cannot depend on ARC or CI_EXECUTOR: the
    # macOS operator runner when vars.CI_OPERATOR == 'mac', else hosted.
    runs-on: ${{ vars.CI_OPERATOR == 'mac' && fromJSON('["self-hosted","homelab-operator"]') || 'ubuntu-latest' }}
    environment: prod
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check apply confirmation
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$MODE" == apply ]]; then test "$CONFIRM" = homelab-ci; fi
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          cache-local-path: ${{ env.UV_CACHE_DIR || format('{0}/uv-cache', runner.temp) }}
      - uses: ./.github/actions/setup-opentofu
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.mode == 'apply' && vars.TOFU_APPLY_ROLE_ARN || vars.TOFU_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        if: runner.os != 'macOS'
        with:
          use-cache: false
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:github-ci
          version: 1.102.4
          hostname: gh-ci-admission-${{ github.run_id }}-${{ github.run_attempt }}
      - if: runner.os != 'macOS'
        run: sudo tailscale set --accept-routes=true
      - name: Verify tailnet reachability of the cluster (non-secret)
        if: runner.os != 'macOS'
        run: |
          tailscale status --json | python3 -c '
          import json, sys
          state = json.load(sys.stdin)
          print("backend", state["BackendState"], "self", state["Self"]["HostName"], state["Self"].get("Tags"))
          for peer in state["Peer"].values():
              if peer.get("PrimaryRoutes"):
                  print("subnet router", peer["HostName"], peer["PrimaryRoutes"], "online" if peer.get("Online") else "offline")'
          awk 'NR > 1 {print "route", $1, $2, $3}' /proc/net/route
          for target in 10.0.0.221:50000 10.0.0.222:50000 10.0.0.231:6443; do
            if python3 -c 'import socket, sys; host, port = sys.argv[1].rsplit(":", 1); socket.create_connection((host, int(port)), 5).close()' "$target"; then
              echo "$target reachable"
            else
              echo "::warning::$target not reachable over the tailnet"
            fi
          done
      - name: Require the operator Mac's existing tailnet session
        if: runner.os == 'macOS'
        run: tailscale status --json | python3 -c 'import json,sys; state = json.load(sys.stdin)["BackendState"]; assert state == "Running", "tailscale BackendState is " + state'
      - id: private
        run: |
          umask 077
          echo "path=$(mktemp -d "$RUNNER_TEMP/homelab-ci.XXXXXXXX")" >> "$GITHUB_OUTPUT"
      - name: Prepare independent cluster access and verified artifacts
        env:
          PRIVATE: ${{ steps.private.outputs.path }}
          TALOS_SECRETS_B64: ${{ secrets.TALOS_SECRETS_B64 }}
        run: |
          uv run scripts/talos-ci.py setup --acceptance --checks-only
          uv run scripts/talos-ci.py prepare --private "$PRIVATE"
          uv run scripts/talos-ci.py connect --private "$PRIVATE"
          echo "$HOME/.cache/aws-account-infra/talos" >> "$GITHUB_PATH"
          install -m 700 "$HOME/.cache/aws-account-infra/talos/kubectl-v1.36.3" "$PRIVATE/kubectl"
          echo "$PRIVATE" >> "$GITHUB_PATH"
          uv run --with PyYAML==6.0.3 python scripts/homelab-ci.py setup --scope "${{ matrix.scope }}"
          tofu -chdir=live/kubernetes/${{ matrix.root }} init -input=false -lockfile=readonly
          tofu -chdir=live/kubernetes/${{ matrix.root }} validate
      - name: Hold application capacity during infrastructure work
        if: inputs.mode == 'apply' || matrix.scope == 'cache'
        env:
          PRIVATE: ${{ steps.private.outputs.path }}
          SCOPE: ${{ matrix.scope }}
        run: |
          hosts=primary
          if [[ "$SCOPE" == management ]]; then hosts=primary,secondary; fi
          python3 scripts/homelab-power-hold.py acquire --kubeconfig "$PRIVATE/kubeconfig" --receipt "$PRIVATE/power-hold.json" --hosts "$hosts" --wait
      - name: Guard exact plan and capacity
        env:
          PRIVATE: ${{ steps.private.outputs.path }}
        run: uv run --with PyYAML==6.0.3 python scripts/homelab-ci.py plan --scope "${{ matrix.scope }}" --private "$PRIVATE"
      - name: Preserve existing ARC identity or enroll supplied bootstrap credentials
        if: inputs.mode == 'apply' && matrix.scope == 'cache'
        env:
          PRIVATE: ${{ steps.private.outputs.path }}
          ARC_GITHUB_APP_JSON_B64: ${{ secrets.ARC_GITHUB_APP_JSON_B64 }}
        run: |
          umask 077
          if [[ -z "$ARC_GITHUB_APP_JSON_B64" ]]; then
            uv run --with PyYAML==6.0.3 python scripts/homelab-ci.py enroll --scope "${{ matrix.scope }}" --private "$PRIVATE"
            exit 0
          fi
          python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path(os.environ['PRIVATE'], 'github-app.json').write_bytes(base64.b64decode(os.environ['ARC_GITHUB_APP_JSON_B64'], validate=True))
          PY
          uv run --with PyYAML==6.0.3 python scripts/homelab-ci.py enroll --scope "${{ matrix.scope }}" --private "$PRIVATE" --app-json "$PRIVATE/github-app.json"
          rm "$PRIVATE/github-app.json"
      - name: Apply saved plan and require fresh empty post-plan
        if: inputs.mode == 'apply'
        env:
          PRIVATE: ${{ steps.private.outputs.path }}
        run: uv run --with PyYAML==6.0.3 python scripts/homelab-ci.py apply --scope "${{ matrix.scope }}" --private "$PRIVATE"
      - name: Preserve non-secret execution receipt
        if: always() && steps.private.outputs.path != ''
        env:
          PRIVATE: ${{ steps.private.outputs.path }}
        run: |
          if [[ -f "$PRIVATE/ci-record.json" ]]; then cp "$PRIVATE/ci-record.json" ci-record.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homelab-ci-receipt-${{ matrix.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-record.json
          if-no-files-found: ignore
      - name: Release only this run's maintenance hold
        if: always() && steps.private.outputs.path != ''
        env:
          PRIVATE: ${{ steps.private.outputs.path }}
        run: |
          if [[ -f "$PRIVATE/power-hold.json" ]]; then
            python3 scripts/homelab-power-hold.py release --kubeconfig "$PRIVATE/kubeconfig" --receipt "$PRIVATE/power-hold.json"
          fi
      - name: Remove ephemeral credentials and saved plans
        if: always() && steps.private.outputs.path != ''
        env:
          PRIVATE: ${{ steps.private.outputs.path }}
        run: rm -rf -- "$PRIVATE"
