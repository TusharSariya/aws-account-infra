name: postgres-backup-image
on:
  pull_request:
    paths: ['apps/containers/postgres-backup/**', 'apps/platform/postgres/**', 'scripts/tests/test_postgres*', '.github/workflows/postgres-backup-image.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: postgres-backup-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Dedicated bounded build on the existing admitted runner; no global routing change.
    runs-on: homelab-talos-docker-small
    timeout-minutes: 45
    environment: prod
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/talos-runner-setup
        with:
          docker: 'true'
          packages: gh
      - uses: ./.github/actions/talos-build-cache
        id: cache
        with:
          platform: linux/amd64
          password: ${{ secrets.NEXUS_BUILD_CACHE_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config: ${{ steps.cache.outputs.config }}
          driver-opts: ${{ steps.cache.outputs.driver-opts }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: apps/containers/postgres-backup/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/tusharsariyaorg/homelab-postgres-backup:${{ github.event.pull_request.head.sha || github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/TusharSariyaOrg/aws-account-infra
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: ${{ steps.cache.outputs.cache-from }}
          cache-to: ${{ steps.cache.outputs.cache-to }}
          secret-files: ${{ steps.cache.outputs.secret-files }}
      - name: Report immutable reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh api /orgs/TusharSariyaOrg/packages/container/homelab-postgres-backup --jq .visibility)" = private
          echo "Pin ghcr.io/tusharsariyaorg/homelab-postgres-backup@$DIGEST in postgres-values.yaml after verification." >> "$GITHUB_STEP_SUMMARY"
