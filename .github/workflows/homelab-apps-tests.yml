name: homelab-apps-tests
on:
  pull_request:
    paths:
      - 'live/kubernetes/**'
      - 'charts/**'
      - 'apps/containers/**'
      - 'apps/platform/lifecycle/**'
      - 'apps/platform/jobs/**'
      - 'apps/platform/recovery/**'
      - 'scripts/ai-data-backup.py'
      - 'scripts/lifecycle_session.py'
      - 'scripts/homelab-lifecycle-maintenance.py'
      - '.github/workflows/homelab-lifecycle-maintenance.yml'
      - 'scripts/issue-lifecycle-credentials.py'
      - 'scripts/verify-ai-images.py'
      - 'scripts/ai-control.py'
      - 'scripts/argo-client-token.py'
      - 'scripts/odysseus-source-tests.py'
      - 'scripts/homelab-lifecycle-validate.py'
      - 'scripts/ollama-image-*.py'
      - 'scripts/ollama-image-*.sh'
      - 'scripts/tests/test_lifecycle_*.py'
      - 'scripts/tests/test_odysseus_*.py'
      - 'scripts/odysseus-image-context.py'
      - 'config/environments/kubernetes/**'
      - 'scripts/homelab-apps.py'
      - 'scripts/tests/test_homelab_apps.py'
      - 'scripts/tests/test_ai_*.py'
      - 'apps/platform/migration/**'
      - 'scripts/ai-migration.py'
      - '.github/workflows/homelab-ai-migration.yml'
      - 'scripts/tests/test_odysseus_backup.py'
      - 'scripts/odysseus-*.sh'
      - 'scripts/tests/test_deploy_units.py'
      - 'scripts/deploy-units.py'
      - 'deploy-units.json'
      - '.github/actions/kubernetes-deploy/**'
      - '.github/workflows/homelab-apps-tests.yml'
      - '.github/workflows/tofu-*.yml'
permissions:
  contents: read
jobs:
  application-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.5
      - name: Verify charts and application contracts
        run: |
          python3 scripts/homelab-apps.py setup
          uv run --with PyYAML==6.0.3 python -m unittest discover -s scripts/tests -p test_homelab_apps.py
          uv run --with PyYAML==6.0.3 python -m unittest discover -s scripts/tests -p "test_ai_*.py"
          uv run --with PyYAML==6.0.3 python -m unittest discover -s scripts/tests -p "test_lifecycle_*.py"
          uv run --with httpx==0.28.1 --with requests==2.34.2 python -m unittest discover -s scripts/tests -p "test_odysseus_*.py"
          docker run --rm --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges -v "$PWD:/repo:ro" -w /repo python:3.14-slim@sha256:cad9a2c871761c413caa6fdd6441c783451e740a48aaeba60ae62a8b53525ef6 python -m unittest discover -s scripts/tests -p test_odysseus_processes.py
          python3 -m unittest discover -s scripts/tests -p test_deploy_units.py
          python3 -m unittest discover -s scripts/tests -p test_odysseus_backup.py
          bash -n scripts/odysseus-backup.sh
          bash -n scripts/odysseus-setup-wizard.sh
          tofu -chdir=live/kubernetes/homelab init -backend=false -input=false -lockfile=readonly
          tofu -chdir=live/kubernetes/homelab validate
