name: checkov

# Policy-as-code scan of the Terraform/OpenTofu with Checkov's AWS ruleset.
# Pure file scan — no AWS creds, no OIDC. Reports on every PR; expensive steps run only for affected inputs, so the single
# `checkov` job is itself a stable required-check context. Suppressions live in
# /.checkov.yaml (skip-check) or inline `# checkov:skip=<id>:<reason>` comments.
on:
  workflow_call:
    inputs:
      directories:
        type: string
        required: true
permissions:
  contents: read

jobs:
  checkov:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos-docker-small"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/talos-runner-setup
        with:
          docker: 'true'
      - name: Scan selected Terraform directories
        env:
          SELECTED_DIRECTORIES: ${{ inputs.directories }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          directories = json.loads(os.environ['SELECTED_DIRECTORIES'])
          if not directories:
              raise SystemExit('No selected Terraform directories')
          subprocess.run(['docker', 'run', '--rm', '-v', os.getcwd() + ':/src:ro', '-w', '/src',
                          'ghcr.io/bridgecrewio/checkov:3.3.19',
                          *[arg for directory in directories for arg in ('-d', directory)],
                          '--framework', 'terraform', '--config-file', '/src/.checkov.yaml',
                          '--compact'], check=True)
          PYTHON
