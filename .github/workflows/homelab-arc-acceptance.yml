name: homelab-arc-acceptance
run-name: ${{ inputs.scenario == 'expiry' && format('ARC expiry {0}', inputs.fixture_id) || 'ARC compatibility' }}
on:
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        options: [compatibility, expiry]
        default: compatibility
      fixture_id:
        type: string
        required: false
      confirm:
        type: string
        required: false
  pull_request:
    types: [labeled, synchronize]
concurrency:
  group: arc-acceptance-${{ inputs.scenario == 'expiry' && inputs.fixture_id || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write
jobs:
  runner:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.scenario != 'expiry' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'arc-acceptance'))
    # Explicit proof before CI_EXECUTOR is switched. Cancellation must remove this Pod.
    runs-on: homelab-talos
    environment: prod
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/talos-runner-setup
        with:
          docker: 'true'
          aws: 'true'
          tailscale: 'true'
          packages: dnsutils openssh-client rsync
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Verify ARM execution before building
        run: |
          docker run --rm --platform linux/arm64 python:3.14-slim@sha256:cad9a2c871761c413caa6fdd6441c783451e740a48aaeba60ae62a8b53525ef6 \
            python -c 'import platform; assert platform.machine() == "aarch64"'
      - uses: ./.github/actions/talos-build-cache
        id: cache
        with:
          platform: linux/arm64
          password: ${{ secrets.NEXUS_BUILD_CACHE_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config: ${{ steps.cache.outputs.config }}
          driver-opts: ${{ steps.cache.outputs.driver-opts }}
      - name: Prove checked-out identity and disposable Docker
        run: |
          test -n "$RUNNER_NAME"
          git rev-parse HEAD
          docker info
          docker run --rm --privileged python:3.14-slim@sha256:cad9a2c871761c413caa6fdd6441c783451e740a48aaeba60ae62a8b53525ef6 sh -ec '
            mkdir /quota
            mount -t tmpfs -o size=4m tmpfs /quota
            if dd if=/dev/zero of=/quota/proof bs=1M count=8; then exit 1; fi
            umount /quota'
      - name: Verify temporary bind mounts reach the Docker sidecar
        run: |
          test "$TMPDIR" = "$RUNNER_TEMP"
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          printf proof > "$fixture/proof"
          docker run --rm --network none --mount "type=bind,src=$fixture,dst=/fixture,readonly" \
            python:3.14-slim@sha256:cad9a2c871761c413caa6fdd6441c783451e740a48aaeba60ae62a8b53525ef6 \
            python -c 'from pathlib import Path; assert Path("/fixture/proof").read_text() == "proof"'
      - name: ARM Linux build and tests
        run: bash scripts/lambda-package-arm.sh test
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:github-ci
          version: 1.102.4
          hostname: gh-arc-proof-${{ github.run_id }}-${{ github.run_attempt }}
      - run: sudo tailscale set --accept-routes=true --accept-dns=false
      - uses: ./.github/actions/talos-check
        with:
          operation: network
          secrets-b64: ${{ secrets.TALOS_SECRETS_B64 }}
  sized-runners:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.scenario != 'expiry' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'arc-acceptance'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: homelab-talos-light, cpu: '1', memory: '2147483648'}
          - {runner: homelab-talos-checks, cpu: '2', memory: '4294967296'}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/talos-runner-setup
      - name: Verify declared cgroup limits and allow concurrency observation
        env:
          EXPECTED_CPU: ${{ matrix.cpu }}
          EXPECTED_MEMORY: ${{ matrix.memory }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, time
          cgroup = pathlib.Path('/sys/fs/cgroup')
          if not (cgroup / 'cpu.max').exists():
              # Privileged containerd Pods expose the hierarchy root. Resolve
              # this process's actual cgroup instead of reading host limits.
              relative = next(line.split(':', 2)[2] for line in pathlib.Path('/proc/self/cgroup').read_text().splitlines() if line.startswith('0::'))
              cgroup = cgroup / relative.lstrip('/')
          quota, period = (cgroup / 'cpu.max').read_text().split()
          assert int(quota) / int(period) == int(os.environ['EXPECTED_CPU'])
          assert (cgroup / 'memory.max').read_text().strip() == os.environ['EXPECTED_MEMORY']
          assert 'DOCKER_HOST' not in os.environ
          print(json.dumps({'runner': os.environ['RUNNER_NAME'], 'started': time.time(),
                            'cpu': os.environ['EXPECTED_CPU'], 'memory': os.environ['EXPECTED_MEMORY']}), flush=True)
          time.sleep(120)
          print(json.dumps({'runner': os.environ['RUNNER_NAME'], 'finished': time.time()}))
          PYTHON
  expiry:
    # This controlled fixture must stay queued until GitHub expires the request.
    # The external monitor holds and removes its own Kueue blocker; no secrets
    # or checkout are needed here, and execution means the proof has failed.
    if: github.event_name == 'workflow_dispatch' && inputs.scenario == 'expiry' && inputs.confirm == 'observe-24h-expiry'
    runs-on: homelab-talos-light
    timeout-minutes: 1
    steps:
      - run: |
          echo '::error::Expiry fixture executed instead of expiring in the GitHub queue.'
          exit 1
