name: inference-image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inference-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: homelab-talos-docker-small
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/talos-runner-setup
        with:
          docker: 'true'
          packages: gh
      - uses: ./.github/actions/talos-build-cache
        id: cache
        with:
          platform: linux/amd64
          password: ${{ secrets.NEXUS_BUILD_CACHE_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config: ${{ steps.cache.outputs.config }}
          driver-opts: ${{ steps.cache.outputs.driver-opts }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: apps/platform/inference
          platforms: linux/amd64
          push: true
          tags: ghcr.io/tusharsariyaorg/homelab-inference:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/TusharSariyaOrg/aws-account-infra
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: ${{ steps.cache.outputs.cache-from }}
          cache-to: ${{ steps.cache.outputs.cache-to }}
          secret-files: ${{ steps.cache.outputs.secret-files }}
      - name: Verify imports from the published image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker run --rm --entrypoint python -v "$PWD/apps/platform/inference:/code:ro" "ghcr.io/tusharsariyaorg/homelab-inference@$DIGEST" -c 'import sys; sys.path.insert(0, "/code"); import gateway, certificates, runtime, store'
      - name: Report private immutable reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh api /orgs/TusharSariyaOrg/packages/container/homelab-inference --jq .visibility)" = private
          echo "Pin ghcr.io/tusharsariyaorg/homelab-inference@$DIGEST after acceptance; this workflow does not activate admission." >> "$GITHUB_STEP_SUMMARY"
