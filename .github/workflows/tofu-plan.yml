name: tofu-plan

on:
  pull_request:

concurrency:
  group: tofu-plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.units.outputs.units }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: units
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: echo "units=$(python3 scripts/deploy-units.py changed "$BASE_SHA" "$HEAD_SHA")" >> "$GITHUB_OUTPUT"

  validate:
    needs: detect
    if: needs.detect.outputs.units != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.detect.outputs.units) }}
    defaults:
      run:
        working-directory: ${{ matrix.unit.path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.11.5
      - name: format
        run: tofu fmt -check -recursive
      - name: initialize
        run: tofu init -backend=false -input=false
      - name: validate
        run: tofu validate

  plan-gate:
    needs: [detect, validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: gate
        run: |
          [[ "${{ needs.detect.result }}" == "success" ]] || exit 1
          [[ "${{ needs.validate.result }}" != "failure" && "${{ needs.validate.result }}" != "cancelled" ]] || exit 1
