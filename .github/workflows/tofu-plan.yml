name: tofu-plan

on:
  pull_request:

concurrency:
  group: tofu-plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  id-token: write
  contents: read
  pull-requests: write

jobs:
  detect:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos-light"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    outputs:
      units: ${{ steps.units.outputs.units }}
      aws_units: ${{ steps.units.outputs.aws_units }}
      checks: ${{ steps.units.outputs.checks }}
      terraform_dirs: ${{ steps.units.outputs.terraform_dirs }}
      applications: ${{ steps.units.outputs.applications }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/talos-runner-setup
      - id: units
        run: python3 scripts/ci-relevant-changes.py
  plan:
    needs: detect
    if: needs.detect.outputs.aws_units != '[]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos-checks"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.detect.outputs.aws_units) }}
    defaults:
      run:
        working-directory: ${{ matrix.unit.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/talos-runner-setup
        with:
          packages: dnsutils openssh-client rsync
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', 'config/ci-python-pins.txt') }}
          scope: ${{ toJSON(matrix) }}
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: providers
          toolchain: tofu-1.11.5
          dependencies: ${{ hashFiles('**/.terraform.lock.hcl') }}
          scope: ${{ toJSON(matrix) }}
      - uses: aws-actions/configure-aws-credentials@v4
        if: matrix.unit.cloud == 'aws'
        with:
          role-to-assume: ${{ vars.TOFU_PLAN_ROLE_ARN }}
          aws-region: ${{ matrix.unit.region }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          cache-local-path: ${{ env.UV_CACHE_DIR || format('{0}/uv-cache', runner.temp) }}
          python-version: "3.14"
      - uses: ./.github/actions/setup-opentofu
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - name: format
        run: tofu fmt -check -recursive
      - name: initialize
        run: tofu init -input=false -lockfile=readonly
      - name: validate
        run: tofu validate
      - name: plan
        shell: bash
        run: |
          set -o pipefail
          tofu plan -input=false -no-color -lock-timeout=5m \
            -var-file="$GITHUB_WORKSPACE/${{ matrix.unit.var_file }}" \
            -var "aws_profile=" -out=tfplan 2>&1 | tee plan.txt
      - name: comment plan
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '${{ matrix.unit.path }}/plan.txt';
            const plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'Plan did not produce output.';
            const body = `### tofu plan — \`${{ matrix.unit.id }}\`\n\n<details><summary>show</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', 'config/ci-python-pins.txt') }}
          mode: save
          password: ${{ secrets.NEXUS_BUILD_CACHE_PASSWORD }}
          scope: ${{ toJSON(matrix) }}
        if: ${{ success() }}
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: providers
          toolchain: tofu-1.11.5
          dependencies: ${{ hashFiles('**/.terraform.lock.hcl') }}
          mode: save
          password: ${{ secrets.NEXUS_BUILD_CACHE_PASSWORD }}
          scope: ${{ toJSON(matrix) }}
        if: ${{ success() }}
  proxmox-plan:
    needs: detect
    if: contains(fromJSON(needs.detect.outputs.units).*.id, 'proxmox-homelab') && github.event.pull_request.head.repo.full_name == github.repository
    # Off-cluster: the macOS operator runner when vars.CI_OPERATOR == 'mac', else hosted.
    runs-on: ${{ vars.CI_OPERATOR == 'mac' && fromJSON('["self-hosted","macOS","homelab-operator"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment: prod
    env:
      PROXMOX_VE_ENDPOINT: https://pve.tail2f646b.ts.net/
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_PLAN_API_TOKEN }}
    defaults:
      run:
        working-directory: live/proxmox/homelab
    steps:
      - uses: actions/checkout@v4
      - name: Check CI enrollment inputs
        env:
          TS_CLIENT_ID: ${{ vars.TS_OIDC_CLIENT_ID }}
          TS_AUDIENCE: ${{ vars.TS_OIDC_AUDIENCE }}
        run: |
          test -n "$TS_CLIENT_ID" && test -n "$TS_AUDIENCE" && test -n "$PROXMOX_VE_API_TOKEN"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TOFU_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        if: runner.os != 'macOS'
        with:
          use-cache: false
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:github-ci
          version: 1.102.4
          hostname: gh-proxmox-plan-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Require the operator Mac's existing tailnet session
        if: runner.os == 'macOS'
        run: tailscale status --json | python3 -c 'import json,sys; state = json.load(sys.stdin)["BackendState"]; assert state == "Running", "tailscale BackendState is " + state'
      - uses: ./.github/actions/setup-opentofu
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - name: Accept the laptop management subnet route
        if: runner.os != 'macOS'
        run: sudo tailscale set --accept-routes=true
      - name: Wake and hold both retained Proxmox hosts
        id: power_hold
        uses: ./.github/actions/host-power-hold
        with:
          action: acquire
          secrets-b64: ${{ secrets.TALOS_SECRETS_B64 }}
      - name: Verify authenticated HTTPS and plan token scope
        run: python3 ../../../scripts/proxmox-ci-check.py plan
      - name: Initialize and validate
        run: |
          tofu fmt -check -recursive
          tofu init -input=false -lockfile=readonly
          tofu validate
      - name: Plan proposed VMs without applying
        run: |
          set -o pipefail
          tofu plan -input=false -no-color -lock-timeout=60s \
            -var-file=../../../config/environments/proxmox/homelab/vms.tfvars \
            -var=vm_creation_approved=true 2>&1 | tee plan.txt
      - name: Comment Proxmox plan
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'live/proxmox/homelab/plan.txt';
            const plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'No plan produced; inspect the failed CI step.';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Proxmox plan\nCommit: ${{ github.event.pull_request.head.sha }}\n\nPreview only; VM creation requires the apply label.\n\n<details><summary>Plan</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n</details>`
            });

      - name: Release Proxmox plan hold
        if: always() && steps.power_hold.outputs.private-path != ''
        uses: ./.github/actions/host-power-hold
        with:
          action: release
          private-path: ${{ steps.power_hold.outputs.private-path }}

  talos-plan:
    needs: detect
    if: contains(fromJSON(needs.detect.outputs.units).*.id, 'talos-homelab') && github.event.pull_request.head.repo.full_name == github.repository
    # Off-cluster: the macOS operator runner when vars.CI_OPERATOR == 'mac', else hosted.
    runs-on: ${{ vars.CI_OPERATOR == 'mac' && fromJSON('["self-hosted","macOS","homelab-operator"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TOFU_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        if: runner.os != 'macOS'
        with:
          use-cache: false
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:github-ci
          version: 1.102.4
          hostname: gh-talos-plan-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Accept homelab subnet route
        if: runner.os != 'macOS'
        run: sudo tailscale set --accept-routes=true
      - name: Require the operator Mac's existing tailnet session
        if: runner.os == 'macOS'
        run: tailscale status --json | python3 -c 'import json,sys; state = json.load(sys.stdin)["BackendState"]; assert state == "Running", "tailscale BackendState is " + state'
      - uses: ./.github/actions/setup-opentofu
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          cache-local-path: ${{ env.UV_CACHE_DIR || format('{0}/uv-cache', runner.temp) }}
      - name: Plan Talos through visible guarded stages
        uses: ./.github/actions/talos-deploy
        with:
          mode: plan
          secrets-b64: ${{ secrets.TALOS_SECRETS_B64 }}
      - name: Comment sanitized Talos plan
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.existsSync('talos-plan.txt') ? fs.readFileSync('talos-plan.txt', 'utf8') : 'No plan produced; inspect CI status.';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Talos plan\nCommit: ${{ github.event.pull_request.head.sha }}\n\n\`\`\`json\n${plan.slice(-20000)}\n\`\`\``
            });

  applications-plan:
    needs: detect
    if: contains(fromJSON(needs.detect.outputs.units).*.id, 'kubernetes-homelab') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos-checks"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    timeout-minutes: 20
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/talos-runner-setup
        with:
          tailscale: 'true'
          packages: dnsutils openssh-client rsync
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: providers
          toolchain: tofu-1.11.5
          dependencies: ${{ hashFiles('**/.terraform.lock.hcl') }}
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', 'config/ci-python-pins.txt') }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TOFU_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          use-cache: false
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:github-ci
          version: 1.102.4
          hostname: gh-apps-plan-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Accept homelab subnet route
        run: sudo tailscale set --accept-routes=true --accept-dns=false
      - uses: ./.github/actions/setup-opentofu
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          cache-local-path: ${{ env.UV_CACHE_DIR || format('{0}/uv-cache', runner.temp) }}
      - name: Plan Kubernetes applications
        uses: ./.github/actions/kubernetes-deploy
        with:
          mode: plan
          secrets-b64: ${{ secrets.TALOS_SECRETS_B64 }}
      - name: Comment sanitized application plan
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.existsSync('applications-plan.txt') ? fs.readFileSync('applications-plan.txt', 'utf8') : 'No plan produced; inspect CI status.';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Application plan\nCommit: ${{ github.event.pull_request.head.sha }}\n\n\`\`\`json\n${plan.slice(-20000)}\n\`\`\``
            });

      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: providers
          toolchain: tofu-1.11.5
          dependencies: ${{ hashFiles('**/.terraform.lock.hcl') }}
          mode: save
          password: ${{ secrets.NEXUS_BUILD_CACHE_PASSWORD }}
        if: ${{ success() }}
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', 'config/ci-python-pins.txt') }}
          mode: save
          password: ${{ secrets.NEXUS_BUILD_CACHE_PASSWORD }}
        if: ${{ success() }}
  plan-gate:
    needs: [detect, plan, proxmox-plan, talos-plan, applications-plan, checkov, tflint, trivy, shell, homelab-config-tests, homelab-apps-tests, homelab-recovery-tests, runner-catalog, kubernetes-validation, main-platform-validation]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos-light"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          assert needs['detect']['result'] == 'success', 'Selection failed'
          for name in json.loads(needs['detect']['outputs']['checks']):
              if name in needs:
                  assert needs[name]['result'] == 'success', name + ' did not succeed'
          PYTHON
      - name: gate
        run: |
          [[ "${{ needs.detect.result }}" == "success" ]] || exit 1
          [[ "${{ needs.plan.result }}" != "failure" && "${{ needs.plan.result }}" != "cancelled" ]] || exit 1
          if [[ '${{ contains(fromJSON(needs.detect.outputs.units).*.id, 'proxmox-homelab') }}' == true ]]; then
            [[ "${{ needs.proxmox-plan.result }}" == success ]] || {
              echo '::error::Proxmox plan must succeed from a trusted repository branch.'; exit 1;
            }
          fi
          if [[ '${{ contains(fromJSON(needs.detect.outputs.units).*.id, 'talos-homelab') }}' == true ]]; then
            [[ "${{ needs.talos-plan.result }}" == success ]] || {
              echo '::error::Talos plan must succeed from a trusted repository branch.'; exit 1;
            }
          fi
          if [[ '${{ contains(fromJSON(needs.detect.outputs.units).*.id, 'kubernetes-homelab') }}' == true ]]; then
            [[ "${{ needs.applications-plan.result }}" == success ]] || {
              echo '::error::Application plan must succeed from a trusted branch.'; exit 1;
            }
          fi
  checkov:
    needs: detect
    if: contains(fromJSON(needs.detect.outputs.checks), 'checkov') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/checkov.yml
    secrets: inherit
    with:
      directories: ${{ needs.detect.outputs.terraform_dirs }}
  tflint:
    needs: detect
    if: contains(fromJSON(needs.detect.outputs.checks), 'tflint') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/tflint.yml
    secrets: inherit
    with:
      directories: ${{ needs.detect.outputs.terraform_dirs }}
  trivy:
    needs: detect
    if: contains(fromJSON(needs.detect.outputs.checks), 'trivy') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/trivy.yml
    secrets: inherit
  shell:
    needs: detect
    if: contains(fromJSON(needs.detect.outputs.checks), 'shell') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/shell.yml
    secrets: inherit
  homelab-config-tests:
    needs: detect
    if: contains(fromJSON(needs.detect.outputs.checks), 'homelab-config-tests') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/homelab-config-tests.yml
    secrets: inherit
    with:
      checks: ${{ needs.detect.outputs.checks }}
  homelab-apps-tests:
    needs: detect
    if: contains(fromJSON(needs.detect.outputs.checks), 'homelab-apps-tests') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/homelab-apps-tests.yml
    secrets: inherit
    with:
      checks: ${{ needs.detect.outputs.checks }}
  homelab-recovery-tests:
    needs: detect
    if: contains(fromJSON(needs.detect.outputs.checks), 'homelab-recovery-tests') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/homelab-recovery-tests.yml
    secrets: inherit
  runner-catalog:
    needs: detect
    if: contains(fromJSON(needs.detect.outputs.checks), 'runner-catalog') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/runner-catalog.yml
    secrets: inherit
  kubernetes-validation:
    needs: detect
    if: contains(fromJSON(needs.detect.outputs.checks), 'kubernetes-validation') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/kubernetes-validation.yml
    secrets: inherit
  main-platform-validation:
    needs: detect
    if: contains(fromJSON(needs.detect.outputs.checks), 'main-platform-validation') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/main-platform-validation.yml
    secrets: inherit
