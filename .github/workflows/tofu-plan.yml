name: tofu-plan

on:
  pull_request:

concurrency:
  group: tofu-plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.units.outputs.units }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: units
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: echo "units=$(python3 scripts/deploy-units.py changed "$BASE_SHA" "$HEAD_SHA")" >> "$GITHUB_OUTPUT"

  plan:
    needs: detect
    if: needs.detect.outputs.units != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.detect.outputs.units) }}
    defaults:
      run:
        working-directory: ${{ matrix.unit.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        if: matrix.unit.cloud == 'aws'
        with:
          role-to-assume: ${{ vars.TOFU_PLAN_ROLE_ARN }}
          aws-region: ${{ matrix.unit.region }}
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.5
      - name: format
        run: tofu fmt -check -recursive
      - name: initialize
        run: tofu init -input=false
      - name: validate
        run: tofu validate
      - name: plan
        shell: bash
        run: |
          set -o pipefail
          tofu plan -input=false -no-color \
            -var-file="$GITHUB_WORKSPACE/${{ matrix.unit.var_file }}" \
            -var "aws_profile=" -out=tfplan 2>&1 | tee plan.txt
      - name: comment plan
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '${{ matrix.unit.path }}/plan.txt';
            const plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'Plan did not produce output.';
            const body = `### tofu plan — \`${{ matrix.unit.id }}\`\n\n<details><summary>show</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  plan-gate:
    needs: [detect, plan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: gate
        run: |
          [[ "${{ needs.detect.result }}" == "success" ]] || exit 1
          [[ "${{ needs.plan.result }}" != "failure" && "${{ needs.plan.result }}" != "cancelled" ]] || exit 1
