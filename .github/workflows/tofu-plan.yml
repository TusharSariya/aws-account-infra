name: tofu-plan

on:
  pull_request:

concurrency:
  group: tofu-plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.units.outputs.units }}
      aws_units: ${{ steps.units.outputs.aws_units }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: units
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          units=$(python3 scripts/deploy-units.py changed "$BASE_SHA" "$HEAD_SHA")
          jq -e 'all(.[]; .cloud == "aws" or (.cloud == "proxmox" and .id == "proxmox-homelab") or (.cloud == "talos" and .id == "talos-homelab"))' <<< "$units" > /dev/null
          echo "units=$units" >> "$GITHUB_OUTPUT"
          echo "aws_units=$(jq -c '[.[] | select(.cloud == "aws")]' <<< "$units")" >> "$GITHUB_OUTPUT"

  plan:
    needs: detect
    if: needs.detect.outputs.aws_units != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.detect.outputs.aws_units) }}
    defaults:
      run:
        working-directory: ${{ matrix.unit.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        if: matrix.unit.cloud == 'aws'
        with:
          role-to-assume: ${{ vars.TOFU_PLAN_ROLE_ARN }}
          aws-region: ${{ matrix.unit.region }}
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.5
      - name: format
        run: tofu fmt -check -recursive
      - name: initialize
        run: tofu init -input=false
      - name: validate
        run: tofu validate
      - name: plan
        shell: bash
        run: |
          set -o pipefail
          tofu plan -input=false -no-color \
            -var-file="$GITHUB_WORKSPACE/${{ matrix.unit.var_file }}" \
            -var "aws_profile=" -out=tfplan 2>&1 | tee plan.txt
      - name: comment plan
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '${{ matrix.unit.path }}/plan.txt';
            const plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'Plan did not produce output.';
            const body = `### tofu plan — \`${{ matrix.unit.id }}\`\n\n<details><summary>show</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  proxmox-plan:
    needs: detect
    if: contains(needs.detect.outputs.units, 'proxmox-homelab') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    env:
      PROXMOX_VE_ENDPOINT: https://pve.tail2f646b.ts.net/
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_PLAN_API_TOKEN }}
    defaults:
      run:
        working-directory: live/proxmox/homelab
    steps:
      - uses: actions/checkout@v4
      - name: Check CI enrollment inputs
        env:
          TS_CLIENT_ID: ${{ vars.TS_OIDC_CLIENT_ID }}
          TS_AUDIENCE: ${{ vars.TS_OIDC_AUDIENCE }}
        run: |
          test -n "$TS_CLIENT_ID" && test -n "$TS_AUDIENCE" && test -n "$PROXMOX_VE_API_TOKEN"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TOFU_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:github-ci
          version: 1.102.4
          hostname: gh-proxmox-plan-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.5
      - name: Verify authenticated HTTPS and plan token scope
        run: python3 ../../../scripts/proxmox-ci-check.py plan
      - name: Initialize and validate
        run: |
          tofu fmt -check -recursive
          tofu init -input=false -lockfile=readonly
          tofu validate
      - name: Plan proposed VMs without applying
        run: |
          set -o pipefail
          tofu plan -input=false -no-color -lock-timeout=60s \
            -var-file=../../../config/environments/proxmox/homelab/vms.tfvars \
            -var=vm_creation_approved=true 2>&1 | tee plan.txt
      - name: Comment Proxmox plan
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'live/proxmox/homelab/plan.txt';
            const plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'No plan produced; inspect the failed CI step.';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Proxmox plan\nCommit: ${{ github.event.pull_request.head.sha }}\n\nPreview only; VM creation requires the apply label.\n\n<details><summary>Plan</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n</details>`
            });

  talos-plan:
    needs: detect
    if: contains(needs.detect.outputs.units, 'talos-homelab') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TOFU_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:github-ci
          version: 1.102.4
          hostname: gh-talos-plan-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Accept homelab subnet route
        run: sudo tailscale set --accept-routes=true
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - uses: astral-sh/setup-uv@v6
      - name: Guarded Talos plan
        env:
          TALOS_SECRETS_YAML: ${{ secrets.TALOS_SECRETS_YAML }}
        run: |
          set -o pipefail
          uv run scripts/talos-ci.py plan | tee talos-plan.txt
      - name: Comment sanitized Talos plan
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.existsSync('talos-plan.txt') ? fs.readFileSync('talos-plan.txt', 'utf8') : 'No plan produced; inspect CI status.';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Talos plan\nCommit: ${{ github.event.pull_request.head.sha }}\n\n\`\`\`json\n${plan.slice(-20000)}\n\`\`\``
            });

  plan-gate:
    needs: [detect, plan, proxmox-plan, talos-plan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: gate
        run: |
          [[ "${{ needs.detect.result }}" == "success" ]] || exit 1
          [[ "${{ needs.plan.result }}" != "failure" && "${{ needs.plan.result }}" != "cancelled" ]] || exit 1
          if [[ '${{ contains(needs.detect.outputs.units, 'proxmox-homelab') }}' == true ]]; then
            [[ "${{ needs.proxmox-plan.result }}" == success ]] || {
              echo '::error::Proxmox plan must succeed from a trusted repository branch.'; exit 1;
            }
          fi
          if [[ '${{ contains(needs.detect.outputs.units, 'talos-homelab') }}' == true ]]; then
            [[ "${{ needs.talos-plan.result }}" == success ]] || {
              echo '::error::Talos plan must succeed from a trusted repository branch.'; exit 1;
            }
          fi
