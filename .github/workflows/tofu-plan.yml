name: tofu-plan

on:
  pull_request:
    paths:
      - "account/**"
      - "stacks/**"
      - "modules/**"
      - "common.tfvars"
      - ".github/workflows/tofu-plan.yml"

# One plan run per PR ref; newer pushes cancel older runs.
concurrency:
  group: tofu-plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write # assume the OIDC role
  contents: read
  pull-requests: write # comment the plan

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.set.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            account:
              - 'account/**'
              - 'modules/**'
              - 'common.tfvars'
            rag:
              - 'stacks/rag/**'
              - 'modules/**'
              - 'common.tfvars'
      - id: set
        run: |
          stacks=()
          [[ "${{ steps.filter.outputs.account }}" == "true" ]] && stacks+=('"account"')
          [[ "${{ steps.filter.outputs.rag }}" == "true" ]] && stacks+=('"stacks/rag"')
          echo "stacks=[$(IFS=,; echo "${stacks[*]}")]" >> "$GITHUB_OUTPUT"

  plan:
    needs: detect
    if: needs.detect.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.detect.outputs.stacks) }}
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TOFU_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.5

      - name: fmt check
        run: tofu fmt -check -recursive

      - name: init
        run: tofu init -input=false

      - name: validate
        run: tofu validate

      - name: plan
        id: plan
        # pipefail so a tofu error fails the step (the `| tee` otherwise masks the
        # exit code). aws_profile="" overrides common.tfvars so the provider uses
        # the OIDC ambient creds instead of the Mac's local profile/assume-role.
        shell: bash
        run: |
          set -o pipefail
          tofu plan -input=false -no-color \
            -var-file="$GITHUB_WORKSPACE/common.tfvars" -var "aws_profile=" \
            -out=tfplan 2>&1 | tee plan.txt

      - name: comment plan
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ matrix.stack }}/plan.txt', 'utf8');
            const body = `### tofu plan — \`${{ matrix.stack }}\`\n\n<details><summary>show</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
