name: tofu-apply

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tofu-apply
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.units.outputs.units }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: units
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ || -z "$BASE_SHA" ]]; then
            BASE_SHA="${HEAD_SHA}^"
          fi
          echo "units=$(python3 scripts/deploy-units.py changed "$BASE_SHA" "$HEAD_SHA")" >> "$GITHUB_OUTPUT"

  apply:
    needs: detect
    if: needs.detect.outputs.units != '[]'
    runs-on: ubuntu-latest
    environment: platform-prod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.TOFU_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.11.5
      - name: Apply deploy units in dependency order
        env:
          UNITS_JSON: ${{ needs.detect.outputs.units }}
        run: |
          python3 - <<'PY' > /tmp/deploy-units.tsv
          import json
          import os

          for unit in json.loads(os.environ["UNITS_JSON"]):
              if unit["cloud"] != "aws":
                  raise SystemExit(f"CI apply is not configured for cloud {unit['cloud']!r}")
              print(f"{unit['id']}\t{unit['path']}\t{unit['var_file']}")
          PY

          while IFS=$'\t' read -r id path var_file; do
            echo "::group::Apply $id"
            tofu -chdir="$path" init -input=false
            tofu -chdir="$path" apply -input=false -auto-approve \
              -var-file="$GITHUB_WORKSPACE/$var_file" -var "aws_profile="
            echo "::endgroup::"
          done < /tmp/deploy-units.tsv

  apply-gate:
    needs: [detect, apply]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: gate
        run: |
          [[ "${{ needs.detect.result }}" == "success" ]] || exit 1
          if [[ "${{ needs.detect.outputs.units }}" == "[]" ]]; then exit 0; fi
          if [[ "${{ needs.apply.result }}" == "skipped" ]]; then exit 0; fi
          [[ "${{ needs.apply.result }}" == "success" ]] || {
            echo "::error::Main-branch apply failed."; exit 1;
          }
