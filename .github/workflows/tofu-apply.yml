name: tofu-apply

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: tofu-apply
  cancel-in-progress: false

permissions:
  actions: read
  id-token: write
  contents: read
  pull-requests: read

jobs:
  detect:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos-light"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    outputs:
      units: ${{ steps.units.outputs.units }}
      suite: ${{ steps.units.outputs.suite }}
      storage: ${{ steps.units.outputs.storage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/talos-runner-setup
      - id: units
        run: python3 scripts/ci-relevant-changes.py
  apply:
    needs: detect
    if: needs.detect.outputs.units != '[]' && contains(github.event.pull_request.labels.*.name, 'apply') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ (contains(fromJSON(needs.detect.outputs.units).*.id, 'proxmox-homelab') || contains(fromJSON(needs.detect.outputs.units).*.id, 'talos-homelab')) && 'ubuntu-latest' || fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos-checks"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    environment: prod
    outputs:
      needs_worker_reboot: ${{ steps.talos.outputs.needs-worker-reboot }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/talos-runner-setup
        with:
          aws: 'true'
          tailscale: 'true'
          packages: dnsutils openssh-client rsync gh
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', '.github/workflows/*.yml') }}
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: providers
          toolchain: tofu-1.11.5
          dependencies: ${{ hashFiles('**/.terraform.lock.hcl') }}
      - name: Check application credentials before any deployment
        if: contains(fromJSON(needs.detect.outputs.units).*.id, 'kubernetes-homelab')
        env:
          TS_OPERATOR_CLIENT_ID: ${{ secrets.TS_OPERATOR_CLIENT_ID }}
          TS_OPERATOR_CLIENT_SECRET: ${{ secrets.TS_OPERATOR_CLIENT_SECRET }}
          PIHOLE_ADMIN_PASSWORD: ${{ secrets.PIHOLE_ADMIN_PASSWORD }}
          GHCR_READ_USER: ${{ secrets.GHCR_READ_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          ODYSSEUS_ADMIN_PASSWORD: ${{ secrets.ODYSSEUS_ADMIN_PASSWORD }}
          SEARXNG_SECRET: ${{ secrets.SEARXNG_SECRET }}
          POSTGRES_BACKUP_CREDENTIALS_B64: ${{ secrets.POSTGRES_BACKUP_CREDENTIALS_B64 }}
          AI_LIFECYCLE_CREDENTIALS_B64: ${{ secrets.AI_LIFECYCLE_CREDENTIALS_B64 }}
        run: python3 scripts/homelab-apps.py credentials
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TOFU_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          cache-local-path: ${{ env.UV_CACHE_DIR || format('{0}/uv-cache', runner.temp) }}
          python-version: "3.14"
      - uses: ./.github/actions/setup-opentofu
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - name: Connect to Proxmox tailnet
        if: contains(fromJSON(needs.detect.outputs.units).*.id, 'proxmox-homelab') || contains(fromJSON(needs.detect.outputs.units).*.id, 'talos-homelab') || contains(fromJSON(needs.detect.outputs.units).*.id, 'kubernetes-homelab')
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          use-cache: false
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:github-ci
          version: 1.102.4
          hostname: gh-proxmox-apply-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Accept homelab subnet route
        if: contains(fromJSON(needs.detect.outputs.units).*.id, 'proxmox-homelab') || contains(fromJSON(needs.detect.outputs.units).*.id, 'talos-homelab') || contains(fromJSON(needs.detect.outputs.units).*.id, 'kubernetes-homelab')
        run: |
          # Resolve from the tailnet map, not the OS resolver which we opt out below.
          if [[ '${{ contains(fromJSON(needs.detect.outputs.units).*.id, 'proxmox-homelab') }}' == true ]]; then
            pve_ip=$(python3 scripts/homelab-apps.py resolve --hostname pve.tail2f646b.ts.net)
            printf '%s pve.tail2f646b.ts.net\n' "$pve_ip" | sudo tee -a /etc/hosts > /dev/null
          fi
          sudo tailscale set --accept-routes=true --accept-dns=false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          cache-local-path: ${{ env.UV_CACHE_DIR || format('{0}/uv-cache', runner.temp) }}
        if: contains(fromJSON(needs.detect.outputs.units).*.id, 'talos-homelab') || contains(fromJSON(needs.detect.outputs.units).*.id, 'kubernetes-homelab')
      - name: Wake and hold retained hosts before Proxmox changes
        if: contains(fromJSON(needs.detect.outputs.units).*.id, 'proxmox-homelab')
        id: power_hold
        uses: ./.github/actions/host-power-hold
        with:
          action: acquire
          secrets-b64: ${{ secrets.TALOS_SECRETS_B64 }}
      - name: Verify Proxmox apply identity
        if: contains(fromJSON(needs.detect.outputs.units).*.id, 'proxmox-homelab')
        env:
          PROXMOX_VE_ENDPOINT: https://pve.tail2f646b.ts.net/
          PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_APPLY_API_TOKEN }}
        run: python3 scripts/proxmox-ci-check.py apply
      - name: Apply AWS and Proxmox prerequisites in dependency order
        env:
          UNITS_JSON: ${{ needs.detect.outputs.units }}
          PROXMOX_VE_ENDPOINT: https://pve.tail2f646b.ts.net/
          PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_APPLY_API_TOKEN }}
        run: |
          python3 - <<'PY' > /tmp/deploy-units.tsv
          import json
          import os

          units = json.loads(os.environ["UNITS_JSON"])
          # Foundation then applications execute as visible stages after the loop.
          tail = [u['id'] for u in units if u['cloud'] in ('talos', 'kubernetes')]
          expected = [name for name in ('talos-homelab', 'kubernetes-homelab') if name in tail]
          if tail != expected or (tail and [u['id'] for u in units[-len(tail):]] != tail):
              raise SystemExit('Unsupported foundation/application dependency order')
          for unit in units:
              if unit["cloud"] not in {"aws", "proxmox", "talos", "kubernetes"}:
                  raise SystemExit(f"CI apply is not configured for cloud {unit['cloud']!r}")
              print(f"{unit['id']}\t{unit['path']}\t{unit['var_file']}\t{unit['cloud']}")
          PY

          # Reuse large provider binaries across this serial multi-unit apply.
          # Separate copies per root exceed the checks runner's 4-GiB scratch limit.
          export TF_PLUGIN_CACHE_DIR="${TF_PLUGIN_CACHE_DIR:-$RUNNER_TEMP/tofu-provider-cache}"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          while IFS=$'\t' read -r id path var_file cloud; do
            echo "::group::Apply $id"
            if [[ "$cloud" == talos || "$cloud" == kubernetes ]]; then
              echo "::endgroup::"
              continue
            fi
            tofu -chdir="$path" init -input=false
            case "$cloud" in
              aws) extra=(-var "aws_profile=") ;;
              proxmox) extra=(-var "vm_creation_approved=true") ;;
              *) echo "Unsupported deployment cloud: $cloud" >&2; exit 1 ;;
            esac
            tofu -chdir="$path" apply -input=false -auto-approve -lock-timeout=60s \
              -var-file="$GITHUB_WORKSPACE/$var_file" "${extra[@]}"
            echo "::endgroup::"
          done < /tmp/deploy-units.tsv

      - name: Initialize iRacing calendar after apply
        if: contains(fromJSON(needs.detect.outputs.units).*.id, 'aws-staging-iracing-calendar')
        run: uv run --frozen --directory apps/lambda/python/3.14/iracing-calendar python -m iracing_calendar.cli sync --function iracing-calendar-sync

      - name: Initialize swimming calendar after apply
        if: contains(fromJSON(needs.detect.outputs.units).*.id, 'aws-staging-swim-calendar')
        run: uv run --frozen --directory apps/lambda/python/3.14/swim-calendar python -m swim_calendar sync

      - name: Initialize Paul Reynolds calendar after apply
        if: contains(fromJSON(needs.detect.outputs.units).*.id, 'aws-staging-paul-reynolds-swim-calendar')
        run: uv run --frozen --directory apps/lambda/python/3.14/swim-calendar python -m swim_calendar sync --function paul-reynolds-swim-calendar-sync

      - name: Deploy Talos through visible guarded stages
        id: talos
        if: contains(fromJSON(needs.detect.outputs.units).*.id, 'talos-homelab')
        uses: ./.github/actions/talos-deploy
        with:
          mode: apply
          secrets-b64: ${{ secrets.TALOS_SECRETS_B64 }}

      - name: Deploy Kubernetes applications
        if: contains(fromJSON(needs.detect.outputs.units).*.id, 'kubernetes-homelab')
        uses: ./.github/actions/kubernetes-deploy
        with:
          mode: apply
          secrets-b64: ${{ secrets.TALOS_SECRETS_B64 }}
          operator-client-id: ${{ secrets.TS_OPERATOR_CLIENT_ID }}
          operator-client-secret: ${{ secrets.TS_OPERATOR_CLIENT_SECRET }}
          pihole-password: ${{ secrets.PIHOLE_ADMIN_PASSWORD }}
          ghcr-user: ${{ secrets.GHCR_READ_USER }}
          ghcr-token: ${{ secrets.GHCR_READ_TOKEN }}
          odysseus-password: ${{ secrets.ODYSSEUS_ADMIN_PASSWORD }}
          searxng-secret: ${{ secrets.SEARXNG_SECRET }}
          postgres-credentials-b64: ${{ secrets.POSTGRES_BACKUP_CREDENTIALS_B64 }}
          lifecycle-credentials-b64: ${{ secrets.AI_LIFECYCLE_CREDENTIALS_B64 }}

      - name: Release Proxmox apply hold
        if: always() && steps.power_hold.outputs.private-path != ''
        uses: ./.github/actions/host-power-hold
        with:
          action: release
          private-path: ${{ steps.power_hold.outputs.private-path }}

      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', '.github/workflows/*.yml') }}
          mode: save
          password: ${{ secrets.NEXUS_BUILD_CACHE_PASSWORD }}
        if: ${{ success() }}
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: providers
          toolchain: tofu-1.11.5
          dependencies: ${{ hashFiles('**/.terraform.lock.hcl') }}
          mode: save
          password: ${{ secrets.NEXUS_BUILD_CACHE_PASSWORD }}
        if: ${{ success() }}
  worker-maintenance:
    needs: [detect, apply]
    if: needs.apply.result == 'success' && contains(fromJSON(needs.detect.outputs.units).*.id, 'talos-homelab') && contains(github.event.pull_request.labels.*.name, 'worker-reboot')
    uses: ./.github/workflows/homelab-worker-maintenance.yml
    with:
      confirm: talos-worker-01
    secrets: inherit

  acceptance:
    needs: [detect, apply, worker-maintenance]
    if: >-
      ${{ !cancelled() && needs.detect.result == 'success' && needs.detect.outputs.suite != 'none' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.apply.result == 'success' ||
       (needs.apply.result == 'skipped' && (!contains(github.event.pull_request.labels.*.name, 'apply') || needs.detect.outputs.units == '[]'))) &&
      (needs.worker-maintenance.result == 'success' || needs.worker-maintenance.result == 'skipped') }}
    uses: ./.github/workflows/homelab-acceptance.yml
    with:
      suite: ${{ needs.detect.outputs.suite }}
    secrets: inherit

  lifecycle-maintenance:
    needs: [detect, apply, acceptance]
    if: ${{ !cancelled() && needs.detect.result == 'success' && needs.apply.result == 'success' && needs.acceptance.result == 'success' && contains(github.event.pull_request.labels.*.name, 'lifecycle-maintenance') }}
    uses: ./.github/workflows/homelab-lifecycle-maintenance.yml
    with:
      confirm: verify-ai-lifecycle-and-restore
    secrets: inherit

  storage-foundation:
    needs: detect
    if: needs.detect.outputs.storage == 'true'
    uses: ./.github/workflows/storage-foundation.yml

  apply-gate:
    needs: [detect, apply, worker-maintenance, acceptance, storage-foundation, lifecycle-maintenance]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos-light"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/talos-runner-setup
      - name: Require requested deployment and all selected acceptance
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          APPLY_REQUESTED: ${{ contains(github.event.pull_request.labels.*.name, 'apply') }}
          LIFECYCLE_MAINTENANCE_REQUESTED: ${{ contains(github.event.pull_request.labels.*.name, 'lifecycle-maintenance') }}
          REBOOT_REQUESTED: ${{ contains(github.event.pull_request.labels.*.name, 'worker-reboot') }}
        run: python3 scripts/deploy-units.py acceptance-gate

  enable-auto-merge:
    needs: [apply, apply-gate, acceptance, worker-maintenance]
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.apply.result == 'success' && needs.apply-gate.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    # API-only completion on the light ARC runner; the owner removed routine
    # hosted-runner dependence, so the deployment lock waits for this allocation.
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos-light"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/talos-runner-setup
        with:
          packages: gh
      - name: enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --auto --squash
