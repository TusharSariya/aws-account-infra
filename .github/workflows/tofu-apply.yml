name: tofu-apply

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: tofu-apply
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.units.outputs.units }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: units
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: echo "units=$(python3 scripts/deploy-units.py changed "$BASE_SHA" "$HEAD_SHA")" >> "$GITHUB_OUTPUT"

  apply:
    needs: detect
    if: needs.detect.outputs.units != '[]' && contains(github.event.pull_request.labels.*.name, 'apply') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TOFU_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - name: Connect to Proxmox tailnet
        if: contains(needs.detect.outputs.units, 'proxmox-homelab') || contains(needs.detect.outputs.units, 'talos-homelab')
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:github-ci
          version: 1.102.4
          hostname: gh-proxmox-apply-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Accept homelab subnet route
        if: contains(needs.detect.outputs.units, 'talos-homelab')
        run: sudo tailscale set --accept-routes=true
      - uses: astral-sh/setup-uv@v6
        if: contains(needs.detect.outputs.units, 'talos-homelab')
      - name: Verify Proxmox apply identity
        if: contains(needs.detect.outputs.units, 'proxmox-homelab')
        env:
          PROXMOX_VE_ENDPOINT: https://pve.tail2f646b.ts.net/
          PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_APPLY_API_TOKEN }}
        run: python3 scripts/proxmox-ci-check.py apply
      - name: Apply deploy units in dependency order
        env:
          TALOS_SECRETS_B64: ${{ secrets.TALOS_SECRETS_B64 }}
          UNITS_JSON: ${{ needs.detect.outputs.units }}
          PROXMOX_VE_ENDPOINT: https://pve.tail2f646b.ts.net/
          PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_APPLY_API_TOKEN }}
        run: |
          python3 - <<'PY' > /tmp/deploy-units.tsv
          import json
          import os

          for unit in json.loads(os.environ["UNITS_JSON"]):
              if unit["cloud"] not in {"aws", "proxmox", "talos"}:
                  raise SystemExit(f"CI apply is not configured for cloud {unit['cloud']!r}")
              print(f"{unit['id']}\t{unit['path']}\t{unit['var_file']}\t{unit['cloud']}")
          PY

          while IFS=$'\t' read -r id path var_file cloud; do
            echo "::group::Apply $id"
            if [[ "$cloud" == talos ]]; then
              uv run scripts/talos-ci.py apply
              echo "::endgroup::"
              continue
            fi
            tofu -chdir="$path" init -input=false
            case "$cloud" in
              aws) extra=(-var "aws_profile=") ;;
              proxmox) extra=(-var "vm_creation_approved=true") ;;
              *) echo "Unsupported deployment cloud: $cloud" >&2; exit 1 ;;
            esac
            tofu -chdir="$path" apply -input=false -auto-approve -lock-timeout=60s \
              -var-file="$GITHUB_WORKSPACE/$var_file" "${extra[@]}"
            echo "::endgroup::"
          done < /tmp/deploy-units.tsv

  apply-gate:
    needs: [detect, apply]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: gate
        run: |
          [[ "${{ needs.detect.result }}" == "success" ]] || exit 1
          if [[ "${{ needs.detect.outputs.units }}" == "[]" ]]; then exit 0; fi
          # No apply label: skip is intentional. Each unit has its own var file,
          # so a booker pin no longer marks the account stack as changed.
          if [[ "${{ needs.apply.result }}" == "skipped" ]]; then exit 0; fi
          [[ "${{ needs.apply.result }}" == "success" ]] || {
            echo "::error::Apply was requested (apply label) but failed."; exit 1;
          }

  enable-auto-merge:
    needs: apply
    if: needs.apply.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --auto --squash
