name: tofu-apply

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: tofu-apply
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.units.outputs.units }}
      suite: ${{ steps.units.outputs.suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: units
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          echo "units=$(python3 scripts/deploy-units.py changed "$BASE_SHA" "$HEAD_SHA")" >> "$GITHUB_OUTPUT"
          echo "suite=$(python3 scripts/deploy-units.py acceptance "$BASE_SHA" "$HEAD_SHA")" >> "$GITHUB_OUTPUT"

  apply:
    needs: detect
    if: needs.detect.outputs.units != '[]' && contains(github.event.pull_request.labels.*.name, 'apply') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      needs_worker_reboot: ${{ steps.talos.outputs.needs-worker-reboot }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TOFU_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - name: Connect to Proxmox tailnet
        if: contains(needs.detect.outputs.units, 'proxmox-homelab') || contains(needs.detect.outputs.units, 'talos-homelab') || contains(needs.detect.outputs.units, 'kubernetes-homelab')
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:github-ci
          version: 1.102.4
          hostname: gh-proxmox-apply-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Accept homelab subnet route
        if: contains(needs.detect.outputs.units, 'talos-homelab') || contains(needs.detect.outputs.units, 'kubernetes-homelab')
        run: sudo tailscale set --accept-routes=true --accept-dns=false
      - uses: astral-sh/setup-uv@v6
        if: contains(needs.detect.outputs.units, 'talos-homelab') || contains(needs.detect.outputs.units, 'kubernetes-homelab')
      - name: Verify Proxmox apply identity
        if: contains(needs.detect.outputs.units, 'proxmox-homelab')
        env:
          PROXMOX_VE_ENDPOINT: https://pve.tail2f646b.ts.net/
          PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_APPLY_API_TOKEN }}
        run: python3 scripts/proxmox-ci-check.py apply
      - name: Apply AWS and Proxmox prerequisites in dependency order
        env:
          UNITS_JSON: ${{ needs.detect.outputs.units }}
          PROXMOX_VE_ENDPOINT: https://pve.tail2f646b.ts.net/
          PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_APPLY_API_TOKEN }}
        run: |
          python3 - <<'PY' > /tmp/deploy-units.tsv
          import json
          import os

          units = json.loads(os.environ["UNITS_JSON"])
          # Foundation then applications execute as visible stages after the loop.
          tail = [u['id'] for u in units if u['cloud'] in ('talos', 'kubernetes')]
          expected = [name for name in ('talos-homelab', 'kubernetes-homelab') if name in tail]
          if tail != expected or (tail and [u['id'] for u in units[-len(tail):]] != tail):
              raise SystemExit('Unsupported foundation/application dependency order')
          for unit in units:
              if unit["cloud"] not in {"aws", "proxmox", "talos", "kubernetes"}:
                  raise SystemExit(f"CI apply is not configured for cloud {unit['cloud']!r}")
              print(f"{unit['id']}\t{unit['path']}\t{unit['var_file']}\t{unit['cloud']}")
          PY

          while IFS=$'\t' read -r id path var_file cloud; do
            echo "::group::Apply $id"
            if [[ "$cloud" == talos || "$cloud" == kubernetes ]]; then
              echo "::endgroup::"
              continue
            fi
            tofu -chdir="$path" init -input=false
            case "$cloud" in
              aws) extra=(-var "aws_profile=") ;;
              proxmox) extra=(-var "vm_creation_approved=true") ;;
              *) echo "Unsupported deployment cloud: $cloud" >&2; exit 1 ;;
            esac
            tofu -chdir="$path" apply -input=false -auto-approve -lock-timeout=60s \
              -var-file="$GITHUB_WORKSPACE/$var_file" "${extra[@]}"
            echo "::endgroup::"
          done < /tmp/deploy-units.tsv

      - name: Deploy Talos through visible guarded stages
        id: talos
        if: contains(needs.detect.outputs.units, 'talos-homelab')
        uses: ./.github/actions/talos-deploy
        with:
          mode: apply
          secrets-b64: ${{ secrets.TALOS_SECRETS_B64 }}

      - name: Deploy Kubernetes applications
        if: contains(needs.detect.outputs.units, 'kubernetes-homelab')
        uses: ./.github/actions/kubernetes-deploy
        with:
          mode: apply
          secrets-b64: ${{ secrets.TALOS_SECRETS_B64 }}
          operator-client-id: ${{ secrets.TS_OPERATOR_CLIENT_ID }}
          operator-client-secret: ${{ secrets.TS_OPERATOR_CLIENT_SECRET }}
          pihole-password: ${{ secrets.PIHOLE_ADMIN_PASSWORD }}

  worker-maintenance:
    needs: [detect, apply]
    if: needs.apply.result == 'success' && contains(needs.detect.outputs.units, 'talos-homelab') && contains(github.event.pull_request.labels.*.name, 'worker-reboot')
    uses: ./.github/workflows/homelab-worker-maintenance.yml
    with:
      confirm: talos-worker-01
    secrets: inherit

  acceptance:
    needs: [detect, apply, worker-maintenance]
    if: >-
      always() && needs.detect.result == 'success' && needs.detect.outputs.suite != 'none' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.apply.result == 'success' ||
       (needs.apply.result == 'skipped' && (!contains(github.event.pull_request.labels.*.name, 'apply') || needs.detect.outputs.units == '[]'))) &&
      (needs.worker-maintenance.result == 'success' || needs.worker-maintenance.result == 'skipped')
    uses: ./.github/workflows/homelab-acceptance.yml
    with:
      suite: ${{ needs.detect.outputs.suite }}
    secrets: inherit

  apply-gate:
    needs: [detect, apply, worker-maintenance, acceptance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require requested deployment and all selected acceptance
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          APPLY_REQUESTED: ${{ contains(github.event.pull_request.labels.*.name, 'apply') }}
          REBOOT_REQUESTED: ${{ contains(github.event.pull_request.labels.*.name, 'worker-reboot') }}
        run: python3 scripts/deploy-units.py acceptance-gate

  enable-auto-merge:
    needs: [apply, apply-gate, acceptance, worker-maintenance]
    if: always() && needs.apply.result == 'success' && needs.apply-gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --auto --squash
