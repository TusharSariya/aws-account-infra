name: tofu-apply

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: tofu-apply
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.units.outputs.units }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: units
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: echo "units=$(python3 scripts/deploy-units.py changed "$BASE_SHA" "$HEAD_SHA")" >> "$GITHUB_OUTPUT"

  apply:
    needs: detect
    if: needs.detect.outputs.units != '[]' && contains(github.event.pull_request.labels.*.name, 'apply')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TOFU_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.5
      - name: Apply deploy units in dependency order
        env:
          UNITS_JSON: ${{ needs.detect.outputs.units }}
        run: |
          python3 - <<'PY' > /tmp/deploy-units.tsv
          import json
          import os

          for unit in json.loads(os.environ["UNITS_JSON"]):
              if unit["cloud"] != "aws":
                  raise SystemExit(f"CI apply is not configured for cloud {unit['cloud']!r}")
              print(f"{unit['id']}\t{unit['path']}\t{unit['var_file']}")
          PY

          while IFS=$'\t' read -r id path var_file; do
            echo "::group::Apply $id"
            tofu -chdir="$path" init -input=false
            tofu -chdir="$path" apply -input=false -auto-approve \
              -var-file="$GITHUB_WORKSPACE/$var_file" -var "aws_profile="
            echo "::endgroup::"
          done < /tmp/deploy-units.tsv

  apply-gate:
    needs: [detect, apply]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: gate
        run: |
          [[ "${{ needs.detect.result }}" == "success" ]] || exit 1
          if [[ "${{ needs.detect.outputs.units }}" == "[]" ]]; then exit 0; fi
          # No apply label: skip is intentional. Shared staging.tfvars would
          # otherwise pull the account stack into CI apply.
          if [[ "${{ needs.apply.result }}" == "skipped" ]]; then exit 0; fi
          [[ "${{ needs.apply.result }}" == "success" ]] || {
            echo "::error::Apply was requested (apply label) but failed."; exit 1;
          }

  enable-auto-merge:
    needs: apply
    if: needs.apply.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --auto --squash
