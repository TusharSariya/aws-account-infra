name: homelab-config-tests
on:
  pull_request:
    paths:
      - 'live/proxmox/**'
      - 'live/aws/staging/workloads/homelab-recovery/**'
      - 'live/talos/**'
      - 'config/environments/talos/**'
      - 'scripts/talos-*'
      - 'scripts/talos_tools.py'
      - '.github/actions/talos-deploy/**'
      - 'scripts/tests/test_talos*.py'
      - 'config/environments/proxmox/**'
      - 'scripts/homelab-*'
      - 'scripts/proxmox-*'
      - 'scripts/tests/test_proxmox_access.py'
      - '.github/workflows/homelab-config-tests.yml'
      - '.github/workflows/homelab-etcd-backup.yml'
      - '.github/workflows/tofu-*.yml'
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.5
      - name: Validate workflow syntax
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.7
      - name: Check shell and Python syntax
        run: |
          for script in scripts/homelab-*.sh scripts/proxmox-*.sh; do bash -n "$script"; done
          python3 -m py_compile scripts/homelab-*.py scripts/proxmox-*.py
          python3 -m unittest discover -s scripts/tests -p "test_proxmox_access.py"
      - name: Validate Proxmox definitions without a backend or credentials
        run: |
          tofu fmt -check -recursive live/proxmox/homelab
          tofu -chdir=live/proxmox/homelab init -backend=false -lockfile=readonly
          tofu -chdir=live/proxmox/homelab validate
          tofu -chdir=live/proxmox/homelab test -var-file=../../../config/environments/proxmox/homelab/vms.tfvars
      - uses: astral-sh/setup-uv@v6
      - name: Validate Talos definitions and migration guards
        run: |
          tofu fmt -check -recursive live/talos/homelab
          tofu -chdir=live/talos/homelab init -backend=false -lockfile=readonly
          tofu -chdir=live/talos/homelab validate
          uv run --with PyYAML==6.0.3 python -m unittest discover -s scripts/tests -p "test_talos*.py"
      - name: Validate backup role and missing-heartbeat controls
        run: |
          tofu -chdir=live/aws/staging/workloads/homelab-recovery init -backend=false -lockfile=readonly
          tofu -chdir=live/aws/staging/workloads/homelab-recovery validate
          tofu -chdir=live/aws/staging/workloads/homelab-recovery test
