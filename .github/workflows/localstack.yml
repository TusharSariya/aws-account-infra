name: localstack

on:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos-docker-small"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/relevant-changes
        id: changes
        with:
          scope: localstack
      - uses: ./.github/actions/talos-runner-setup
        if: steps.changes.outputs.run == 'true'
        with:
          docker: 'true'
          aws: 'true'
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Court-booker unit tests
        if: steps.changes.outputs.run == 'true'
        working-directory: apps/ecr/court-booker
        run: |
          python -m pip install --quiet pytest pyyaml
          python -m pytest tests --ignore=tests/integration
      - name: Start sandbox
        if: steps.changes.outputs.run == 'true'
        env:
          LOCALSTACK_DEBUG: ${{ runner.debug || '0' }}
        run: ./scripts/localstack.sh up
      - name: Smoke test
        if: steps.changes.outputs.run == 'true'
        run: ./scripts/localstack.sh smoke
      - name: Court-booker LocalStack integration
        if: steps.changes.outputs.run == 'true'
        working-directory: apps/ecr/court-booker
        env:
          LOCALSTACK_ENDPOINT: http://localhost:4566
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: |
          python -m pip install --quiet pytest pyyaml boto3
          python -m pytest tests/integration
      - name: Logs on failure
        if: steps.changes.outputs.run == 'true' && (failure())
        run: docker compose -f mocks/localstack/compose.yml logs
