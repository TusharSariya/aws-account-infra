name: account-vend

on:
  workflow_dispatch:
    inputs:
      service_id:
        description: Service manifest ID
        required: true
        type: string
      environment:
        description: Account key within the service manifest
        required: true
        type: string
      action:
        description: Plan or apply one recoverable account root
        required: true
        default: plan
        type: choice
        options: [plan, apply]

concurrency:
  group: account-vending
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  vend:
    runs-on: ubuntu-latest
    environment: ${{ inputs.action == 'apply' && 'platform-prod' || 'platform-plan' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --disable-pip-version-check -r requirements-vending.txt
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.11.5
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ inputs.action == 'apply' && vars.ACCOUNT_VENDING_APPLY_ROLE_ARN || vars.ACCOUNT_VENDING_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Vend one account
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          CONTROL_PLANE_STATE_BUCKET: ${{ vars.CONTROL_PLANE_STATE_BUCKET }}
          CONTROL_PLANE_LOCK_TABLE: ${{ vars.CONTROL_PLANE_LOCK_TABLE }}
          MANAGEMENT_GITHUB_OIDC_PROVIDER_ARN: ${{ vars.MANAGEMENT_GITHUB_OIDC_PROVIDER_ARN }}
        run: scripts/vend-account.sh "${{ inputs.action }}" "${{ inputs.service_id }}" "${{ inputs.environment }}"
      - name: Open account-ID reconciliation PR
        if: inputs.action == 'apply' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- catalog; then exit 0; fi
          BRANCH="catalog/account-id-${{ inputs.service_id }}-${{ inputs.environment }}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add catalog
          git commit -m "Record ${{ inputs.service_id }}/${{ inputs.environment }} account ID"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Record ${{ inputs.service_id }}/${{ inputs.environment }} account ID" \
            --body "Records the immutable AWS account ID returned by the protected vending workflow."
