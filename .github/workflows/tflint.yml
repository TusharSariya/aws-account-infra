name: tflint

# Provider-aware lint (deprecated args, invalid instance types, naming, unused decls)
# that `tofu validate` doesn't catch. AWS ruleset runs in static mode (no deep_check),
# so no AWS creds. Reports on every PR; expensive steps run only for affected inputs — the single `tflint` job is a stable
# required-check context. Config + plugin pins live in /.tflint.hcl.
on:
  workflow_call:
    inputs:
      directories:
        type: string
        required: true
permissions:
  contents: read

jobs:
  tflint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos-checks"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    # Absolute path so EVERY directory visited by `--recursive` uses this single root
    # config — in recursive mode tflint resolves config per-directory and would otherwise
    # ignore the root .tflint.hcl (plugins + rule overrides) inside the stack subdirs.
    env:
      TFLINT_CONFIG_FILE: ${{ github.workspace }}/.tflint.hcl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/talos-runner-setup
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: tflint
          toolchain: tflint-0.54.0
          dependencies: ${{ hashFiles('.tflint.hcl') }}
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0

      - name: init plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init

      - name: lint
        run: tflint --chdir="${{ matrix.directory }}" --format compact
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: tflint
          toolchain: tflint-0.54.0
          dependencies: ${{ hashFiles('.tflint.hcl') }}
          mode: save
          password: ${{ secrets.NEXUS_BUILD_CACHE_PASSWORD }}
        if: ${{ success() }}
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(inputs.directories) }}
