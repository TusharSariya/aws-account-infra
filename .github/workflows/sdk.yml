name: sdk

# Lint specs, generate SDKs, smoke-test, publish candidates to CodeArtifact.
# Stable promote is sdk-publish-stable.yml (label + environment sdk).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "specs/**"
      - "sdk/**"
      - "scripts/sdk-*"
      - ".github/workflows/sdk.yml"

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "992382747916"
  SDK_CANDIDATE_ROLE_ARN: arn:aws:iam::992382747916:role/github-ci-sdk-candidate
  CODEARTIFACT_DOMAIN: aws-account-infra
  CODEARTIFACT_DOMAIN_OWNER: "992382747916"

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos-light"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/talos-runner-setup
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Spectral
        run: npx --yes @stoplight/spectral-cli@6.15.0 lint "specs/*/openapi.yaml" -r specs/.spectral.yaml

  publish-candidate:
    needs: lint
    if: (github.event_name == 'pull_request') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos-docker-small"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - spec: upace
            target: python
            ecosystem: python
          - spec: upace
            target: typescript-fetch
            ecosystem: npm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/talos-runner-setup
        with:
          docker: 'true'
          aws: 'true'
          packages: python3-venv python3-pip zip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: matrix.target == 'typescript-fetch'
        with:
          node-version: "20"
      - name: candidate version
        id: ver
        run: |
          echo "version=$(python3 scripts/sdk-version.py "${{ matrix.spec }}" \
            --channel candidate --ecosystem "${{ matrix.ecosystem }}" \
            --run "${{ github.run_number }}" --pr "${{ github.event.pull_request.number }}")" >> "$GITHUB_OUTPUT"
      - name: generate
        run: ./scripts/sdk-generate.sh "${{ matrix.spec }}" "${{ matrix.target }}" "${{ steps.ver.outputs.version }}"
      - name: smoke the candidate
        run: ./scripts/sdk-smoke.sh "${{ matrix.spec }}" "${{ matrix.target }}"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.SDK_CANDIDATE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: publish
        id: publish
        run: |
          set +e
          ./scripts/sdk-publish.sh "${{ matrix.spec }}" "${{ matrix.target }}" candidate
          status=$?
          if [[ "$status" -eq 3 ]]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "CodeArtifact not applied yet; skipping candidate publish."
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Comment candidate result
        uses: actions/github-script@v7
        env:
          SDK_TARGET: ${{ matrix.spec }}/${{ matrix.target }}
          SDK_VERSION: ${{ steps.ver.outputs.version }}
          SDK_SKIPPED: ${{ steps.publish.outputs.skipped }}
        with:
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `SDK candidate ${process.env.SDK_TARGET}: ${process.env.SDK_SKIPPED === 'true' ? 'skipped (repository unavailable)' : process.env.SDK_VERSION}. Stable publication still requires the sdk environment approval.`});
