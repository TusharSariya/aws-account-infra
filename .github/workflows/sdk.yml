name: sdk

# Lint specs, generate SDKs, smoke-test, publish candidates to CodeArtifact.
# Stable promote is sdk-publish-stable.yml (label + environment sdk).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "contracts/openapi/**"
      - "sdk/**"
      - "scripts/sdk-*"
      - ".github/workflows/sdk.yml"

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "992382747916"
  SDK_CANDIDATE_ROLE_ARN: arn:aws:iam::992382747916:role/github-ci-sdk-candidate
  CODEARTIFACT_DOMAIN: aws-account-infra
  CODEARTIFACT_DOMAIN_OWNER: "992382747916"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Spectral
        run: npx --yes @stoplight/spectral-cli@6.15.0 lint "contracts/openapi/*/openapi.yaml" -r contracts/openapi/.spectral.yaml

  generate:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - spec: upace
            target: python
            runtime: "3.12"
          - spec: upace
            target: typescript-fetch
            runtime: "20"
    steps:
      - uses: actions/checkout@v4
      - name: generate
        run: ./scripts/sdk-generate.sh "${{ matrix.spec }}" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.spec }}-${{ matrix.target }}
          path: generated/${{ matrix.spec }}/${{ matrix.target }}
          if-no-files-found: error

  smoke:
    needs: generate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - spec: upace
            target: python
            runtime: "3.12"
          - spec: upace
            target: typescript-fetch
            runtime: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sdk-${{ matrix.spec }}-${{ matrix.target }}
          path: generated/${{ matrix.spec }}/${{ matrix.target }}
      - uses: actions/setup-python@v5
        if: matrix.target == 'python'
        with:
          python-version: ${{ matrix.runtime }}
      - uses: actions/setup-node@v4
        if: matrix.target == 'typescript-fetch'
        with:
          node-version: ${{ matrix.runtime }}
      - name: smoke
        run: ./scripts/sdk-smoke.sh "${{ matrix.spec }}" "${{ matrix.target }}"

  publish-candidate:
    needs: smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - spec: upace
            target: python
            ecosystem: python
          - spec: upace
            target: typescript-fetch
            ecosystem: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: matrix.target == 'typescript-fetch'
        with:
          node-version: "20"
      - name: candidate version
        id: ver
        run: |
          echo "version=$(python3 scripts/sdk-version.py "${{ matrix.spec }}" \
            --channel candidate --ecosystem "${{ matrix.ecosystem }}" \
            --run "${{ github.run_number }}" --pr "${{ github.event.pull_request.number }}")" >> "$GITHUB_OUTPUT"
      - name: generate
        run: ./scripts/sdk-generate.sh "${{ matrix.spec }}" "${{ matrix.target }}" "${{ steps.ver.outputs.version }}"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.SDK_CANDIDATE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: publish
        id: publish
        run: |
          set +e
          ./scripts/sdk-publish.sh "${{ matrix.spec }}" "${{ matrix.target }}" candidate
          status=$?
          if [[ "$status" -eq 3 ]]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "CodeArtifact not applied yet; skipping candidate publish."
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: summary line
        run: |
          mkdir -p "$RUNNER_TEMP/publish"
          if [[ "${{ steps.publish.outputs.skipped }}" == "true" ]]; then
            echo "- \`${{ matrix.spec }}/${{ matrix.target }}\`: skipped (CodeArtifact domain missing)" \
              > "$RUNNER_TEMP/publish/line.md"
          else
            echo "- \`${{ matrix.spec }}/${{ matrix.target }}\` \`${{ steps.ver.outputs.version }}\` → \`sdk-candidate\`" \
              > "$RUNNER_TEMP/publish/line.md"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-line-${{ matrix.target }}
          path: ${{ runner.temp }}/publish/line.md

  comment-candidate:
    needs: publish-candidate
    if: always() && github.event_name == 'pull_request' && needs.publish-candidate.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: candidate-line-*
          merge-multiple: true
          path: lines
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = 'lines';
            let body = '### SDK candidate\n\n';
            if (fs.existsSync(dir)) {
              for (const f of fs.readdirSync(dir).sort()) {
                body += fs.readFileSync(`${dir}/${f}`, 'utf8').trim() + '\n';
              }
            } else {
              body += '_no candidate lines_\n';
            }
            body += `
            \`\`\`bash
            aws codeartifact login --tool pip --domain aws-account-infra --domain-owner 992382747916 --repository sdk-candidate --region us-east-1
            aws codeartifact login --tool npm --domain aws-account-infra --domain-owner 992382747916 --repository sdk-candidate --region us-east-1
            \`\`\`

            Stable is \`sdk-stable\` after label \`publish-stable\` and Environment \`sdk\` approval. Do not use \`apply\` / \`prod\` for packages.
            `;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
