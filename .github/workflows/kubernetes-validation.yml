name: kubernetes-validation

on:
  pull_request:
    paths:
      - validation/kubernetes/**
      - .github/workflows/kubernetes-validation.yml
  push:
    paths:
      - validation/kubernetes/**
      - .github/workflows/kubernetes-validation.yml

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache: false
      - run: pip install ruff==0.12.12
      - run: ruff check validation/kubernetes
      - run: ruff format --check validation/kubernetes
      - run: python3 -m unittest discover -s validation/kubernetes/tests -v
      - name: Validate generated Kubernetes manifests without cluster credentials
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          python3 validation/kubernetes/render-fixtures.py /tmp/kubernetes-validation-rendered
          kubeconform -strict -summary /tmp/kubernetes-validation-rendered/*-job.json
      - name: Validate scenario and profile catalog
        run: python3 validation/kubernetes/suite.py list
