name: kubernetes-validation

on:
  workflow_call:
permissions:
  contents: read

jobs:
  offline:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos-checks"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/talos-runner-setup
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          scope: kubernetes-validation
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', 'config/ci-python-pins.txt') }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          cache-local-path: ${{ env.UV_CACHE_DIR || format('{0}/uv-cache', runner.temp) }}
      - run: uv run --with ruff==0.12.12 ruff check validation/kubernetes
      - run: uv run --with ruff==0.12.12 ruff format --check validation/kubernetes
      - run: python3 -m unittest discover -s validation/kubernetes/tests -v
      - name: Install kubeconform v0.7.0
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          echo 'c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  kubeconform-linux-amd64.tar.gz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf kubeconform-linux-amd64.tar.gz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Validate generated Kubernetes manifests without cluster credentials
        run: |
          python3 validation/kubernetes/render-fixtures.py /tmp/kubernetes-validation-rendered
          kubeconform -strict -summary /tmp/kubernetes-validation-rendered/*-job.json
      - name: Validate scenario and profile catalog
        run: python3 validation/kubernetes/suite.py list
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          scope: kubernetes-validation
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', 'config/ci-python-pins.txt') }}
          mode: save
          password: ${{ secrets.NEXUS_BUILD_CACHE_PASSWORD }}
        if: ${{ success() }}
