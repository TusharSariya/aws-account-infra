name: ollama-image
on:
  pull_request:
    paths:
      - 'apps/containers/ollama/**'
      - 'scripts/ollama-image-context.py'
      - 'scripts/ollama-image-smoke.sh'
      - 'scripts/verify-ai-images.py'
      - '.github/workflows/ollama-image.yml'
  push:
    branches: [main]
    paths:
      - 'apps/containers/ollama/**'
      - 'scripts/ollama-image-context.py'
      - 'scripts/ollama-image-smoke.sh'
      - 'scripts/verify-ai-images.py'
      - '.github/workflows/ollama-image.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ollama-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    timeout-minutes: 60
    environment: prod
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/talos-runner-setup
        with:
          docker: 'true'
          packages: gh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Prepare checksum-verified upstream context
        id: source
        run: |
          context=$(python3 scripts/ollama-image-context.py "$RUNNER_TEMP/ollama-source")
          echo "context=$context" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish private package
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.source.outputs.context }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/tusharsariyaorg/homelab-ollama:${{ steps.source.outputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/TusharSariyaOrg/aws-account-infra
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify private package and report immutable reference
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          visibility=$(gh api /orgs/TusharSariyaOrg/packages/container/homelab-ollama --jq .visibility)
          [[ "$visibility" == private ]]
          echo "Image: ghcr.io/tusharsariyaorg/homelab-ollama@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo 'Commit this digest to AI values and the workspace CLI build input before apply.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify packaged authenticated admission
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: bash scripts/ollama-image-smoke.sh "ghcr.io/tusharsariyaorg/homelab-ollama@$IMAGE_DIGEST"
      - name: Record verified build output
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_COMMIT: ${{ steps.source.outputs.revision }}
        run: python3 scripts/verify-ai-images.py ollama "ghcr.io/tusharsariyaorg/homelab-ollama@$IMAGE_DIGEST" "$SOURCE_COMMIT" "$RUNNER_TEMP/receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ollama-image-receipt
          path: ${{ runner.temp }}/receipt.json
          retention-days: 90
          if-no-files-found: error
