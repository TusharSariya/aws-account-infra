name: homelab-acceptance
on:
  workflow_call:
    inputs:
      suite:
        type: string
        default: all
  workflow_dispatch:
    inputs:
      suite:
        description: Acceptance suite against the current cluster (no deployment)
        type: choice
        options: [all, network, pvc, capacity, lifecycle]
        default: all
permissions:
  contents: read
  id-token: write
jobs:
  acceptance:
    if: (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos-checks"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    timeout-minutes: 20
    environment: prod
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suite == 'all' && '["network","pvc","capacity","lifecycle"]' || inputs.suite == 'network' && '["network"]' || inputs.suite == 'pvc' && '["pvc"]' || inputs.suite == 'capacity' && '["capacity"]' || inputs.suite == 'lifecycle' && '["lifecycle"]' || '["invalid"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/talos-runner-setup
        with:
          tailscale: 'true'
          packages: dnsutils openssh-client rsync
      - uses: astral-sh/setup-uv@v6
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:github-ci
          version: 1.102.4
          hostname: gh-check-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Accept homelab subnet route
        run: sudo tailscale set --accept-routes=true
      - uses: ./.github/actions/talos-check
        with:
          operation: ${{ matrix.suite }}
          secrets-b64: ${{ secrets.TALOS_SECRETS_B64 }}
          lifecycle-credentials-b64: ${{ secrets.AI_LIFECYCLE_CREDENTIALS_B64 }}
