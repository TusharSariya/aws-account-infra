name: pilot-platform
on:
  pull_request:
    paths: ['pilot/**', '.github/workflows/pilot-platform.yml']
permissions:
  contents: read
jobs:
  offline:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos-checks"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/talos-runner-setup
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          scope: pilot-platform
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', 'config/ci-python-pins.txt') }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          cache-local-path: ${{ env.UV_CACHE_DIR || format('{0}/uv-cache', runner.temp) }}
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.3
      - run: python3 -m unittest discover -s pilot/monitoring/tests -v
      - run: uv run --with ruff==0.12.12 ruff check pilot --exclude vendor
      - run: uv run --with ruff==0.12.12 ruff format --check pilot --exclude vendor
      - name: Validate portable monitoring and shell helpers
        run: |
          python3 pilot/monitoring/kubernetes/validate.py
          kubectl kustomize pilot/monitoring/kubernetes > /tmp/monitoring.yaml
          for file in pilot/vm/*.sh; do bash -n "$file"; done
      - name: Verify vendored Argo CD checksums and management placement
        run: |
          kubectl kustomize pilot/argocd > /tmp/argocd.yaml
          uv run --python 3.13 --with PyYAML==6.0.3 python pilot/argocd/validate.py /tmp/argocd.yaml
      - name: Validate Prometheus alert rules with the pinned release
        run: |
          python3 - <<'PYTHON'
          import sys, subprocess
          from pathlib import Path
          sys.path.insert(0, 'pilot/monitoring')
          from install import binary
          promtool = binary('prometheus', 'promtool')
          subprocess.run([str(promtool), 'check', 'rules', 'pilot/monitoring/config/alerts.yml'], check=True)
          subprocess.run([str(promtool), 'test', 'rules', 'alert-tests.yml'], cwd='pilot/monitoring/config', check=True)
          PYTHON
      - uses: ./.github/actions/nexus-dependency-cache
        with:
          kind: python
          toolchain: uv-python-3.14
          scope: pilot-platform
          dependencies: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', 'config/ci-python-pins.txt') }}
          mode: save
          password: ${{ secrets.NEXUS_BUILD_CACHE_PASSWORD }}
        if: ${{ success() }}
