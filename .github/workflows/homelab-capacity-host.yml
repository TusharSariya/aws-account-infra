name: homelab-capacity-host
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type pve-capacity to reconcile the reviewed host exporter and collector credential
        type: string
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: tofu-apply
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    # Circular maintenance: the macOS operator runner when vars.CI_OPERATOR == 'mac', else hosted.
    runs-on: ${{ vars.CI_OPERATOR == 'mac' && fromJSON('["self-hosted","macOS","homelab-operator"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    # Dispatch-only operator job: the operator environment deploys from main only.
    environment: operator
    steps:
      - name: Require explicit host target
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = pve-capacity
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        if: runner.os != 'macOS'
        with:
          use-cache: false
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:github-ci
          version: 1.102.4
          hostname: gh-capacity-host-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Accept private subnet route
        if: runner.os != 'macOS'
        run: sudo tailscale set --accept-routes=true
      - name: Require the operator Mac's existing tailnet session
        if: runner.os == 'macOS'
        run: tailscale status --json | python3 -c 'import json,sys; state = json.load(sys.stdin)["BackendState"]; assert state == "Running", "tailscale BackendState is " + state'
      - name: Reconcile host from reviewed source and independent credentials
        env:
          CAPACITY_HOST_SSH_KEY: ${{ secrets.CAPACITY_HOST_SSH_KEY }}
          CAPACITY_HOST_KNOWN_HOSTS: ${{ vars.CAPACITY_HOST_KNOWN_HOSTS }}
          CAPACITY_HOST_CREDENTIALS_B64: ${{ secrets.CAPACITY_HOST_CREDENTIALS_B64 }}
        run: python3 scripts/homelab-capacity-host.py
      - uses: ./.github/actions/talos-check
        with:
          operation: capacity-credentials
          capacity-credentials-b64: ${{ secrets.CAPACITY_CLIENT_CREDENTIALS_B64 }}
          secrets-b64: ${{ secrets.TALOS_SECRETS_B64 }}
