name: homelab-lifecycle-maintenance
on:
  workflow_call:
    inputs:
      confirm:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      confirm:
        description: Type verify-ai-lifecycle-and-restore to exercise Start/Stop/Force Stop, jobs, idle shutdown and encrypted isolated restore
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'tofu-apply' || format('lifecycle-maintenance-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  proof:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    # Circular maintenance: the macOS operator runner when vars.CI_OPERATOR == 'mac', else hosted.
    runs-on: ${{ vars.CI_OPERATOR == 'mac' && fromJSON('["self-hosted","homelab-operator"]') || 'ubuntu-latest' }}
    timeout-minutes: 90
    environment: prod
    steps:
      - name: Require explicit lifecycle maintenance selection
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = verify-ai-lifecycle-and-restore
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        if: runner.os != 'macOS'
        with:
          use-cache: false
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:github-ci
          version: 1.102.4
          hostname: gh-lifecycle-proof-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Accept private subnet route
        if: runner.os != 'macOS'
        run: sudo tailscale set --accept-routes=true
      - name: Require the operator Mac's existing tailnet session
        if: runner.os == 'macOS'
        run: tailscale status --json | python3 -c 'import json,sys; state = json.load(sys.stdin)["BackendState"]; assert state == "Running", "tailscale BackendState is " + state'
      - uses: ./.github/actions/talos-check
        with:
          operation: lifecycle-maintenance
          lifecycle-confirm: ${{ inputs.confirm }}
          lifecycle-credentials-b64: ${{ secrets.AI_LIFECYCLE_CREDENTIALS_B64 }}
          secrets-b64: ${{ secrets.TALOS_SECRETS_B64 }}
      - name: Retain encrypted application backup and isolated restore evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai-data-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-data-recovery/
          retention-days: 90
          if-no-files-found: error
      - name: Remove encrypted local artifacts
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/ai-data-recovery"
