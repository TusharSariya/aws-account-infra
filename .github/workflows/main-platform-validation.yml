name: main-platform-validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff==0.12.12 PyYAML==6.0.2
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.3
      - run: ruff check platform/main-control-plane kubernetes/platform/main --exclude vendor
      - run: ruff format --check platform/main-control-plane kubernetes/platform/main --exclude vendor
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - run: python3 -m unittest discover -s scripts/tests -p test_main_cluster_iac.py -v
      - run: python3 -m unittest discover -s platform/main-control-plane/tests -v
      - run: python3 kubernetes/platform/main/validate.py
      - run: shellcheck platform/main-control-plane/ops.sh platform/main-control-plane/launch.sh platform/main-control-plane/prepare-host.sh platform/main-control-plane/90-main-control-plane platform/main-control-plane/recovery-test.sh
