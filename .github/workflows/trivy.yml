name: trivy

# Static IaC misconfig scan (public buckets, unencrypted resources, broad IAM, …).
# Pure file scan — no AWS creds, no OIDC. Reports on every PR; expensive steps run only for affected inputs, so the single
# `trivy` job is itself a stable required-check context (no detect/gate scaffolding
# needed like the tofu workflows). Suppressions live in /.trivyignore.
on:
  pull_request:

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trivy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON('{"github-hosted":"ubuntu-latest","talos":"homelab-talos-checks"}')[contains(github.event.pull_request.labels.*.name, 'arc-acceptance') && 'talos' || vars.CI_EXECUTOR || 'github-hosted'] }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/relevant-changes
        id: changes
        with:
          scope: trivy

      - uses: ./.github/actions/talos-runner-setup
        if: steps.changes.outputs.run == 'true'
      - uses: aquasecurity/trivy-action@v0.36.0
        if: steps.changes.outputs.run == 'true'
        with:
          scan-type: config
          scan-ref: .
          # Block only on the high-signal findings; lower this later if desired.
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
          skip-dirs: "**/.terraform"
