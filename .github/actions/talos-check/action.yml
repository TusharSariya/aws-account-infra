name: Talos acceptance session
description: Independent authenticated acceptance or explicitly approved worker maintenance
inputs:
  operation:
    description: network, pvc, capacity, capacity-credentials, worker-reboot, ai-migrate, quota-prepare, or quota-verify
    required: true
  reboot-approved:
    description: Explicit maintenance consent, never inferred from an apply
    default: 'false'
  capacity-credentials-b64:
    description: Independently issued capacity client credential bundle
    default: ''
  reset-confirm:
    description: Explicit single-use AI reset confirmation
    default: ''
  quota-confirm:
    description: Explicit disposable quota and reboot maintenance confirmation
    default: ''
  secrets-b64:
    description: Existing Talos identity
    required: true
  lifecycle-confirm:
    description: Explicit lifecycle and isolated restore maintenance selection
    default: ''
  lifecycle-credentials-b64:
    description: Lifecycle acceptance credential bundle
    default: ''
runs:
  using: composite
  steps:
    - name: Allocate private acceptance workspace
      id: private
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
      run: |
        [[ "$OPERATION" == lifecycle-maintenance || "$OPERATION" == lifecycle || "$OPERATION" == network || "$OPERATION" == pvc || "$OPERATION" == capacity || "$OPERATION" == capacity-credentials || "$OPERATION" == ai-migrate || "$OPERATION" == worker-reboot || "$OPERATION" == quota-prepare || "$OPERATION" == quota-verify ]]
        umask 077
        echo "path=$(mktemp -d "$RUNNER_TEMP/talos-check.XXXXXXXX")" >> "$GITHUB_OUTPUT"
    - name: Set up verified tools
      shell: bash
      run: uv run scripts/talos-ci.py setup --acceptance --checks-only
    - name: Prepare original private identity
      shell: bash
      env:
        PRIVATE: ${{ steps.private.outputs.path }}
        TALOS_SECRETS_B64: ${{ inputs.secrets-b64 }}
      run: uv run scripts/talos-ci.py prepare --private "$PRIVATE"
    - name: Authenticate to the existing cluster
      shell: bash
      env:
        PRIVATE: ${{ steps.private.outputs.path }}
      run: uv run scripts/talos-ci.py connect --private "$PRIVATE"
    - name: Hold retained workers during cluster operations
      shell: bash
      env:
        PRIVATE: ${{ steps.private.outputs.path }}
      run: |
        install -m 700 "$HOME/.cache/aws-account-infra/talos/kubectl-v1.36.3" "$PRIVATE/kubectl"
        PATH="$PRIVATE:$PATH" python3 scripts/homelab-power-hold.py acquire --kubeconfig "$PRIVATE/kubeconfig" --receipt "$PRIVATE/power-hold.json" --hosts primary --wait --freeze
    - name: Execute selected acceptance or maintenance operation
      shell: bash
      env:
        PRIVATE: ${{ steps.private.outputs.path }}
        OPERATION: ${{ inputs.operation }}
        AI_MAINTENANCE_CONFIRM: ${{ inputs.lifecycle-confirm }}
        AI_BACKUP_OUTPUT: ${{ runner.temp }}/ai-data-recovery
        AI_LIFECYCLE_CREDENTIALS_B64: ${{ inputs.lifecycle-credentials-b64 }}
        CAPACITY_CLIENT_CREDENTIALS_B64: ${{ inputs.capacity-credentials-b64 }}
        AI_RESET_CONFIRM: ${{ inputs.reset-confirm }}
        QUOTA_ACCEPTANCE_CONFIRM: ${{ inputs.quota-confirm }}
        HOMELAB_WORKER_REBOOT_APPROVED: ${{ inputs.reboot-approved }}
      run: uv run scripts/talos-ci.py "$OPERATION" --private "$PRIVATE"
    - name: Release only this operation's maintenance hold
      if: success() && steps.private.outputs.path != ''
      shell: bash
      env:
        PRIVATE: ${{ steps.private.outputs.path }}
      run: |
        if [[ -f "$PRIVATE/power-hold.json" ]]; then
          PATH="$PRIVATE:$PATH" python3 scripts/homelab-power-hold.py release --verified --kubeconfig "$PRIVATE/kubeconfig" --receipt "$PRIVATE/power-hold.json"
        fi
    - name: Remove private authentication inputs
      if: always() && steps.private.outputs.path != ''
      shell: bash
      env:
        PRIVATE: ${{ steps.private.outputs.path }}
      run: rm -rf -- "$PRIVATE"
