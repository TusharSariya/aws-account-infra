name: Relevant changes
description: Check the complete PR diff before installing tools or running expensive checks.
inputs:
  scope:
    description: Check scope
    required: true
outputs:
  run:
    description: Whether this check has affected inputs
    value: ${{ steps.filter.outputs.run }}
runs:
  using: composite
  steps:
    - id: filter
      shell: bash
      env:
        CHECK_SCOPE: ${{ inputs.scope }}
      run: python3 scripts/ci-relevant-changes.py
