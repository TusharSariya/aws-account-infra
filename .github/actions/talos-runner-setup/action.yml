name: Talos runner prerequisites
description: Install job tools inside the disposable trusted runner only (CI timing baseline)
inputs:
  packages:
    description: Additional apt packages required by this job
    default: ''
  docker:
    description: Require the Docker-enabled catalog configuration and Compose
    default: 'false'
  aws:
    description: Install the pinned AWS CLI for jobs that invoke it
    default: 'false'
  tailscale:
    description: Prepare a disposable TUN device for private cluster access
    default: 'false'
runs:
  using: composite
  steps:
    - name: Prepare disposable runner tools
      if: runner.environment == 'self-hosted' && runner.os == 'Linux'
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.packages }}
        NEED_DOCKER: ${{ inputs.docker }}
        NEED_AWS: ${{ inputs.aws }}
        NEED_TAILSCALE: ${{ inputs.tailscale }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: |
        set -euo pipefail
        test "$RUNNER_OS" = Linux
        printf 'HOMELAB_DEPENDENCY_CACHE=1\n' >> "$GITHUB_ENV"
        bash "$GITHUB_ACTION_PATH/../../../scripts/talos-cache-setup.sh"
        read -r -a extras <<< "$EXTRA_PACKAGES"
        requested=(python3 jq curl git unzip "${extras[@]}")
        if [[ "$NEED_DOCKER" == true ]]; then requested+=(docker-compose-v2); fi
        packages=()
        for package in "${requested[@]}"; do
          [[ "$package" =~ ^[a-z0-9][a-z0-9+.-]*$ ]] || exit 1
          if [[ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)" != 'install ok installed' ]]; then
            packages+=("$package")
          fi
        done
        if (( ${#packages[@]} )); then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          sudo rm -rf /var/lib/apt/lists/*
        fi
        if [[ "$NEED_AWS" == true ]]; then
          if [[ "$(aws --version 2>/dev/null || true)" != aws-cli/2.36.45\ * ]]; then
            test "$(uname -m)" = x86_64
            aws_install_dir=$(mktemp -d "$RUNNER_TEMP/aws-cli.XXXXXXXX")
            trap 'rm -rf "$aws_install_dir"' EXIT
            python3 "$GITHUB_ACTION_PATH/../../../scripts/cache_download.py" \
              https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.36.45.zip \
              0f02381483b0a5ca127a4cb379e656a73007b346561a5e41d3249d3bc1861226 \
              "$aws_install_dir/aws.zip" --cache
            unzip -q "$aws_install_dir/aws.zip" -d "$aws_install_dir"
            sudo "$aws_install_dir/aws/install" --update
          fi
          aws --version
        fi
        if [[ "$NEED_TAILSCALE" == true ]]; then
          sudo mkdir -p /dev/net
          if [[ ! -c /dev/net/tun ]]; then sudo mknod /dev/net/tun c 10 200; fi
        fi
        if [[ "$NEED_DOCKER" == true ]]; then
          # Bind-mounted temporary fixtures must exist in both Pod containers.
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          docker compose version
          docker info > /dev/null
        fi
    # The macOS operator runner (docs/runbooks/mac-operator-runner.md) is a
    # persistent host: verify its Homebrew tools only. No sudo, apt, TUN device
    # or Nexus transport (Nexus is reachable only from inside the cluster).
    - name: Verify macOS operator runner tools
      if: runner.environment == 'self-hosted' && runner.os == 'macOS'
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.packages }}
        NEED_DOCKER: ${{ inputs.docker }}
        NEED_AWS: ${{ inputs.aws }}
        NEED_TAILSCALE: ${{ inputs.tailscale }}
      run: |
        set -euo pipefail
        if [[ "$NEED_DOCKER" == true ]]; then
          echo '::error::Docker jobs are not supported on the macOS operator runner; route this job to ARC or hosted.'
          exit 1
        fi
        # /bin/bash on macOS is 3.2: avoid expanding possibly empty arrays under set -u.
        required='python3 jq curl git unzip tofu uv helm kubectl tailscale'
        if [[ "$NEED_AWS" == true ]]; then required="$required aws"; fi
        for package in $EXTRA_PACKAGES; do
          if [[ "$package" == gh ]]; then required="$required gh"; fi
        done
        missing=''
        for tool in $required; do
          command -v "$tool" > /dev/null || missing="$missing $tool"
        done
        if [[ -n "$missing" ]]; then
          echo "::error::Operator runner is missing:$missing (install with Homebrew; see docs/runbooks/mac-operator-runner.md)"
          exit 1
        fi
        python3 -c 'import sys; assert sys.version_info >= (3, 11), "Homebrew python3 must precede /usr/bin on PATH"'
        if [[ "$NEED_TAILSCALE" == true ]]; then
          tailscale status --json | python3 -c 'import json,sys; state = json.load(sys.stdin)["BackendState"]; assert state == "Running", "tailscale BackendState is " + state'
        fi
