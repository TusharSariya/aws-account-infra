name: Kubernetes applications
description: Verified application charts, private authentication and exact-plan deployment
inputs:
  mode:
    description: plan or apply
    required: true
  secrets-b64:
    description: Existing Talos identity
    required: true
  operator-client-id:
    description: Dedicated operator OAuth client ID
    default: ''
  operator-client-secret:
    description: Dedicated operator OAuth client secret
    default: ''
  pihole-password:
    description: Pi-hole admin password
    default: ''
  ghcr-user:
    description: Private registry read username
    default: ''
  ghcr-token:
    description: Private registry read-only token
    default: ''
  odysseus-password:
    description: Workspace bootstrap admin password
    default: ''
  searxng-secret:
    description: Private search signing secret
    default: ''
  lifecycle-credentials-b64:
    description: Independently issued lifecycle and model credentials
    default: ''
  postgres-credentials-b64:
    description: Dedicated PostgreSQL backup leaf and database credential
    default: ''
runs:
  using: composite
  steps:
    - name: Allocate private application workspace
      id: private
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        [[ "$MODE" == plan || "$MODE" == apply ]]
        umask 077
        echo "path=$(mktemp -d "$RUNNER_TEMP/homelab-apps.XXXXXXXX")" >> "$GITHUB_OUTPUT"
    - name: Verify tools and application charts
      shell: bash
      run: |
        uv run scripts/talos-ci.py setup --acceptance --checks-only
        python3 scripts/homelab-apps.py setup
    - name: Prepare existing cluster identity
      shell: bash
      env:
        PRIVATE: ${{ steps.private.outputs.path }}
        TALOS_SECRETS_B64: ${{ inputs.secrets-b64 }}
      run: uv run scripts/talos-ci.py prepare --private "$PRIVATE"
    - name: Authenticate without changing the cluster
      shell: bash
      env:
        PRIVATE: ${{ steps.private.outputs.path }}
      run: uv run scripts/talos-ci.py connect --private "$PRIVATE"
    - name: Hold retained workers during cluster operations
      shell: bash
      env:
        PRIVATE: ${{ steps.private.outputs.path }}
      run: |
        uv run scripts/talos-ci.py connect --private "$PRIVATE"
        install -m 700 "$HOME/.cache/aws-account-infra/talos/kubectl-v1.36.3" "$PRIVATE/kubectl"
        PATH="$PRIVATE:$PATH" python3 scripts/homelab-power-hold.py acquire --kubeconfig "$PRIVATE/kubeconfig" --receipt "$PRIVATE/power-hold.json" --hosts primary --wait
    - name: Check authenticated schema discovery before planning
      shell: bash
      env:
        PRIVATE: ${{ steps.private.outputs.path }}
      run: python3 scripts/homelab-apps.py schema --private "$PRIVATE"
    - name: Initialize and validate application state
      shell: bash
      run: |
        tofu -chdir=live/kubernetes/homelab fmt -check
        tofu -chdir=live/kubernetes/homelab init -input=false -lockfile=readonly
        tofu -chdir=live/kubernetes/homelab validate
    - name: Plan and guard application changes
      shell: bash
      env:
        PRIVATE: ${{ steps.private.outputs.path }}
        TS_OPERATOR_CLIENT_ID: ${{ inputs.operator-client-id }}
        TS_OPERATOR_CLIENT_SECRET: ${{ inputs.operator-client-secret }}
        PIHOLE_ADMIN_PASSWORD: ${{ inputs.pihole-password }}
        GHCR_READ_USER: ${{ inputs.ghcr-user }}
        GHCR_READ_TOKEN: ${{ inputs.ghcr-token }}
        ODYSSEUS_ADMIN_PASSWORD: ${{ inputs.odysseus-password }}
        GH_TOKEN: ${{ github.token }}
        SEARXNG_SECRET: ${{ inputs.searxng-secret }}
        POSTGRES_BACKUP_CREDENTIALS_B64: ${{ inputs.postgres-credentials-b64 }}
        AI_LIFECYCLE_CREDENTIALS_B64: ${{ inputs.lifecycle-credentials-b64 }}
      run: |
        set -o pipefail
        uv run --with PyYAML==6.0.3 python scripts/homelab-apps.py plan --private "$PRIVATE" | tee applications-plan.txt
    - name: Reconcile protected credential Secrets
      if: inputs.mode == 'apply'
      shell: bash
      env:
        PRIVATE: ${{ steps.private.outputs.path }}
        TS_OPERATOR_CLIENT_ID: ${{ inputs.operator-client-id }}
        TS_OPERATOR_CLIENT_SECRET: ${{ inputs.operator-client-secret }}
        PIHOLE_ADMIN_PASSWORD: ${{ inputs.pihole-password }}
        GHCR_READ_USER: ${{ inputs.ghcr-user }}
        GHCR_READ_TOKEN: ${{ inputs.ghcr-token }}
        ODYSSEUS_ADMIN_PASSWORD: ${{ inputs.odysseus-password }}
        GH_TOKEN: ${{ github.token }}
        SEARXNG_SECRET: ${{ inputs.searxng-secret }}
        POSTGRES_BACKUP_CREDENTIALS_B64: ${{ inputs.postgres-credentials-b64 }}
        AI_LIFECYCLE_CREDENTIALS_B64: ${{ inputs.lifecycle-credentials-b64 }}
      run: uv run --with PyYAML==6.0.3 python scripts/homelab-apps.py bootstrap --private "$PRIVATE"
    - name: Apply exact saved plan and inspect state for credentials
      if: inputs.mode == 'apply'
      shell: bash
      env:
        PRIVATE: ${{ steps.private.outputs.path }}
        TS_OPERATOR_CLIENT_ID: ${{ inputs.operator-client-id }}
        TS_OPERATOR_CLIENT_SECRET: ${{ inputs.operator-client-secret }}
        PIHOLE_ADMIN_PASSWORD: ${{ inputs.pihole-password }}
        GHCR_READ_USER: ${{ inputs.ghcr-user }}
        GHCR_READ_TOKEN: ${{ inputs.ghcr-token }}
        ODYSSEUS_ADMIN_PASSWORD: ${{ inputs.odysseus-password }}
        GH_TOKEN: ${{ github.token }}
        SEARXNG_SECRET: ${{ inputs.searxng-secret }}
        POSTGRES_BACKUP_CREDENTIALS_B64: ${{ inputs.postgres-credentials-b64 }}
        AI_LIFECYCLE_CREDENTIALS_B64: ${{ inputs.lifecycle-credentials-b64 }}
      run: uv run --with PyYAML==6.0.3 python scripts/homelab-apps.py apply --private "$PRIVATE"
    - name: Verify private DNS and HTTPS endpoints
      if: inputs.mode == 'apply'
      shell: bash
      env:
        PRIVATE: ${{ steps.private.outputs.path }}
        POSTGRES_BACKUP_CREDENTIALS_B64: ${{ inputs.postgres-credentials-b64 }}
        AI_LIFECYCLE_CREDENTIALS_B64: ${{ inputs.lifecycle-credentials-b64 }}
      run: uv run --with PyYAML==6.0.3 python scripts/homelab-apps.py endpoints --private "$PRIVATE"
    - name: Release only this operation's maintenance hold
      if: always() && steps.private.outputs.path != ''
      shell: bash
      env:
        PRIVATE: ${{ steps.private.outputs.path }}
      run: |
        if [[ -f "$PRIVATE/power-hold.json" ]]; then
          PATH="$PRIVATE:$PATH" python3 scripts/homelab-power-hold.py release --kubeconfig "$PRIVATE/kubeconfig" --receipt "$PRIVATE/power-hold.json"
        fi
    - name: Remove private application workspace
      if: always() && steps.private.outputs.path != ''
      shell: bash
      env:
        PRIVATE: ${{ steps.private.outputs.path }}
      run: rm -rf -- "$PRIVATE"
