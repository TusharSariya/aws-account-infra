apiVersion: v1alpha1
kind: UserVolumeConfig
name: pilot-prometheus
provisioning:
  diskSelector:
    match: disk.serial == 'PILOT-MONITORING-01' && !system_disk
  minSize: 2GiB
  maxSize: 2GiB
filesystem:
  type: ext4

