global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - '@BASE@/config/alerts.yml'
  - '@BASE@/config/proofs/*.yml'
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
scrape_configs:
  - job_name: pilot
    scrape_timeout: 5s
    sample_limit: 5000
    static_configs:
      - targets: ['127.0.0.1:9810']
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: loki
    static_configs:
      - targets: ['127.0.0.1:3100']
  - job_name: alloy
    static_configs:
      - targets: ['127.0.0.1:12345']
  - job_name: pilot-http
    scheme: https
    metrics_path: /api/v1/namespaces/pilot-app/services/http:pilot-http:8080/proxy/metrics
    tls_config:
      ca_file: '@BASE@/private/ca.crt'
      cert_file: '@BASE@/private/reader.crt'
      key_file: '@BASE@/private/reader.key'
    sample_limit: 100
    static_configs:
      - targets: ['10.0.2.15:6443']
