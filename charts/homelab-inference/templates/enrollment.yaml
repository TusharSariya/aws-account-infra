{{- if or .Values.workerEnabled .Values.enabled }}
# Bootstrap can request a CSR, but cannot approve it or read unrelated Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: ubuntu-worker-bootstrap}
subjects:
  - {kind: Group, name: 'system:bootstrappers:ubuntu-worker', apiGroup: rbac.authorization.k8s.io}
roleRef: {kind: ClusterRole, name: system:node-bootstrapper, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: ubuntu-worker-client-rotation}
subjects:
  - {kind: User, name: 'system:node:ubuntu-gpu-01', apiGroup: rbac.authorization.k8s.io}
  - {kind: User, name: 'system:node:ubuntu-enrollment-validation', apiGroup: rbac.authorization.k8s.io}
roleRef: {kind: ClusterRole, name: 'system:certificates.k8s.io:certificatesigningrequests:selfnodeclient', apiGroup: rbac.authorization.k8s.io}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: retained-host-inference-admission, namespace: homelab-inference}
rules:
  - apiGroups: [kueue.x-k8s.io]
    resources: [workloads/status]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: retained-host-inference-admission, namespace: homelab-inference}
subjects: [{kind: ServiceAccount, name: retained-host-coordinator, namespace: homelab-platform}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: retained-host-inference-admission}
{{- end }}
