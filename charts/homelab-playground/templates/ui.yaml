{{- if and .Values.ui.enabled (not .Values.desktopOnly) }}
{{- /* One Open WebUI connection per router backend prefix (/b/<name>), so the model list and
       the admin pull pick the backend. The router bearer stays in the bootstrap-managed Secret
       playground-router-auth and reaches the configs through $(PLAYGROUND_ROUTER_TOKEN). */}}
{{- $router := "http://playground-router.homelab-models.svc.cluster.local:8080" }}
{{- $connections := list "server" }}
{{- if .Values.desktop.enabled }}{{- $connections = append $connections "desktop" }}{{- end }}
{{- $urls := list }}
{{- $configs := dict }}
{{- range $index, $name := $connections }}
{{- $urls = append $urls (printf "%s/b/%s" $router $name) }}
{{- $_ := set $configs (toString $index) (dict "enable" true "prefix_id" $name "key" "$(PLAYGROUND_ROUTER_TOKEN)") }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: playground-ui-data
  namespace: homelab-models
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: worker-local-retain
  resources:
    requests:
      storage: {{ .Values.ui.storage }}
---
# Named account: the compute admission policy admits the UI outside Kueue only under it.
apiVersion: v1
kind: ServiceAccount
metadata: {name: playground-ui, namespace: homelab-models}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: playground-ui, namespace: homelab-models}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: playground-ui}
  template:
    metadata:
      labels: {app: playground-ui}
      annotations:
        homelab/revision: {{ toJson .Values.ui | sha256sum | quote }}
    spec:
      serviceAccountName: playground-ui
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: {{ .Values.node }}}
      securityContext:
        fsGroup: 0
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: open-webui
          image: {{ .Values.ui.image | quote }}
          ports: [{name: http, containerPort: 8080}]
          env:
            - name: PLAYGROUND_ROUTER_TOKEN
              valueFrom: {secretKeyRef: {name: playground-router-auth, key: token}}
            # Seeds for a fresh install only: Open WebUI persists its connection config in its
            # database, so the live instance needs a one-time update of the stored connections.
            - {name: OLLAMA_BASE_URLS, value: {{ join ";" $urls | quote }}}
            - {name: OLLAMA_API_CONFIGS, value: {{ toJson $configs | quote }}}
            - name: WEBUI_SECRET_KEY
              valueFrom: {secretKeyRef: {name: playground-ui, key: secret-key}}
            - {name: WEBUI_NAME, value: Playground}
            - {name: WEBUI_URL, value: 'https://{{ .Values.ui.hostname }}.tail2f646b.ts.net'}
            - {name: ENABLE_OPENAI_API, value: 'false'}
            - {name: ENABLE_SIGNUP, value: 'true'}   # first account becomes admin; disable afterwards from the admin panel
            - {name: DEFAULT_MODELS, value: ''}
            - {name: ENABLE_WEB_SEARCH, value: 'false'}
            - {name: RAG_EMBEDDING_ENGINE, value: ''}
            # The data claim overlays /app/backend/data, hiding the embedding model baked into the image,
            # and egress is limited to the router: without offline mode startup stalls on Hugging Face.
            - {name: OFFLINE_MODE, value: 'true'}
            - {name: HF_HUB_OFFLINE, value: '1'}
            - {name: ENABLE_VERSION_UPDATE_CHECK, value: 'false'}
            # Open WebUI 0.11 defaults to native function calling and injects its built-in tools
            # (ask user, time) into every chat; small GGUF models answer with a tool-call JSON
            # instead of text. Seeds models.default_metadata on first boot only: the persisted
            # config wins afterwards (set live on 2026-09-27 for the existing claim).
            - {name: DEFAULT_MODEL_METADATA, value: '{"capabilities": {"builtin_tools": false}}'}
            # Persistent banner pointing at the gateway's hold page (seed for fresh installs; persisted config wins after first start).
            - {name: WEBUI_BANNERS, value: {{ .Values.ui.banners | toJson | quote }}}
            - {name: OLLAMA_KEEP_ALIVE, value: '5m'}
            - {name: AIOHTTP_CLIENT_TIMEOUT, value: '1800'}   # cold loads and switches are silent for over a minute
            - {name: AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST, value: '30'}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, initialDelaySeconds: 20}
          startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5, failureThreshold: 60}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /app/backend/data}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: playground-ui-data}}
---
apiVersion: v1
kind: Service
metadata: {name: playground-ui, namespace: homelab-models}
spec:
  selector: {app: playground-ui}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: playground, namespace: homelab-models}
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [{{ .Values.ui.hostname | quote }}]
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wake-playground
                port: {name: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: playground-ui, namespace: homelab-models}
spec:
  podSelector:
    matchLabels: {app: playground-ui}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: wake-playground}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: playground-router}
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
{{- end }}
