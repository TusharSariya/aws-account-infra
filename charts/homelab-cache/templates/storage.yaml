apiVersion: v1
kind: Namespace
metadata:
  name: homelab-cache
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
{{- range $name, $volume := .Values.volumes }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: homelab-cache-{{ $name }}
  annotations:
    helm.sh/resource-policy: keep
    homelab/project-id: {{ $volume.project | quote }}
spec:
  capacity: {storage: {{ $volume.size }}}
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  claimRef: {namespace: homelab-cache, name: {{ $name }}}
  local: {path: /var/mnt/local-path-provisioner/{{ $volume.path }}}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [{{ $.Values.node }}]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  namespace: homelab-cache
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ''
  volumeName: homelab-cache-{{ $name }}
  resources: {requests: {storage: {{ $volume.size }}}}
---
{{- end }}
