apiVersion: v1
kind: Service
metadata: {name: nexus, namespace: homelab-cache}
spec:
  selector: {app: nexus}
  ports:
    - {name: http, port: 8081, targetPort: 8081}
    - {name: docker-hub, port: 5000, targetPort: 5000}
    - {name: docker-ghcr, port: 5001, targetPort: 5001}
    - {name: docker-ecr, port: 5002, targetPort: 5002}
    - {name: docker-microsoft, port: 5004, targetPort: 5004}
    - {name: docker-build, port: 5003, targetPort: 5003}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: homelab-cache}
spec:
  selector: {app: nexus-postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
