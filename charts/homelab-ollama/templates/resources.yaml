apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: worker-local-retain
  resources:
    requests:
      storage: {{ .Values.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: {{ .Values.replicas }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: ollama}
  template:
    metadata:
      annotations:
        homelab/chart-revision: {{ .Values.chartRevision | default "local-render" | quote }}
      labels: {app: ollama}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.node }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ollama
          image: {{ .Values.image | quote }}
          args: [serve]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports: [{name: http, containerPort: 11434}]
          env:
            - {name: HOME, value: /models}
            - {name: OLLAMA_HOST, value: '0.0.0.0:11434'}
            - {name: OLLAMA_MODELS, value: /models/models}
            - {name: OLLAMA_MAX_LOADED_MODELS, value: '1'}
            - {name: OLLAMA_NUM_PARALLEL, value: '1'}
            - {name: OLLAMA_CONTEXT_LENGTH, value: '4096'}
            - {name: OLLAMA_KEEP_ALIVE, value: '5m'}
            - {name: OLLAMA_MAX_QUEUE, value: '16'}
            - {name: OLLAMA_NO_CLOUD, value: 'true'}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts: [{name: models, mountPath: /models}, {name: tmp, mountPath: /tmp}]
          startupProbe:
            httpGet: {path: /api/version, port: http}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /api/version, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/version, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
        - name: models
          persistentVolumeClaim: {claimName: ollama-models}
---
apiVersion: v1
kind: Service
metadata: {name: ollama}
spec:
  type: ClusterIP
  selector: {app: {{ if .Values.aggregateRuntime }}ai-runtime{{ else }}ollama{{ end }}}
  ports: [{name: http, port: 11434, targetPort: {{ if .Values.aggregateRuntime }}model{{ else }}http{{ end }}}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: ollama}
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [{{ .Values.hostname | quote }}]
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.wakeGateway | default "ollama" }}
                port: {name: http}
