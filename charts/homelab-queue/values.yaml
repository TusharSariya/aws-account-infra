worker: talos-worker-01
cpu: '31.25'
memory: 84Gi
scratch: 240Gi
# Measured root/image usage must fit alongside the pool and eviction headroom.
storageHeadroom: 8Gi
podHeadroom: 10
strategy: StrictFIFO
platformReserve:
  cpu: 6500m
  memory: 24Gi
queues:
  - {namespace: homelab-models, name: ai}
  - {namespace: arc-runners, name: ci}
  - {namespace: homelab-jobs, name: argo}
# Enable only after the always-on admission controller has passed wake-only acceptance.
power:
  enabled: false
