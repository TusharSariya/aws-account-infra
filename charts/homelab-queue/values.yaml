worker: talos-worker-01
cpu: '36'
memory: 160Gi
scratch: 60Gi
# Measured root/image usage must fit alongside the pool and eviction headroom.
storageHeadroom: 8Gi
podHeadroom: 10
strategy: StrictFIFO
platformReserve:
  cpu: 1500m
  memory: 8Gi
queues:
  - {namespace: homelab-models, name: ai}
  - {namespace: arc-runners, name: ci}
  - {namespace: homelab-jobs, name: argo}
