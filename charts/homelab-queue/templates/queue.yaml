{{- /* Helm owns policy; the coordinator owns only runtime quota numbers.
       lookup keeps the current quotas through upgrades. New installs start closed. */ -}}
{{- $existing := lookup "kueue.x-k8s.io/v1beta2" "ClusterQueue" "" "homelab-compute" -}}
{{- $quotas := dict -}}
{{- if and .Values.dynamic $existing -}}
{{- range $group := $existing.spec.resourceGroups -}}
{{- range $flavor := $group.flavors -}}
{{- range $resource := $flavor.resources -}}
{{- $_ := set $quotas (printf "%s/%s" $flavor.name $resource.name) $resource.nominalQuota -}}
{{- end -}}{{- end -}}{{- end -}}
{{- end -}}
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: homelab-worker}
spec:
  nodeLabels:
    kubernetes.io/hostname: {{ .Values.worker }}
{{- if .Values.power.enabled }}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: homelab-secondary}
spec:
  nodeLabels:
    kubernetes.io/hostname: talos-worker-02
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata: {name: homelab-host-ready}
spec:
  controllerName: homelab.tfdraw.dev/retained-host-power
{{- end }}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata: {name: homelab-compute}
spec:
{{- if .Values.power.enabled }}
  admissionChecksStrategy:
    admissionChecks:
      - name: homelab-host-ready
{{- end }}
  queueingStrategy: {{ .Values.strategy }}
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values: [homelab-models, homelab-jobs, arc-runners, homelab-inference]
  preemption:
    withinClusterQueue: Never
    reclaimWithinCohort: Never
  resourceGroups:
    - coveredResources: [cpu, memory, ephemeral-storage, pods]
      flavors:
        - name: homelab-worker
          resources:
            - name: cpu
              nominalQuota: {{ if .Values.dynamic }}{{ get $quotas "homelab-worker/cpu" | default "0" | quote }}{{ else }}{{ .Values.cpu | quote }}{{ end }}
            - name: memory
              nominalQuota: {{ if .Values.dynamic }}{{ get $quotas "homelab-worker/memory" | default "0" | quote }}{{ else }}{{ .Values.memory }}{{ end }}
            - name: ephemeral-storage
              nominalQuota: {{ if .Values.dynamic }}{{ get $quotas "homelab-worker/ephemeral-storage" | default "0" | quote }}{{ else }}{{ .Values.scratch }}{{ end }}
            - name: pods
              nominalQuota: {{ if .Values.dynamic }}{{ get $quotas "homelab-worker/pods" | default "0" | quote }}{{ else }}"100"{{ end }}
{{- if .Values.power.enabled }}
        - name: homelab-secondary
          resources:
            - name: cpu
              nominalQuota: {{ if .Values.dynamic }}{{ get $quotas "homelab-secondary/cpu" | default "0" | quote }}{{ else }}{{ .Values.cpu | quote }}{{ end }}
            - name: memory
              nominalQuota: {{ if .Values.dynamic }}{{ get $quotas "homelab-secondary/memory" | default "0" | quote }}{{ else }}{{ .Values.memory }}{{ end }}
            - name: ephemeral-storage
              nominalQuota: {{ if .Values.dynamic }}{{ get $quotas "homelab-secondary/ephemeral-storage" | default "0" | quote }}{{ else }}{{ .Values.scratch }}{{ end }}
            - name: pods
              nominalQuota: {{ if .Values.dynamic }}{{ get $quotas "homelab-secondary/pods" | default "0" | quote }}{{ else }}"100"{{ end }}
{{- end }}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata: {name: homelab-compute}
value: 0
description: Equal priority for homelab application compute
{{ range .Values.queues }}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: {{ .name }}, namespace: {{ .namespace }}}
spec: {clusterQueue: homelab-compute}
{{ end }}
