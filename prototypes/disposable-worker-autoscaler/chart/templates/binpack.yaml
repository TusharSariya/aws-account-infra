apiVersion: v1
kind: ServiceAccount
metadata:
  name: prototype-binpack
  namespace: prototype-slot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prototype-binpack-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kube-scheduler
subjects:
  - kind: ServiceAccount
    name: prototype-binpack
    namespace: prototype-slot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prototype-binpack-volumes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:volume-scheduler
subjects:
  - kind: ServiceAccount
    name: prototype-binpack
    namespace: prototype-slot
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prototype-binpack
  namespace: prototype-slot
data:
  scheduler.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    clientConnection:
      kubeconfig: /config/kubeconfig
    leaderElection:
      leaderElect: false
    profiles:
      - schedulerName: homelab-binpack
        plugins:
          score:
            enabled:
              - name: NodeResourcesFit
                weight: 100
        pluginConfig:
          - name: NodeResourcesFit
            args:
              scoringStrategy:
                type: MostAllocated
                resources:
                  - {name: cpu, weight: 1}
                  - {name: memory, weight: 1}
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: local
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: scheduler
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: local
        context:
          cluster: local
          user: scheduler
    current-context: local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prototype-binpack
  namespace: prototype-slot
spec:
  replicas: 1
  selector:
    matchLabels: {app: prototype-binpack}
  template:
    metadata:
      labels: {app: prototype-binpack}
    spec:
      serviceAccountName: prototype-binpack
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: scheduler
          image: registry.k8s.io/kube-scheduler:v1.36.3@sha256:128fc07d278d64c4f2cce416ed0a9f37b23a30cdde6f97873d18c9c78e259df4
          command: [kube-scheduler]
          args: [--config=/config/scheduler.yaml, --cert-dir=/tmp/certs]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 384Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            tcpSocket: {port: 10259}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: prototype-binpack}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prototype-binpack-authentication
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: prototype-binpack
    namespace: prototype-slot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prototype-binpack-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: prototype-binpack
    namespace: prototype-slot
