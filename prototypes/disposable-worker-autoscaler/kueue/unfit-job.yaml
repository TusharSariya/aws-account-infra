apiVersion: batch/v1
kind: Job
metadata:
  name: kueue-unfit-proof
  namespace: prototype-slot
  labels:
    kueue.x-k8s.io/queue-name: prototype-secondary
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        prototype.homelab/slot: secondary
        prototype.homelab/unsupported-hardware: "true"
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: proof
          image: docker.io/library/busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: [sh, -ec, 'echo "demand ran on fresh worker"; hostname; sleep 5']
          resources:
            requests: {cpu: 100m, memory: 32Mi, ephemeral-storage: 64Mi}
            limits: {memory: 64Mi, ephemeral-storage: 128Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
