[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "homelab-capacity"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyghmi==1.6.19", "paramiko==4.0.0"]

[project.scripts]
homelab-power = "homelab_capacity.cli:main"
homelab-coordinator = "homelab_capacity.coordinator:main"
powerctl = "homelab_capacity.control:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
