global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [/etc/monitoring/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: monitoring
    static_configs:
      - targets: ['prometheus:9090', 'loki:3100', 'alloy:12345', 'grafana:3000', 'alertmanager:9093']
  - job_name: kubelet
    scheme: https
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        regex: talos-cp-01|talos-worker-01|talos-worker-02
        action: keep
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
      - source_labels: [__meta_kubernetes_node_annotation_homelab_tfdraw_dev_power_intent]
        target_label: power_intent
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'kubelet_volume_stats_.*|kubelet_running_pods|kubelet_running_containers|process_.*'
        action: keep
