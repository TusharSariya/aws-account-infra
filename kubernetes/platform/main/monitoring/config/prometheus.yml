global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [/etc/monitoring/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: monitoring
    static_configs:
      - targets: ['prometheus:9090', 'loki:3100', 'alloy:12345', 'grafana:3000', 'alertmanager:9093']
  - job_name: kubelet
    scheme: https
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    static_configs:
      - targets: ['10.0.0.221:10250']
        labels: {node: talos-cp-01}
      - targets: ['10.0.0.222:10250']
        labels: {node: talos-worker-01}
      - targets: ['10.0.0.225:10250']
        labels: {node: talos-worker-02}
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'kubelet_volume_stats_.*|kubelet_running_pods|kubelet_running_containers|process_.*'
        action: keep
