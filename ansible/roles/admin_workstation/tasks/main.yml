---
- name: Assert the administration workstation is macOS
  ansible.builtin.assert:
    that:
      - ansible_system == "Darwin"
    fail_msg: "The administration workstation role currently supports macOS only."

- name: Check for Homebrew
  ansible.builtin.command: brew --version
  register: homebrew_check
  changed_when: false
  failed_when: false

- name: Require Homebrew bootstrap
  ansible.builtin.assert:
    that:
      - homebrew_check.rc == 0
    fail_msg: "Install Homebrew first; see ansible/README.md."

- name: Install administration tools
  community.general.homebrew:
    name: "{{ admin_workstation_homebrew_packages }}"
    state: present
    update_homebrew: false

- name: Install administration applications
  community.general.homebrew_cask:
    name: "{{ admin_workstation_homebrew_casks }}"
    state: present
  when: admin_workstation_homebrew_casks | length > 0

- name: Check for SDKMAN
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.sdkman/bin/sdkman-init.sh"
  register: admin_workstation_sdkman
  when: admin_workstation_install_sdkman

- name: Download SDKMAN installer
  ansible.builtin.get_url:
    url: https://get.sdkman.io
    dest: /tmp/sdkman-install.sh
    mode: "0700"
    checksum: "{{ admin_workstation_sdkman_installer_checksum }}"
  when:
    - admin_workstation_install_sdkman
    - not admin_workstation_sdkman.stat.exists

- name: Install SDKMAN
  ansible.builtin.command: /bin/bash /tmp/sdkman-install.sh
  environment:
    SDKMAN_DIR: "{{ ansible_facts['user_dir'] }}/.sdkman"
  when:
    - admin_workstation_install_sdkman
    - not admin_workstation_sdkman.stat.exists
  changed_when: true

- name: List installed Terraform versions
  ansible.builtin.command: tenv tf list
  register: admin_workstation_terraform_versions
  changed_when: false

- name: Install pinned Terraform with tenv
  ansible.builtin.command: "tenv tf install {{ admin_workstation_terraform_version }}"
  when: admin_workstation_terraform_version not in admin_workstation_terraform_versions.stdout
  changed_when: true

- name: Select pinned Terraform with tenv
  ansible.builtin.command: "tenv tf use {{ admin_workstation_terraform_version }}"
  changed_when: false

- name: List installed OpenTofu versions
  ansible.builtin.command: tenv tofu list
  register: admin_workstation_opentofu_versions
  changed_when: false

- name: Install pinned OpenTofu with tenv
  ansible.builtin.command: "tenv tofu install {{ admin_workstation_opentofu_version }}"
  when: admin_workstation_opentofu_version not in admin_workstation_opentofu_versions.stdout
  changed_when: true

- name: Select pinned OpenTofu with tenv
  ansible.builtin.command: "tenv tofu use {{ admin_workstation_opentofu_version }}"
  changed_when: false
