---
- name: Assert Multipass worker inputs exist
  ansible.builtin.assert:
    that:
      - multipass_worker_bridged_interface | length > 0
      - multipass_worker_ssh_public_key_path is file
    fail_msg: "Configure a bridged interface and an existing SSH public key."

- name: List Multipass instances
  ansible.builtin.command: multipass list --format json
  register: multipass_worker_instances
  changed_when: false

- name: Read configured Multipass bridge
  ansible.builtin.command: multipass get local.bridged-network
  register: multipass_worker_current_bridge
  changed_when: false
  failed_when: false

- name: Configure Multipass bridge
  ansible.builtin.command: >-
    multipass set local.bridged-network={{ multipass_worker_bridged_interface }}
  when: multipass_worker_current_bridge.stdout != multipass_worker_bridged_interface
  changed_when: true

- name: Render worker cloud-init
  ansible.builtin.template:
    src: cloud-init.yml.j2
    dest: "/tmp/{{ multipass_worker_name }}-cloud-init.yml"
    mode: "0600"

- name: Create bridged ARM64 worker
  ansible.builtin.command: >-
    multipass launch {{ multipass_worker_image }}
    --name {{ multipass_worker_name }}
    --cpus {{ multipass_worker_cpus }}
    --memory {{ multipass_worker_memory }}
    --disk {{ multipass_worker_disk }}
    --bridged
    --cloud-init /tmp/{{ multipass_worker_name }}-cloud-init.yml
  when: >-
    multipass_worker_name not in
    (multipass_worker_instances.stdout | from_json).list | map(attribute='name') | list
  changed_when: true

- name: Inspect bridged worker
  ansible.builtin.command: "multipass info {{ multipass_worker_name }} --format json"
  register: multipass_worker_info
  changed_when: false

- name: Report worker addresses
  ansible.builtin.debug:
    msg: >-
      Add a stable bridged address from
      {{ (multipass_worker_info.stdout | from_json).info[multipass_worker_name].ipv4 }}
      to the local inventory as mac_arm_worker.
