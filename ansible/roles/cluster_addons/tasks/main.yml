---
- name: Assert local cluster tools are installed
  ansible.builtin.command: "{{ item }} version"
  loop:
    - kubectl
    - helm
    - helmfile
  changed_when: false

- name: Assert MetalLB address pool is configured
  ansible.builtin.assert:
    that:
      - kubernetes_metallb_pool | length > 0
      - kubernetes_metallb_pool != "192.0.2.200-192.0.2.210"
    fail_msg: "Configure an unused MetalLB LAN range in local inventory."

- name: Create add-on working directory
  ansible.builtin.file:
    path: "{{ cluster_addons_work_dir }}"
    state: directory
    mode: "0700"

- name: Assert supply-chain policy gates
  ansible.builtin.assert:
    that:
      - cluster_addons_kyverno_enabled | bool
      - cluster_addons_kyverno_registry_secret_name | length > 0
      - cluster_addons_kyverno_certificate_identity | length > 0
      - cluster_addons_kyverno_certificate_issuer | length > 0
    fail_msg: >-
      Image verification requires a ready Kyverno installation, a dedicated
      runtime-refreshed ECR registry credential, and exact signing identity values.
  when: cluster_addons_kyverno_image_verification_enabled | bool

- name: Render protected platform priority class
  ansible.builtin.template:
    src: platform-priority.yml.j2
    dest: "{{ cluster_addons_work_dir }}/platform-priority.yml"
    mode: "0600"

- name: Apply protected platform priority class
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} apply --server-side
    --field-manager=ansible-cluster-addons
    --filename {{ cluster_addons_work_dir }}/platform-priority.yml
  register: cluster_addons_priority_apply
  changed_when: "'unchanged' not in cluster_addons_priority_apply.stdout"

- name: Download pinned local-path provisioner source
  ansible.builtin.get_url:
    url: >-
      https://github.com/rancher/local-path-provisioner/archive/refs/tags/v{{ cluster_addons_local_path_version }}.tar.gz
    dest: "{{ cluster_addons_work_dir }}/local-path-provisioner.tar.gz"
    mode: "0600"
    checksum: "{{ cluster_addons_local_path_checksum }}"

- name: Extract pinned local-path provisioner chart
  ansible.builtin.unarchive:
    src: "{{ cluster_addons_work_dir }}/local-path-provisioner.tar.gz"
    dest: "{{ cluster_addons_work_dir }}"
    remote_src: true
    creates: >-
      {{ cluster_addons_work_dir }}/local-path-provisioner-{{ cluster_addons_local_path_version }}/deploy/chart/local-path-provisioner/Chart.yaml

- name: Link pinned local-path provisioner chart
  ansible.builtin.file:
    src: "{{ cluster_addons_work_dir }}/local-path-provisioner-{{ cluster_addons_local_path_version }}"
    dest: "{{ cluster_addons_work_dir }}/local-path-provisioner"
    state: link

- name: Label storage and GPU control-plane node
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} label node
    {{ groups['kubernetes_control_plane'][0] | lower | replace('_', '-') }}
    accelerator=nvidia storage=local hardware-tier=gpu --overwrite
  register: cluster_addons_control_plane_labels
  changed_when: "'not labeled' not in cluster_addons_control_plane_labels.stdout"

- name: Make the single control plane schedulable
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} taint node
    {{ groups['kubernetes_control_plane'][0] | lower | replace('_', '-') }}
    node-role.kubernetes.io/control-plane-
  register: cluster_addons_control_plane_taint
  changed_when: cluster_addons_control_plane_taint.rc == 0
  failed_when:
    - cluster_addons_control_plane_taint.rc != 0
    - "'not found' not in cluster_addons_control_plane_taint.stderr"

- name: Allow the single control plane to advertise load balancer addresses
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} label node
    {{ groups['kubernetes_control_plane'][0] | lower | replace('_', '-') }}
    node.kubernetes.io/exclude-from-external-load-balancers-
  register: cluster_addons_control_plane_load_balancer_label
  changed_when: >-
    'not labeled' not in cluster_addons_control_plane_load_balancer_label.stdout

- name: Label legacy nodes
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} label node
    {{ item | lower | replace('_', '-') }} hardware-tier=legacy --overwrite
  register: cluster_addons_legacy_labels
  changed_when: "'not labeled' not in cluster_addons_legacy_labels.stdout"
  loop: "{{ groups['legacy_nodes'] | default([]) }}"

- name: Label ephemeral nodes
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} label node
    {{ item | lower | replace('_', '-') }} lifecycle=ephemeral --overwrite
  register: cluster_addons_ephemeral_labels
  changed_when: "'not labeled' not in cluster_addons_ephemeral_labels.stdout"
  loop: "{{ groups['ephemeral_nodes'] | default([]) }}"

- name: Taint legacy nodes
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} taint node
    {{ item | lower | replace('_', '-') }}
    workload-tier=light:NoSchedule --overwrite
  register: cluster_addons_legacy_taint
  changed_when: "'not tainted' not in cluster_addons_legacy_taint.stdout"
  loop: "{{ groups['legacy_nodes'] | default([]) }}"

- name: Taint ephemeral nodes
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} taint node
    {{ item | lower | replace('_', '-') }}
    lifecycle=ephemeral:NoSchedule --overwrite
  register: cluster_addons_ephemeral_taint
  changed_when: "'not tainted' not in cluster_addons_ephemeral_taint.stdout"
  loop: "{{ groups['ephemeral_nodes'] | default([]) }}"

- name: Install pinned Gateway API standard-channel CRDs
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} apply --server-side
    --filename https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ cluster_addons_gateway_api_version }}/standard-install.yaml
  changed_when: false

- name: Render pinned Helmfile
  ansible.builtin.template:
    src: helmfile.yaml.j2
    dest: "{{ cluster_addons_work_dir }}/helmfile.yaml"
    mode: "0600"

- name: Apply pinned cluster add-ons
  ansible.builtin.command: >-
    helmfile --file {{ cluster_addons_work_dir }}/helmfile.yaml apply
  environment:
    KUBECONFIG: "{{ cluster_addons_kubeconfig }}"
  register: cluster_addons_helmfile
  changed_when: "'Affected releases are:' in cluster_addons_helmfile.stdout"

- name: Wait for Kyverno admission to become available
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} wait
    deployment/kyverno-admission-controller --namespace kyverno
    --for=condition=Available --timeout=5m
  changed_when: false
  when: cluster_addons_kyverno_enabled | bool

- name: Verify Kyverno admission service has ready endpoints
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ cluster_addons_kubeconfig }}"
      - get
      - endpoints
      - kyverno-svc
      - --namespace
      - kyverno
      - -o
      - jsonpath={.subsets[0].addresses[0].ip}
  register: cluster_addons_kyverno_endpoint
  changed_when: false
  failed_when: cluster_addons_kyverno_endpoint.stdout | length == 0
  when: cluster_addons_kyverno_enabled | bool

- name: Render Kyverno image verification policy
  ansible.builtin.template:
    src: kyverno-image-policy.yml.j2
    dest: "{{ cluster_addons_work_dir }}/kyverno-image-policy.yml"
    mode: "0600"
  when: cluster_addons_kyverno_image_verification_enabled | bool

- name: Apply Kyverno image verification policy
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} apply --server-side
    --field-manager=ansible-cluster-addons
    --filename {{ cluster_addons_work_dir }}/kyverno-image-policy.yml
  register: cluster_addons_kyverno_policy_apply
  changed_when: "'unchanged' not in cluster_addons_kyverno_policy_apply.stdout"
  when: cluster_addons_kyverno_image_verification_enabled | bool

- name: Wait for the KEDA operator to be available
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} wait
    deployment/keda-operator --namespace keda
    --for=condition=Available --timeout=5m
  changed_when: false

- name: Mark the Ansible-owned monitoring namespace as an active route source
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} label namespace monitoring
    platform.homelab.tfdraw.dev/managed=true
    platform.homelab.tfdraw.dev/active-tenant=true --overwrite
  register: cluster_addons_monitoring_labels
  changed_when: "'not labeled' not in cluster_addons_monitoring_labels.stdout"

- name: Render Gateway API resources
  ansible.builtin.template:
    src: gateway-resources.yml.j2
    dest: "{{ cluster_addons_work_dir }}/gateway-resources.yml"
    mode: "0600"

- name: Apply Gateway API resources
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} apply
    --filename {{ cluster_addons_work_dir }}/gateway-resources.yml
  register: cluster_addons_gateway_apply
  changed_when: "'unchanged' not in cluster_addons_gateway_apply.stdout"

- name: Check for the retired Envoy Gateway release
  ansible.builtin.command: helm status envoy-gateway --namespace envoy-gateway-system
  register: cluster_addons_envoy_gateway_status
  changed_when: false
  failed_when: false

- name: Remove the retired Envoy Gateway release after Istio verification
  ansible.builtin.command: helm uninstall envoy-gateway --namespace envoy-gateway-system
  when: cluster_addons_envoy_gateway_status.rc == 0
  changed_when: true

- name: Remove retired Envoy Gateway resources
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} delete {{ item }} --ignore-not-found
  loop:
    - gatewayclass envoy
    - namespace envoy-gateway-system
    - namespace gateway-system
  when: cluster_addons_envoy_gateway_status.rc == 0
  changed_when: true

- name: Check for the retired ingress-nginx release
  ansible.builtin.command: helm status ingress-nginx --namespace ingress-nginx
  register: cluster_addons_ingress_nginx_status
  changed_when: false
  failed_when: false

- name: Remove the retired ingress-nginx release after Gateway verification
  ansible.builtin.command: helm uninstall ingress-nginx --namespace ingress-nginx
  when: cluster_addons_ingress_nginx_status.rc == 0
  changed_when: true

- name: Render MetalLB address resources
  ansible.builtin.template:
    src: metallb-resources.yml.j2
    dest: "{{ cluster_addons_work_dir }}/metallb-resources.yml"
    mode: "0600"

- name: Apply MetalLB address resources
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} apply
    --filename {{ cluster_addons_work_dir }}/metallb-resources.yml
  register: cluster_addons_metallb_apply
  changed_when: "'unchanged' not in cluster_addons_metallb_apply.stdout"

# The helm release reporting Ready does NOT mean the admission webhook is
# serving. A ClusterIssuer applied before it is fails admission with a
# connection error that reads like a network fault, so gate the apply on it.
- name: Wait for the cert-manager webhook to be available
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} wait
    deployment/cert-manager-webhook --namespace cert-manager
    --for=condition=Available --timeout=5m
  changed_when: false

# no_log: the rendered file embeds the Cloudflare API token.
- name: Render cert-manager issuer resources
  ansible.builtin.template:
    src: cert-resources.yml.j2
    dest: "{{ cluster_addons_work_dir }}/cert-resources.yml"
    mode: "0600"
  no_log: true

- name: Apply cert-manager issuer resources
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} apply
    --filename {{ cluster_addons_work_dir }}/cert-resources.yml
  register: cluster_addons_cert_apply
  changed_when: "'unchanged' not in cluster_addons_cert_apply.stdout"

# The token is in the cluster as a Secret now; don't leave a plaintext copy in
# the work dir. Retires the "--from-literal leaks on argv" follow-up noted in
# docs/plans/ansible-vault.md by never putting it on a command line at all.
- name: Remove the rendered issuer manifest (contains the Cloudflare token)
  ansible.builtin.file:
    path: "{{ cluster_addons_work_dir }}/cert-resources.yml"
    state: absent

- name: Wait for the ACME issuer to register an account
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} wait
    clusterissuer/{{ cluster_addons_acme_issuer }}
    --for=condition=Ready --timeout=2m
  changed_when: false

- name: Wait for the homelab wildcard certificate
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} wait
    certificate/homelab-wildcard --namespace {{ cluster_addons_gateway_namespace }}
    --for=condition=Ready --timeout=10m
  changed_when: false

- name: Wait for the shared Gateway
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} wait
    gateway/{{ cluster_addons_gateway_name }}
    --namespace {{ cluster_addons_gateway_namespace }}
    --for=condition=Programmed --timeout=10m
  changed_when: false

- name: Wait for the Grafana HTTPRoute
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_addons_kubeconfig }} wait
    httproute/grafana --namespace monitoring
    --for=jsonpath='{.status.parents[0].conditions[?(@.type=="Accepted")].status}'=True
    --timeout=5m
  changed_when: false

- name: Verify Grafana through Gateway API HTTPS listener
  ansible.builtin.uri:
    url: "https://{{ cluster_addons_gateway_address }}/login"
    headers:
      Host: "{{ cluster_addons_grafana_hostname }}"
    status_code: 200
    use_proxy: false
    validate_certs: "{{ cluster_addons_acme_issuer == 'letsencrypt-prod' }}"
