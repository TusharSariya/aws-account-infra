---
cluster_addons_kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/config"
cluster_addons_work_dir: /tmp/homelab-kubernetes-platform
cluster_addons_cilium_version: 1.19.5
cluster_addons_metallb_version: 0.16.1
cluster_addons_metrics_server_version: 3.13.1
cluster_addons_local_path_version: 0.0.36
cluster_addons_local_path_checksum: >-
  sha256:55d3dd5eae9683e8e93b2b9dbc6c7824e22f683edffe44d779e6a1939eb45ba6
cluster_addons_gpu_operator_version: v26.3.3
cluster_addons_kube_prometheus_stack_version: 87.10.1
cluster_addons_loki_version: 18.4.0
cluster_addons_loki_retention: "{{ kubernetes_loki_retention_hours | default('336') }}h"
cluster_addons_loki_storage_size: "{{ kubernetes_loki_storage_size | default('20Gi') }}"
cluster_addons_istio_version: 1.30.2
# KEDA event-driven autoscaler chart. Verified current on artifacthub 2026-07-11
# (kedacore/keda 2.20.1); re-verify against https://kedacore.github.io/charts
# before apply and keep pinned per repo policy.
cluster_addons_keda_version: 2.20.1
# cert-manager. Verified current against https://charts.jetstack.io/index.yaml
# on 2026-07-16 (v1.21.0 latest stable); re-verify before apply and keep pinned
# per repo policy. Install record: docs/plans/cert-manager.md
cluster_addons_cert_manager_version: v1.21.0
# ACME/DNS-01 wiring. The issuer defaults to STAGING: the prod cutover is a
# deliberate one-variable flip once the DNS-01 loop is proven, because Let's
# Encrypt's prod rate limits are unforgiving of a debugging session.
cluster_addons_acme_email: "{{ kubernetes_acme_email }}"
cluster_addons_acme_issuer: "{{ kubernetes_acme_issuer | default('letsencrypt-staging') }}"
cluster_addons_cloudflare_zone: "{{ kubernetes_cloudflare_zone }}"
cluster_addons_homelab_domain: "{{ kubernetes_homelab_domain }}"
cluster_addons_gateway_api_version: v1.5.1
cluster_addons_gateway_namespace: "{{ kubernetes_gateway_namespace }}"
cluster_addons_gateway_name: "{{ kubernetes_gateway_name }}"
cluster_addons_gateway_address: "{{ kubernetes_gateway_address }}"
cluster_addons_grafana_hostname: "{{ kubernetes_grafana_hostname }}"
cluster_addons_local_storage_path: /var/local-path-provisioner

# Vending add-ons are pinned but disabled until the Kubernetes 1.35 rebuild and
# compatibility checks in docs/kubernetes-vending.md have completed.
cluster_addons_argocd_enabled: false
cluster_addons_argocd_version: 10.3.3
cluster_addons_kyverno_enabled: false
cluster_addons_kyverno_version: 3.8.2
cluster_addons_kyverno_image_verification_enabled: false
cluster_addons_kyverno_enforce: false
cluster_addons_kyverno_ecr_registry: 992382747916.dkr.ecr.us-east-1.amazonaws.com
cluster_addons_kyverno_ecr_repository: court-booker
cluster_addons_kyverno_registry_secret_name: ""
cluster_addons_kyverno_certificate_identity: >-
  https://github.com/TusharSariyaOrg/aws-account-infra/.github/workflows/ecr-push.yml@refs/heads/main
cluster_addons_kyverno_certificate_issuer: https://token.actions.githubusercontent.com
