---
- name: Assert local cluster tools are installed
  ansible.builtin.command: "{{ item }} version"
  loop:
    - kubectl
    - helm
    - helmfile
  changed_when: false

- name: Create harvester working directory
  ansible.builtin.file:
    path: "{{ cluster_harvester_work_dir }}"
    state: directory
    mode: "0700"

- name: Ensure the harvester namespace exists
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_harvester_kubeconfig }} create namespace
    {{ cluster_harvester_namespace }} --dry-run=client --output yaml
  register: cluster_harvester_ns
  changed_when: false

- name: Apply the harvester namespace
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_harvester_kubeconfig }} apply --filename -
  args:
    stdin: "{{ cluster_harvester_ns.stdout }}"
  register: cluster_harvester_ns_apply
  changed_when: "'unchanged' not in cluster_harvester_ns_apply.stdout"

- name: Render the harvester worker secret from Vault (when provided)
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_harvester_kubeconfig }} create secret generic
    {{ cluster_harvester_secret }} --namespace {{ cluster_harvester_namespace }}
    --from-literal=SUPABASE_URL={{ vault_harvester_supabase_url }}
    --from-literal=SUPABASE_SERVICE_KEY={{ vault_harvester_service_key }}
    --dry-run=client --output yaml
  register: cluster_harvester_secret_manifest
  changed_when: false
  no_log: true
  when:
    - vault_harvester_supabase_url is defined
    - vault_harvester_service_key is defined

- name: Apply the harvester worker secret
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_harvester_kubeconfig }} apply --filename -
  args:
    stdin: "{{ cluster_harvester_secret_manifest.stdout }}"
  no_log: true
  changed_when: true
  when:
    - vault_harvester_supabase_url is defined
    - vault_harvester_service_key is defined

- name: Assert the harvester worker secret exists
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_harvester_kubeconfig }} get secret
    {{ cluster_harvester_secret }} --namespace {{ cluster_harvester_namespace }}
  changed_when: false

- name: Render the KEDA postgresql scaler secret from Vault (when provided)
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_harvester_kubeconfig }} create secret generic
    {{ cluster_harvester_keda_auth_secret }} --namespace {{ cluster_harvester_namespace }}
    --from-literal=connection={{ vault_harvester_keda_dsn }}
    --dry-run=client --output yaml
  register: cluster_harvester_keda_secret_manifest
  changed_when: false
  no_log: true
  when: vault_harvester_keda_dsn is defined

- name: Apply the KEDA postgresql scaler secret
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_harvester_kubeconfig }} apply --filename -
  args:
    stdin: "{{ cluster_harvester_keda_secret_manifest.stdout }}"
  no_log: true
  changed_when: true
  when: vault_harvester_keda_dsn is defined

- name: Assert the KEDA postgresql scaler secret exists
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_harvester_kubeconfig }} get secret
    {{ cluster_harvester_keda_auth_secret }} --namespace {{ cluster_harvester_namespace }}
  changed_when: false

- name: Render harvester KEDA resources
  ansible.builtin.template:
    src: harvester-resources.yml.j2
    dest: "{{ cluster_harvester_work_dir }}/harvester-resources.yml"
    mode: "0600"

- name: Apply harvester KEDA resources
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_harvester_kubeconfig }} apply
    --filename {{ cluster_harvester_work_dir }}/harvester-resources.yml
  register: cluster_harvester_resources_apply
  changed_when: "'unchanged' not in cluster_harvester_resources_apply.stdout"

- name: Verify the harvester ScaledJobs exist
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_harvester_kubeconfig }} --namespace
    {{ cluster_harvester_namespace }} get scaledjob
  changed_when: false
