---
- name: Assert MLX host is Apple Silicon macOS
  ansible.builtin.assert:
    that:
      - ansible_facts["system"] == "Darwin"
      - ansible_facts["architecture"] == "arm64"
    fail_msg: "MLX requires an Apple Silicon macOS host."

- name: Install pinned Python with pyenv
  ansible.builtin.command: "pyenv install --skip-existing {{ mlx_host_python_version }}"
  environment:
    PYENV_ROOT: "{{ ansible_facts['user_dir'] }}/.pyenv"
  register: mlx_host_pyenv_install
  changed_when: "'Installed Python' in mlx_host_pyenv_install.stdout"

- name: Create MLX virtual environment
  ansible.builtin.command: >-
    {{ ansible_facts['user_dir'] }}/.pyenv/versions/{{ mlx_host_python_version }}/bin/python
    -m venv {{ mlx_host_virtualenv }}
  args:
    creates: "{{ mlx_host_virtualenv }}/bin/python"

- name: Install pinned MLX packages
  ansible.builtin.pip:
    name:
      - "mlx=={{ mlx_host_mlx_version }}"
      - "mlx-lm=={{ mlx_host_mlx_lm_version }}"
    virtualenv: "{{ mlx_host_virtualenv }}"

- name: Assert enabled MLX service has a model
  ansible.builtin.assert:
    that:
      - mlx_host_model | length > 0
    fail_msg: "Set mlx_host_model before enabling the MLX API service."
  when: mlx_host_service_enabled

- name: Install MLX launch agent
  ansible.builtin.template:
    src: io.homelab.mlx-api.plist.j2
    dest: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/{{ mlx_host_label }}.plist"
    mode: "0600"
  when: mlx_host_service_enabled
  notify: Restart MLX API

- name: Enable MLX API
  community.general.launchd:
    name: "{{ mlx_host_label }}"
    enabled: true
    state: started
  when: mlx_host_service_enabled
