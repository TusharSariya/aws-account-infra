---
cluster_validation_kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/config"
cluster_validation_timeout: 10m
cluster_validation_run_connectivity_test: true
cluster_validation_work_dir: /tmp/homelab-cluster-validation
cluster_validation_namespace: infra-validation
cluster_validation_gpu_image: nvidia/cuda:13.1.1-base-ubuntu24.04
cluster_validation_gateway_namespace: "{{ kubernetes_gateway_namespace }}"
cluster_validation_gateway_name: "{{ kubernetes_gateway_name }}"
cluster_validation_gateway_hostname: validation.home.arpa
cluster_validation_loki_check: true
cluster_validation_loki_namespace: monitoring
cluster_validation_loki_selector: app.kubernetes.io/component=single-binary
