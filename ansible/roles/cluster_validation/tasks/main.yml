---
- name: Wait for all nodes to become ready
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_validation_kubeconfig }} wait node
    --all --for=condition=Ready --timeout={{ cluster_validation_timeout }}
  changed_when: false

- name: Check Cilium health
  ansible.builtin.command: >-
    cilium status --kubeconfig {{ cluster_validation_kubeconfig }}
    --wait --wait-duration {{ cluster_validation_timeout }}
  changed_when: false

- name: Run Cilium connectivity tests
  ansible.builtin.command: >-
    cilium connectivity test --kubeconfig {{ cluster_validation_kubeconfig }}
    --test-concurrency 1
  when: cluster_validation_run_connectivity_test | bool
  changed_when: false

- name: Read node inventory
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_validation_kubeconfig }} get nodes -o json
  register: cluster_validation_nodes
  changed_when: false

- name: Assert expected architecture and GPU resources
  ansible.builtin.assert:
    that:
      - >-
        (((cluster_validation_nodes.stdout | from_json)['items'] |
        selectattr('metadata.name', 'equalto',
        groups['kubernetes_control_plane'][0] | lower | replace('_', '-')) |
        map(attribute='status.allocatable') |
        first)['nvidia.com/gpu'] | int) == 1
      - >-
        groups['ephemeral_nodes'] | default([]) | length == 0 or
        ((cluster_validation_nodes.stdout | from_json)['items'] |
        selectattr('metadata.name', 'in',
        groups['ephemeral_nodes'] | map('regex_replace', '_', '-') | list) |
        map(attribute='status.nodeInfo.architecture') |
        select('equalto', 'arm64') | list | length) ==
        (groups['ephemeral_nodes'] | length)
    fail_msg: "Expected NVIDIA or ARM64 node capabilities were not advertised."

- name: Check GPU Operator policy
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_validation_kubeconfig }}
    wait clusterpolicy/cluster-policy --for=jsonpath='{.status.state}'=ready
    --timeout={{ cluster_validation_timeout }}
  changed_when: false

- name: Read shared Gateway
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_validation_kubeconfig }}
    get gateway {{ cluster_validation_gateway_name }}
    --namespace {{ cluster_validation_gateway_namespace }} -o json
  register: cluster_validation_gateway
  changed_when: false

- name: Assert MetalLB assigned and programmed the Gateway
  ansible.builtin.assert:
    that:
      - >-
        (cluster_validation_gateway.stdout | from_json).status.addresses |
        default([]) | length > 0
      - >-
        (cluster_validation_gateway.stdout | from_json).status.conditions |
        selectattr('type', 'equalto', 'Programmed') |
        selectattr('status', 'equalto', 'True') | list | length == 1
    fail_msg: "The shared Gateway is not programmed with a MetalLB address."

- name: Wait for Loki to be ready
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_validation_kubeconfig }} wait pod
    --namespace {{ cluster_validation_loki_namespace }}
    --selector {{ cluster_validation_loki_selector }}
    --for=condition=Ready --timeout={{ cluster_validation_timeout }}
  when: cluster_validation_loki_check | bool
  changed_when: false

- name: Create validation working directory
  ansible.builtin.file:
    path: "{{ cluster_validation_work_dir }}"
    state: directory
    mode: "0700"

- name: Render disposable smoke tests
  ansible.builtin.template:
    src: smoke-tests.yml.j2
    dest: "{{ cluster_validation_work_dir }}/smoke-tests.yml"
    mode: "0600"

- name: Remove stale smoke-test namespace
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_validation_kubeconfig }} delete namespace
    {{ cluster_validation_namespace }} --ignore-not-found --wait=false
  changed_when: true

- name: Wait for stale smoke-test namespace deletion
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ cluster_validation_kubeconfig }} wait
    --for=delete namespace/{{ cluster_validation_namespace }}
    --timeout={{ cluster_validation_timeout }}
  changed_when: false

- name: Execute disposable cluster smoke tests
  block:
    - name: Apply smoke-test resources
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ cluster_validation_kubeconfig }} apply
        --filename {{ cluster_validation_work_dir }}/smoke-tests.yml
      changed_when: true

    - name: Wait for smoke-test jobs
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ cluster_validation_kubeconfig }} wait job
        --namespace {{ cluster_validation_namespace }} --all
        --for=condition=complete --timeout={{ cluster_validation_timeout }}
      changed_when: false

    - name: Wait for Gateway API smoke deployment
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ cluster_validation_kubeconfig }} wait deployment/ingress-smoke
        --namespace {{ cluster_validation_namespace }} --for=condition=Available
        --timeout={{ cluster_validation_timeout }}
      changed_when: false

    - name: Wait for Gateway API smoke route
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ cluster_validation_kubeconfig }} wait
        httproute/gateway-smoke --namespace {{ cluster_validation_namespace }}
        --for=jsonpath='{.status.parents[0].conditions[?(@.type=="Accepted")].status}'=True
        --timeout={{ cluster_validation_timeout }}
      changed_when: false

    - name: Verify HTTPRoute through MetalLB
      ansible.builtin.uri:
        url: >-
          http://{{ (cluster_validation_gateway.stdout | from_json).status.addresses[0].value }}/
        headers:
          Host: "{{ cluster_validation_gateway_hostname }}"
        status_code: 200
        use_proxy: false
  always:
    - name: Remove smoke-test namespace
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ cluster_validation_kubeconfig }} delete namespace
        {{ cluster_validation_namespace }} --ignore-not-found --wait=false
      changed_when: true
