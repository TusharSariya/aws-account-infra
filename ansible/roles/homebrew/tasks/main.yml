---
# Homebrew package management (macOS only).
#
# Posture: additive install + drift WARNING. `brew bundle` ensures the declared
# packages are present; undeclared-but-installed packages are surfaced as a
# warning and NEVER removed. `--no-upgrade` keeps runs non-disruptive (Ansible
# never force-upgrades; you run `brew upgrade` deliberately).
#
# Install and drift both read ONE assembled union Brewfile, so the "what should
# be installed" policy and the "what counts as declared" policy can't diverge.

- name: Assert the workstation is macOS
  ansible.builtin.assert:
    that:
      - ansible_facts["system"] == "Darwin"
    fail_msg: "The homebrew role supports macOS only."

- name: Check for Homebrew
  ansible.builtin.command: brew --version
  register: homebrew_check
  changed_when: false
  failed_when: false

- name: Require Homebrew bootstrap
  ansible.builtin.assert:
    that:
      - homebrew_check.rc == 0
    fail_msg: "Install Homebrew first; see ansible/README.md."

- name: Create a private temporary path for the assembled policy
  ansible.builtin.tempfile:
    state: file
    suffix: .Brewfile
  register: homebrew_union
  changed_when: false

- name: Assemble enabled Brewfiles into one union policy
  ansible.builtin.copy:
    dest: "{{ homebrew_union.path }}"
    mode: "0600"
    content: |
      {% for bundle in homebrew_bundles %}
      {{ lookup('ansible.builtin.file', role_path ~ '/files/Brewfile.' ~ bundle) }}
      {% endfor %}
  changed_when: false

- name: Check whether the declared Homebrew packages are installed
  ansible.builtin.command: "brew bundle check --no-upgrade --file={{ homebrew_union.path }}"
  register: homebrew_bundle_check
  changed_when: false
  failed_when: homebrew_bundle_check.rc not in [0, 1]

- name: Install missing Homebrew packages
  ansible.builtin.command: "brew bundle install --no-upgrade --file={{ homebrew_union.path }}"
  when: homebrew_bundle_check.rc == 1
  changed_when: true

# Read-only drift detection. `brew bundle cleanup` (no --force) lists what would
# be removed to make the machine match the union. It exits 1 whenever it has
# *anything* to propose (including routine cache pruning), so rc is NOT a drift
# signal -- we key off the parsed package list instead, and only guard against
# genuinely unexpected exit codes. `check_mode: false` so it still runs under
# `--check` (a bare command is otherwise skipped).
- name: Detect undeclared Homebrew packages (drift, read-only)
  ansible.builtin.command: "brew bundle cleanup --formula --cask --tap --file={{ homebrew_union.path }}"
  register: homebrew_drift
  changed_when: false
  failed_when: homebrew_drift.rc not in [0, 1]
  check_mode: false

# Keep only the "Would uninstall / Would untap" lines; drop the noisy
# "Would `brew cleanup`" old-version/cache section and the trailing hint line.
- name: Reduce drift output to undeclared packages only
  ansible.builtin.set_fact:
    homebrew_drift_report: >-
      {{ homebrew_drift.stdout
         | regex_replace('(?s)\nWould `brew cleanup`.*$', '')
         | regex_replace('(?s)\nRun `brew bundle cleanup.*$', '')
         | trim }}

- name: Warn about undeclared Homebrew packages
  ansible.builtin.debug:
    msg: >-
      {{
        ['These Homebrew items are installed but not declared in any Brewfile.',
         'Add them to a Brewfile so Ansible manages them (nothing is removed):',
         '']
        + homebrew_drift_report.splitlines()
      }}
  when: homebrew_drift_report | length > 0
