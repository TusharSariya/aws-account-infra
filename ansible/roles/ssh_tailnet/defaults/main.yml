---
# Binding sshd to the tailnet removes every other way into the host. Opt in per
# host so a LAN-only member of ubuntu_compute can never lock itself out by
# inheriting this role from the group.
ssh_tailnet_enabled: false

# Interface tailscaled creates. The bind address is read from this interface's
# facts rather than hardcoded, so the role stays correct if Tailscale reassigns.
ssh_tailnet_interface: tailscale0

# Additional addresses sshd should also bind, e.g. a LAN address kept as a
# fallback path for when tailscaled is down. Empty means tailnet-only, which is
# stricter but leaves the physical console as the only recovery route.
ssh_tailnet_extra_listen_addresses: []

# Restrict logins to the account Ansible connects as. Set to [] to omit
# AllowUsers entirely.
ssh_tailnet_allow_users:
  - "{{ ansible_user }}"

# Deliberately off. ufw's default-deny policy severs the Kubernetes API (6443),
# kubelet (10250), MetalLB's LAN advertisements and Gateway ingress on any host
# in kubernetes_nodes. Enable only on hosts outside the cluster, and only after
# writing the corresponding allow rules.
ssh_tailnet_manage_firewall: false
