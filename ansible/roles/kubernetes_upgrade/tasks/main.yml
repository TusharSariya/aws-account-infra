---
- name: Configure target Kubernetes package repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    types:
      - deb
    uris:
      - "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_upgrade_minor_version }}/deb/"
    suites:
      - /
    signed_by: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_upgrade_minor_version }}/deb/Release.key"
    state: present

- name: Unhold kubeadm
  ansible.builtin.dpkg_selections:
    name: kubeadm
    selection: install

- name: Upgrade kubeadm first
  ansible.builtin.apt:
    name: "kubeadm={{ kubernetes_upgrade_package_version }}"
    state: present
    update_cache: true
  register: kubernetes_upgrade_kubeadm

- name: Hold kubeadm
  ansible.builtin.dpkg_selections:
    name: kubeadm
    selection: hold

- name: Upgrade control-plane state
  ansible.builtin.command: "kubeadm upgrade apply {{ kubernetes_upgrade_version }} --yes"
  when:
    - inventory_hostname in groups['kubernetes_control_plane']
    - kubernetes_upgrade_kubeadm.changed
  changed_when: true

- name: Upgrade worker node state
  ansible.builtin.command: kubeadm upgrade node
  when:
    - inventory_hostname in groups['kubernetes_workers']
    - kubernetes_upgrade_kubeadm.changed
  changed_when: true

- name: Unhold kubelet and kubectl
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop:
    - kubelet
    - kubectl

- name: Upgrade kubelet and kubectl
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_upgrade_package_version }}"
      - "kubectl={{ kubernetes_upgrade_package_version }}"
    state: present

- name: Hold kubelet and kubectl
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubectl

- name: Restart kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    daemon_reload: true
    state: restarted

- name: Reboot upgraded node when explicitly requested
  ansible.builtin.reboot:
    reboot_timeout: 900
  when: kubernetes_upgrade_reboot
