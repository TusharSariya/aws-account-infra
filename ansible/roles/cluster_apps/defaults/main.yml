---
cluster_apps_kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/config"
cluster_apps_work_dir: /tmp/homelab-kubernetes-apps

# Pinned versions (verified current 2026-07-06). Keep pinned per repo policy.
cluster_apps_pihole_chart_version: 2.37.0
cluster_apps_pihole_image_tag: "2026.06.0"
cluster_apps_alloy_image: grafana/alloy:v1.17.1
cluster_apps_pihole_exporter_image: ekofr/pihole-exporter:v1.2.0

cluster_apps_pihole_namespace: pihole
cluster_apps_pihole_secret: pihole-admin
cluster_apps_pihole_pvc: pihole-data

# Environment-specific values come from the inventory (kubernetes_* vars).
cluster_apps_pihole_dns_address: "{{ kubernetes_pihole_dns_address }}"
cluster_apps_pihole_hostname: "{{ kubernetes_pihole_hostname }}"
cluster_apps_grafana_hostname: "{{ kubernetes_grafana_hostname }}"
cluster_apps_gateway_address: "{{ kubernetes_gateway_address }}"
cluster_apps_gateway_name: "{{ kubernetes_gateway_name }}"
cluster_apps_gateway_namespace: "{{ kubernetes_gateway_namespace }}"

# In-cluster Loki push endpoint (Loki lives in the monitoring namespace).
cluster_apps_loki_push_url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

# CoreDNS ClusterIP — the Alloy sidecar needs it to resolve in-cluster service
# names (Pi-hole's own dnsPolicy:None/127.0.0.1 cannot). Conventionally the .10 of
# the service subnet.
cluster_apps_cluster_dns: "{{ kubernetes_cluster_dns | default('10.96.0.10') }}"
