---
- name: Assert the host is Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Ubuntu"
    fail_msg: "The Tailscale subnet router role supports Ubuntu only."

- name: Locate the tailscale binary
  ansible.builtin.stat:
    path: /usr/bin/tailscale
  register: tailscale_subnet_router_binary

- name: Require the tailscale client
  ansible.builtin.assert:
    that:
      - tailscale_subnet_router_binary.stat.exists
    fail_msg: >-
      /usr/bin/tailscale is missing. Install Tailscale and run `sudo tailscale
      up` before applying this role.

# Every route is validated before anything is applied. A malformed or overly
# broad entry here is not a cosmetic problem: an accepted route outranks the
# client's own LAN route, so a bad prefix silently reroutes traffic for every
# device on the tailnet through this single WiFi-attached node.
- name: Assert every advertised route is a plausible LAN prefix
  ansible.builtin.assert:
    that:
      - item is match("^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$")
      - item.split("/")[1] | int >= tailscale_subnet_router_min_prefix_length
      # 100.64.0.0/10 is the CGNAT range Tailscale allocates from. Advertising
      # any part of it would black-hole the tailnet itself, including the SSH
      # path this play is running over.
      - not item is match("^100\.")
      - item != "0.0.0.0/0"
    fail_msg: >-
      Refusing to advertise {{ item }}: it must be an IPv4 CIDR no broader than
      /{{ tailscale_subnet_router_min_prefix_length }}, outside 100.64.0.0/10,
      and not a default route. Exit-node behaviour is out of scope for this role.
    quiet: true
  loop: "{{ tailscale_subnet_router_routes }}"

- name: Read the Tailscale backend status
  ansible.builtin.command: tailscale status --json
  changed_when: false
  check_mode: false
  register: tailscale_subnet_router_status_raw

# Subnet routing depends on tailscaled actually being connected, not merely on
# the unit being active: `systemctl is-active tailscaled` stays green after the
# WiFi link has dropped its association.
- name: Require a running tailnet connection
  ansible.builtin.assert:
    that:
      - tailscale_subnet_router_status.BackendState == "Running"
    fail_msg: >-
      tailscaled reports BackendState
      "{{ tailscale_subnet_router_status.BackendState | default('unknown') }}",
      not "Running". Bring the tailnet up before advertising routes.
  vars:
    tailscale_subnet_router_status: >-
      {{ tailscale_subnet_router_status_raw.stdout | from_json }}

# Kubernetes already sets net.ipv4.ip_forward on this host, but the subnet
# router must not depend on that: the two features are enabled independently and
# a node that stops being a cluster member still needs to forward.
- name: Enable IPv4 forwarding for subnet routing
  ansible.builtin.copy:
    dest: "{{ tailscale_subnet_router_sysctl_file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (role: tailscale_subnet_router).
      # Required to forward tailnet traffic to LAN destinations.
      net.ipv4.ip_forward = 1
  notify: Reload tailscale sysctls

- name: Apply pending sysctl changes before advertising
  ansible.builtin.meta: flush_handlers

- name: Read the current Tailscale preferences
  ansible.builtin.command: tailscale debug prefs
  changed_when: false
  check_mode: false
  register: tailscale_subnet_router_prefs_raw

- name: Determine whether the advertised routes already match
  ansible.builtin.set_fact:
    tailscale_subnet_router_current: >-
      {{ (tailscale_subnet_router_prefs_raw.stdout | from_json).AdvertiseRoutes
         | default([], true) | sort }}
    tailscale_subnet_router_desired: "{{ tailscale_subnet_router_routes | sort }}"

# `tailscale set` rather than `tailscale up`: `up` requires every non-default
# flag to be restated on each invocation and silently resets the ones omitted,
# which is not something a repeatedly-run playbook can do safely. `set` changes
# only the preference named.
- name: Advertise the homelab routes
  ansible.builtin.command:
    argv:
      - tailscale
      - set
      - "--advertise-routes={{ tailscale_subnet_router_routes | join(',') }}"
  when: tailscale_subnet_router_current != tailscale_subnet_router_desired
  changed_when: true

- name: Re-read the Tailscale status after advertising
  ansible.builtin.command: tailscale status --json
  changed_when: false
  register: tailscale_subnet_router_verify_raw
  when: not ansible_check_mode

# A route the node advertises but the tailnet has not approved is invisible to
# every client: `tailscale debug prefs` shows it, traffic does not flow. Only
# the approved set comes back in Self.AllowedIPs, so that is what gets checked.
- name: Assert the advertised routes have been approved
  ansible.builtin.assert:
    that:
      - tailscale_subnet_router_desired
        | difference(tailscale_subnet_router_allowed) | length == 0
    fail_msg: >-
      {{ tailscale_subnet_router_desired | difference(tailscale_subnet_router_allowed) | join(", ") }}
      is advertised but not approved, so no tailnet client can reach it. Approve
      it under Machines -> {{ tailscale_subnet_router_machine }} -> Route
      settings at https://login.tailscale.com/admin/machines, or add an
      autoApprovers entry to the tailnet policy file to make approval
      declarative.
    success_msg: >-
      Approved routes: {{ tailscale_subnet_router_desired | join(", ") }}
  when:
    - not ansible_check_mode
    - tailscale_subnet_router_require_approval
  vars:
    tailscale_subnet_router_allowed: >-
      {{ (tailscale_subnet_router_verify_raw.stdout | from_json).Self.AllowedIPs
         | default([], true) }}
    # The console lists the Tailscale hostname, which is not inventory_hostname.
    # Naming the wrong one sends you looking for a machine that is not there.
    tailscale_subnet_router_machine: >-
      {{ (tailscale_subnet_router_verify_raw.stdout | from_json).Self.HostName
         | default(inventory_hostname, true) }}
