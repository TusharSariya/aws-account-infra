---
- name: Create bounded Kubernetes audit log directory
  ansible.builtin.file:
    path: "{{ kubernetes_control_plane_audit_log_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install Kubernetes API audit policy
  ansible.builtin.template:
    src: audit-policy.yml.j2
    dest: "{{ kubernetes_control_plane_audit_policy_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Render kubeadm initialization configuration
  ansible.builtin.template:
    src: kubeadm-init.yaml.j2
    dest: /etc/kubernetes/kubeadm-init.yaml
    owner: root
    group: root
    mode: "0600"

- name: Check whether the control plane is initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubernetes_control_plane_admin_conf

- name: Pull pinned control-plane images
  ansible.builtin.command: kubeadm config images pull --config /etc/kubernetes/kubeadm-init.yaml
  when: not kubernetes_control_plane_admin_conf.stat.exists
  changed_when: true

- name: Initialize the control plane
  ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm-init.yaml
  when: not kubernetes_control_plane_admin_conf.stat.exists
  changed_when: true

# `kubeadm init` runs once, so certSANs added to the template afterwards never reach
# the live certificate — the tasks below are the only thing that reconciles it. A
# client reaching the API server by a name the certificate omits fails TLS
# verification, which presents as a connectivity fault and is not one.
- name: Read the API server certificate subject alternative names
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - /etc/kubernetes/pki/apiserver.crt
      - -noout
      - -ext
      - subjectAltName
  changed_when: false
  register: kubernetes_control_plane_cert_sans

# Matching parsed entries rather than searching the raw text: a substring test would
# accept "host" against a certificate that only carries "host-2".
- name: Decide whether the certificate needs reissuing
  ansible.builtin.set_fact:
    kubernetes_control_plane_cert_stale: >-
      {{ kubernetes_api_external_endpoint | length > 0
         and kubernetes_api_external_endpoint not in (
           kubernetes_control_plane_cert_sans.stdout
           | regex_findall('(?:DNS|IP Address):([^,\s]+)')) }}

# The rollback path. Everything below replaces a working certificate, and the only
# other way back into a broken API server is the physical console.
- name: Back up the API server certificate and key
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ item }}.{{ ansible_facts['date_time']['iso8601_basic_short'] }}.bak"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  loop:
    - /etc/kubernetes/pki/apiserver.crt
    - /etc/kubernetes/pki/apiserver.key
  when: kubernetes_control_plane_cert_stale

# kubeadm refuses to overwrite an existing certificate, so removal is the documented
# way to reissue one.
- name: Remove the superseded API server certificate
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/kubernetes/pki/apiserver.crt
    - /etc/kubernetes/pki/apiserver.key
  when: kubernetes_control_plane_cert_stale

- name: Reissue the API server certificate
  ansible.builtin.command:
    argv:
      - kubeadm
      - init
      - phase
      - certs
      - apiserver
      - --config
      - /etc/kubernetes/kubeadm-init.yaml
  when: kubernetes_control_plane_cert_stale
  changed_when: true

# The kubelet reloads a static pod only when its manifest changes, and the manifest
# has not. Dropping the container is what forces the new certificate to be read.
- name: Restart the API server to load the reissued certificate
  ansible.builtin.shell: |
    set -o pipefail
    container="$(crictl ps --quiet --state Running --name '^kube-apiserver$')"
    if [ -n "${container}" ]; then
      crictl rm --force "${container}"
    fi
  args:
    executable: /bin/bash
  when: kubernetes_control_plane_cert_stale
  changed_when: true

# /livez is served to unauthenticated callers, so this needs no credentials. Gating
# here means a failed reissue stops the play rather than surfacing later as an
# unexplained outage.
- name: Wait for the API server to report live
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ kubernetes_api_port }}/livez"
    validate_certs: false
    status_code: 200
  register: kubernetes_control_plane_livez
  until: kubernetes_control_plane_livez is success
  retries: 30
  delay: 5
  when: kubernetes_control_plane_cert_stale

- name: Re-read the API server certificate subject alternative names
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - /etc/kubernetes/pki/apiserver.crt
      - -noout
      - -ext
      - subjectAltName
  changed_when: false
  register: kubernetes_control_plane_cert_sans_final
  when: kubernetes_api_external_endpoint | length > 0

# A reissued file on disk proves nothing about what the running API server presents.
- name: Assert the certificate now covers every client endpoint
  ansible.builtin.assert:
    that:
      - kubernetes_api_external_endpoint in kubernetes_control_plane_observed_sans
      - kubernetes_api_endpoint in kubernetes_control_plane_observed_sans
    fail_msg: >-
      The API server certificate covers
      {{ kubernetes_control_plane_observed_sans | join(", ") }}, which omits
      {{ kubernetes_api_external_endpoint }} or {{ kubernetes_api_endpoint }}.
      Clients using the missing endpoint will fail TLS verification.
  when: kubernetes_api_external_endpoint | length > 0
  vars:
    kubernetes_control_plane_observed_sans: >-
      {{ kubernetes_control_plane_cert_sans_final.stdout
         | regex_findall('(?:DNS|IP Address):([^,\s]+)') }}

# `kubeadm upgrade apply` regenerates certificates from the in-cluster ConfigMap, not
# from the file rendered above. Leaving the two out of step means the SAN survives
# until the next upgrade and then silently disappears.
- name: Read the uploaded cluster configuration
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - --namespace
      - kube-system
      - get
      - configmap
      - kubeadm-config
      - --output
      - jsonpath={.data.ClusterConfiguration}
  changed_when: false
  register: kubernetes_control_plane_uploaded_config
  when: kubernetes_api_external_endpoint | length > 0

# Uploading rewrites the whole ClusterConfiguration, kubernetesVersion included. If the
# cluster has been upgraded past the version this role pins, that would quietly roll the
# recorded version backwards and mislead the next upgrade — so refuse instead.
- name: Assert the pinned version matches the running cluster
  ansible.builtin.assert:
    that:
      - kubernetes_control_plane_uploaded_config.stdout is search('kubernetesVersion:\s*' ~ (kubernetes_control_plane_version | regex_escape))
    fail_msg: >-
      The cluster records a different kubernetesVersion than the pinned
      {{ kubernetes_control_plane_version }}. Align kubernetes_control_plane_version
      with the running cluster before the cluster configuration is re-uploaded.
  when:
    - kubernetes_api_external_endpoint | length > 0
    - kubernetes_api_external_endpoint not in kubernetes_control_plane_uploaded_config.stdout

- name: Upload the cluster configuration so upgrades keep the certificate SANs
  ansible.builtin.command:
    argv:
      - kubeadm
      - init
      - phase
      - upload-config
      - kubeadm
      - --config
      - /etc/kubernetes/kubeadm-init.yaml
  when:
    - kubernetes_api_external_endpoint | length > 0
    - kubernetes_api_external_endpoint not in kubernetes_control_plane_uploaded_config.stdout
  changed_when: true

- name: Create local kubeconfig directory
  ansible.builtin.file:
    path: "{{ kubernetes_control_plane_kubeconfig_local | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Fetch administrator kubeconfig
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubernetes_control_plane_kubeconfig_local }}"
    flat: true
  no_log: true

- name: Protect local administrator kubeconfig
  ansible.builtin.file:
    path: "{{ kubernetes_control_plane_kubeconfig_local }}"
    mode: "0600"
  delegate_to: localhost
  become: false

# admin.conf is fetched verbatim, so its server is always controlPlaneEndpoint — the
# LAN address, unreachable off-site. Rewriting it here rather than by hand is what
# stops the next playbook run from quietly reverting the workstation to LAN-only.
- name: Read the fetched kubeconfig
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_control_plane_kubeconfig_local }}"
      - config
      - view
      - --raw
      - --output
      - json
  changed_when: false
  register: kubernetes_control_plane_kubeconfig_view
  delegate_to: localhost
  become: false
  no_log: true
  when: kubernetes_api_external_endpoint | length > 0

- name: Derive the kubeconfig entries to reconcile
  ansible.builtin.set_fact:
    kubernetes_control_plane_kubeconfig_clusters: >-
      {{ (kubernetes_control_plane_kubeconfig_view.stdout | from_json)["clusters"] }}
    kubernetes_control_plane_kubeconfig_contexts: >-
      {{ (kubernetes_control_plane_kubeconfig_view.stdout | from_json)["contexts"] }}
    kubernetes_control_plane_kubeconfig_user: >-
      {{ (kubernetes_control_plane_kubeconfig_view.stdout | from_json)["contexts"]
         | selectattr("name", "equalto",
                      (kubernetes_control_plane_kubeconfig_view.stdout | from_json)["current-context"])
         | map(attribute="context.user") | first }}
  no_log: true
  when: kubernetes_api_external_endpoint | length > 0

- name: Point the default context at the external endpoint
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_control_plane_kubeconfig_local }}"
      - config
      - set-cluster
      - "{{ kubernetes_cluster_name }}"
      - "--server=https://{{ kubernetes_api_external_endpoint }}:{{ kubernetes_api_port }}"
  delegate_to: localhost
  become: false
  changed_when: true
  when:
    - kubernetes_api_external_endpoint | length > 0
    - kubernetes_control_plane_kubeconfig_clusters
      | selectattr("name", "equalto", kubernetes_cluster_name)
      | map(attribute="cluster.server") | first | default("")
      != "https://" ~ kubernetes_api_external_endpoint ~ ":" ~ kubernetes_api_port

# The fallback the tailnet cannot provide: if tailscaled is down on either machine,
# MagicDNS stops resolving and the default context has no path. This one is reachable
# from the same subnet, and the certificate already carries kubernetes_api_endpoint.
- name: Define the LAN fallback cluster
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_control_plane_kubeconfig_local }}"
      - config
      - set-cluster
      - "{{ kubernetes_control_plane_lan_context }}"
      - "--server=https://{{ kubernetes_api_endpoint }}:{{ kubernetes_api_port }}"
  delegate_to: localhost
  become: false
  changed_when: true
  when:
    - kubernetes_api_external_endpoint | length > 0
    - kubernetes_control_plane_kubeconfig_clusters
      | selectattr("name", "equalto", kubernetes_control_plane_lan_context)
      | map(attribute="cluster.server") | first | default("")
      != "https://" ~ kubernetes_api_endpoint ~ ":" ~ kubernetes_api_port

# --set-raw-bytes=false: the value is already base64, and the default would encode it
# a second time and produce a CA the client cannot parse.
- name: Give the LAN fallback cluster the cluster CA
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_control_plane_kubeconfig_local }}"
      - config
      - set
      - "clusters.{{ kubernetes_control_plane_lan_context }}.certificate-authority-data"
      - "{{ kubernetes_control_plane_certificate_authority }}"
      - --set-raw-bytes=false
  delegate_to: localhost
  become: false
  changed_when: true
  no_log: true
  when:
    - kubernetes_api_external_endpoint | length > 0
    - kubernetes_control_plane_certificate_authority | length > 0
    - kubernetes_control_plane_kubeconfig_clusters
      | selectattr("name", "equalto", kubernetes_control_plane_lan_context)
      | map(attribute="cluster.certificate-authority-data") | first | default("")
      != kubernetes_control_plane_certificate_authority
  vars:
    kubernetes_control_plane_certificate_authority: >-
      {{ kubernetes_control_plane_kubeconfig_clusters
         | selectattr("name", "equalto", kubernetes_cluster_name)
         | map(attribute="cluster.certificate-authority-data")
         | first | default("") }}

- name: Define the LAN fallback context
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_control_plane_kubeconfig_local }}"
      - config
      - set-context
      - "{{ kubernetes_control_plane_lan_context }}"
      - "--cluster={{ kubernetes_control_plane_lan_context }}"
      - "--user={{ kubernetes_control_plane_kubeconfig_user }}"
  delegate_to: localhost
  become: false
  changed_when: true
  when:
    - kubernetes_api_external_endpoint | length > 0
    - kubernetes_control_plane_kubeconfig_contexts
      | selectattr("name", "equalto", kubernetes_control_plane_lan_context)
      | map(attribute="context.cluster") | first | default("")
      != kubernetes_control_plane_lan_context

# Optional, and off by default: this widens cluster-admin from root-only to any
# process running as the node user.
- name: Create the node user kubeconfig directory
  ansible.builtin.file:
    path: "~{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
  when: kubernetes_control_plane_user_kubeconfig

- name: Install the node user kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "~{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  when: kubernetes_control_plane_user_kubeconfig
