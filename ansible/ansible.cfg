[defaults]
inventory = inventories/local/hosts.yml
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
host_key_checking = True
# Ansible Vault password lives OUTSIDE the checkout so `git clean -x` or deleting the
# repo can't destroy it. The ~-expanded absolute path resolves from any cwd; the
# committed vault ciphertext is decrypted with it automatically (no --ask-vault-pass).
# Bootstrap: mkdir -p ~/.config/aws-account-infra && printf '%s' '<pw>' > ~/.config/aws-account-infra/vault-password && chmod 600 "$_"
vault_password_file = ~/.config/aws-account-infra/vault-password

[privilege_escalation]
become_ask_pass = True
