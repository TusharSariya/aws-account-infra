environment_name: local
ubuntu_baseline_timezone: America/St_Johns

kubernetes_cluster_name: homelab
kubernetes_api_endpoint: 192.0.2.10
kubernetes_api_port: 6443
kubernetes_pod_subnet: 10.200.0.0/16
kubernetes_service_subnet: 10.96.0.0/12
kubernetes_metallb_pool: 192.0.2.200-192.0.2.210
kubernetes_gateway_address: 192.0.2.201
kubernetes_gateway_namespace: istio-ingress
kubernetes_gateway_name: homelab
kubernetes_grafana_hostname: grafana.home.arpa
kubernetes_pihole_hostname: pihole.home.arpa
kubernetes_pihole_dns_address: 192.0.2.202

# Centralized logs (Loki single-binary, filesystem-backed on local-path).
kubernetes_loki_retention_hours: 336
kubernetes_loki_storage_size: 20Gi

# Harvest worker image the KEDA ScaledJobs run (cluster_harvester role). Pull is
# authenticated by the node kubelet ECR credential provider; no imagePullSecret.
kubernetes_harvester_image: "992382747916.dkr.ecr.us-east-1.amazonaws.com/excalidraw-tf-rag/v3/harvest/prod:0.5.0"

# IAM Roles Anywhere coordinates for the node ECR-pull identity. Copy these from the
# aws-staging-account TF outputs (ecr_pull_trust_anchor_arn / ecr_pull_profile_arn /
# ecr_pull_role_arn). The node's aws_signing_helper passes them to Roles Anywhere to
# vend short-lived ECR creds. The per-node client cert + key that go with these are
# secrets — put them in a Vault-encrypted file as vault_ecr_pull_node_certificate /
# vault_ecr_pull_node_private_key (never here). Example placeholders below:
kubernetes_node_ecr_rolesanywhere_trust_anchor_arn: "arn:aws:rolesanywhere:us-east-1:992382747916:trust-anchor/EXAMPLE-TRUST-ANCHOR-ID"
kubernetes_node_ecr_rolesanywhere_profile_arn: "arn:aws:rolesanywhere:us-east-1:992382747916:profile/EXAMPLE-PROFILE-ID"
kubernetes_node_ecr_rolesanywhere_role_arn: "arn:aws:iam::992382747916:role/homelab/homelab-ecr-pull"

# Set false to preinstall the Ubuntu NVIDIA driver and container toolkit on the
# GPU host rather than letting GPU Operator manage them.
kubernetes_gpu_operator_manage_driver: true
kubernetes_gpu_operator_manage_toolkit: true

# Put passwords, tokens, and private values in an Ansible Vault-encrypted file in
# inventories/local/group_vars rather than adding them here.
