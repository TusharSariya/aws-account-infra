# Non-secret group vars for every host. Copy this tree to inventories/local/ and edit.
# Secrets do NOT go here — they live in the sibling (encrypted) vault.yml; see
# vault.yml.example. Ansible auto-loads every file under group_vars/all/.
environment_name: local
ubuntu_baseline_timezone: America/St_Johns

kubernetes_cluster_name: homelab
kubernetes_api_endpoint: 192.0.2.10
kubernetes_api_port: 6443

# Additional name the API server certificate must cover, for a workstation that reaches
# the cluster somewhere other than kubernetes_api_endpoint — a tailnet MagicDNS name,
# for instance. Empty means LAN-only, and every task that depends on it is skipped.
kubernetes_api_external_endpoint: ""
kubernetes_pod_subnet: 10.200.0.0/16
kubernetes_service_subnet: 10.96.0.0/12
kubernetes_metallb_pool: 192.0.2.200-192.0.2.210
kubernetes_gateway_address: 192.0.2.201
kubernetes_gateway_namespace: istio-ingress
kubernetes_gateway_name: homelab
kubernetes_grafana_hostname: grafana.home.arpa
kubernetes_pihole_hostname: pihole.home.arpa
kubernetes_pihole_dns_address: 192.0.2.202

# TLS for the homelab Gateway (cert-manager + Let's Encrypt over Cloudflare DNS-01).
# See docs/superpowers/specs/2026-07-16-homelab-pki-design.md
#
# kubernetes_homelab_domain must be a PUBLIC domain you control DNS for — home.arpa
# and other RFC 8375/6761 special-use names can never get a public cert, because no
# CA can validate control of a name that does not exist in public DNS. The zone must
# be hosted on Cloudflare and reachable by the scoped API token in vault.yml.
# DNS-01 writes only a temporary _acme-challenge TXT record; no inbound access is
# needed, and the service A/CNAME records stay private (split-horizon via Pi-hole).
kubernetes_homelab_domain: homelab.example.com
kubernetes_cloudflare_zone: example.com
# Contact on the ACME account. Not used for validation and never appears in the
# certificate — Let's Encrypt only reaches you here about account/policy matters.
# (LE discontinued expiry notification mail in June 2025, so nothing routine
# arrives; monitor renewals yourself rather than waiting for an email.)
kubernetes_acme_email: you@example.com
# letsencrypt-staging (default) or letsencrypt-prod. Prove the DNS-01 loop on
# staging FIRST — prod allows only 5 failed validations/hour.
kubernetes_acme_issuer: letsencrypt-staging

# Centralized logs (Loki single-binary, filesystem-backed on local-path).
kubernetes_loki_retention_hours: 336
kubernetes_loki_storage_size: 20Gi

# Harvest worker image the KEDA ScaledJobs run (cluster_harvester role). Pull is
# authenticated by the node kubelet ECR credential provider; no imagePullSecret.
kubernetes_harvester_image: "992382747916.dkr.ecr.us-east-1.amazonaws.com/excalidraw-tf-rag/v3/harvest/prod:0.5.0"

# Supabase project URL for the harvester worker. NOT a secret (the service key is —
# that lives in vault.yml). Named vault_* only for grouping; safe to keep plaintext.
vault_harvester_supabase_url: "https://PROJECT_REF.supabase.co"

# IAM Roles Anywhere coordinates for the node ECR-pull identity. Copy these from the
# aws-staging-account TF outputs (ecr_pull_trust_anchor_arn / ecr_pull_profile_arn /
# ecr_pull_role_arn).
kubernetes_node_ecr_rolesanywhere_trust_anchor_arn: "arn:aws:rolesanywhere:us-east-1:992382747916:trust-anchor/EXAMPLE-TRUST-ANCHOR-ID"
kubernetes_node_ecr_rolesanywhere_profile_arn: "arn:aws:rolesanywhere:us-east-1:992382747916:profile/EXAMPLE-PROFILE-ID"
kubernetes_node_ecr_rolesanywhere_role_arn: "arn:aws:iam::992382747916:role/homelab/homelab-ecr-pull"

# Each node's client cert is issued via an ON-NODE CSR signed by your homelab CA:
# the node generates and keeps its OWN private key (it never leaves the node, never
# enters git or vault). These two paths point at the CA on the CONTROLLER (your Mac);
# keep them OUTSIDE the checkout. Setting both non-empty ENABLES the ECR pull identity.
kubernetes_node_ecr_ca_certificate_path: "{{ lookup('env', 'HOME') }}/.config/aws-account-infra/homelab-ca.crt"
kubernetes_node_ecr_ca_privatekey_path: "{{ lookup('env', 'HOME') }}/.config/aws-account-infra/homelab-ca.key"

# Set false to preinstall the Ubuntu NVIDIA driver and container toolkit on the
# GPU host rather than letting GPU Operator manage them.
kubernetes_gpu_operator_manage_driver: true
kubernetes_gpu_operator_manage_toolkit: true
