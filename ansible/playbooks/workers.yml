---
- name: Generate a short-lived worker join command
  hosts: kubernetes_control_plane
  become: true
  gather_facts: false
  tasks:
    - name: Generate worker join command
      ansible.builtin.command: kubeadm token create --ttl 15m --print-join-command
      register: kubernetes_join_command
      changed_when: false
      no_log: true

- name: Join Kubernetes workers
  hosts: kubernetes_workers
  become: true
  gather_facts: true
  serial: 1
  roles:
    - cluster_preflight
    - kubernetes_worker
