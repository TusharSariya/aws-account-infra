---
- name: Read worker health without changing configuration
  hosts: ubuntu_workers
  become: false
  gather_facts: true
  tasks:
    - name: Inspect runtime services
      ansible.builtin.service_facts:
    - name: Inspect Secure Boot
      ansible.builtin.command: mokutil --sb-state
      changed_when: false
      check_mode: false
      when: worker_runtime_gpu | default(false)
    - name: Inspect GPU and driver
      ansible.builtin.command: nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
      changed_when: false
      check_mode: false
      when: worker_runtime_gpu | default(false)
    - name: Inspect local scratch capacity
      ansible.builtin.command: df -B1 /var/lib
      changed_when: false
      check_mode: false
