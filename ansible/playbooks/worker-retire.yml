---
- name: Disable Ubuntu enrollment while preserving host data
  hosts: ubuntu_workers
  become: true
  gather_facts: false
  tasks:
    - name: Stop and disable worker kubelet
      ansible.builtin.systemd_service:
        name: kubelet
        enabled: false
        state: stopped
    - name: Remove remaining bootstrap credential
      ansible.builtin.file:
        path: /etc/kubernetes/bootstrap.conf
        state: absent
      no_log: true
