[project]
name = "squash-calendar"
version = "0.1.0"
description = "Personal ASC squash calendar with public Club Locker previews"
requires-python = ">=3.14"
dependencies = ["icalendar>=6.3,<8", "httpx>=0.28,<0.29"]

[dependency-groups]
dev = ["boto3>=1.40", "pytest>=8", "moto[s3]>=5,<6", "ruff>=0.11"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
