[project]
name = "swim-calendar"
version = "0.1.0"
description = "Public Ches Penney swimming calendar"
requires-python = ">=3.14"
dependencies = [
    "icalendar>=6.3,<8",
    "httpx>=0.28,<0.29",
    "beautifulsoup4>=4.14,<5",
]

[dependency-groups]
dev = ["boto3>=1.40", "pytest>=8", "moto[s3]>=5,<6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
