[project]
name = "court-booker-api"
version = "0.1.0"
description = "HTTP zip Lambda for Ches Penney court booking"
requires-python = ">=3.14"
dependencies = [
  "pyyaml==6.0.3",
  "python-dotenv==1.1.1",
  "icalendar>=6.3,<8",
]

[dependency-groups]
dev = [
  "boto3>=1.40",
  "moto[dynamodb]>=5,<6",
  "pytest>=8.0",
]

[tool.uv]
package = false
