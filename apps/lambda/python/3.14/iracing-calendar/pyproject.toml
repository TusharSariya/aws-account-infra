[project]
name = "iracing-calendar"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["boto3>=1.40,<2", "beautifulsoup4>=4.13,<5", "json5>=0.12,<1", "pypdf>=6,<7", "icalendar>=6.3,<8"]

[dependency-groups]
dev = ["pytest>=8,<10", "moto[s3]>=5,<6", "ruff>=0.13,<1", "vobject>=0.9,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
