controllerManager:
  manager:
    image:
      repository: registry.k8s.io/kueue/kueue
      tag: v0.19.6@sha256:b0f5a48116f3576d8f23189a183123a63ea4d6ea2bc41250aa43750508b064c8
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: '1', memory: 512Mi}
managerConfig:
  controllerManagerConfigYaml: |
    apiVersion: config.kueue.x-k8s.io/v1beta2
    kind: Configuration
    health:
      healthProbeBindAddress: :8081
    metrics:
      bindAddress: :8443
    webhook:
      port: 9443
    leaderElection:
      leaderElect: true
      resourceName: c1f6bfd2.kueue.x-k8s.io
    manageJobsWithoutQueueName: false
    resources:
      excludeResourcePrefixes: []
    managedJobsNamespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [homelab-models, homelab-jobs, arc-runners, homelab-inference]
    integrations:
      # Batch/CronJob compute uses labeled, gated Pods under the same admission policy.
      frameworks: [pod, deployment]
