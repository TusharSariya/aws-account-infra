githubConfigUrl: https://github.com/TusharSariyaOrg/aws-account-infra
githubConfigSecret: github-app
runnerScaleSetName: homelab-talos
minRunners: 0
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller
# Explicit spec avoids chart-injected unbudgeted Docker resources.
containerMode: {}
listenerTemplate:
  spec:
    containers:
      - name: listener
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 250m, memory: 128Mi}
template:
  metadata:
    labels:
      kueue.x-k8s.io/queue-name: ci
      kueue.x-k8s.io/workload-priority-class: homelab-compute
  spec:
    schedulingGates: [{name: kueue.x-k8s.io/admission}]
    nodeSelector: {kubernetes.io/hostname: talos-worker-01}
    imagePullSecrets: [{name: ghcr-read}]
    automountServiceAccountToken: false
    terminationGracePeriodSeconds: 30
    restartPolicy: Never
    initContainers:
      - name: init-dind-externals
        image: ghcr.io/tusharsariyaorg/homelab-ci-runner@sha256:632ba78099718ee6222de48537bd932027e3a4b693095b7e4f200054c5dfc103
        command: [cp, -r, /home/runner/externals/., /home/runner/tmpDir/]
        resources:
          requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 1Gi}
          limits: {cpu: 250m, memory: 512Mi, ephemeral-storage: 1Gi}
        volumeMounts: [{name: scratch, mountPath: /home/runner/tmpDir, subPath: externals}]
      - name: dind
        image: docker:28.5.2-dind@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac
        # Keep the binfmt filesystem alive after the temporary QEMU installer exits.
        # This mount belongs to the disposable Pod; no host filesystem is mounted.
        command: [/bin/sh, -ec]
        args:
          - |
            parent=$(sed -n 's/^0:://p' /proc/self/cgroup)
            parent=${parent%/*}
            case "$parent" in
              "/kubepods/pod$HOMELAB_RUNNER_POD_UID") ;;
              *) echo 'Expected the guaranteed Talos Pod cgroup' >&2; exit 1 ;;
            esac
            printf '%s\n' "$parent" > /var/run/homelab-pod-cgroup
            mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
            exec dockerd-entrypoint.sh dockerd --host=unix:///var/run/docker.sock --group=123 --data-root=/scratch/docker --cgroup-parent="$parent" --registry-mirror=http://nexus.homelab-cache.svc.cluster.local:5000 --max-download-attempts=2
        env:
          - name: HOMELAB_RUNNER_POD_UID
            valueFrom: {fieldRef: {fieldPath: metadata.uid}}
        securityContext: {privileged: true}
        restartPolicy: Always
        startupProbe:
          exec: {command: [docker, info]}
          failureThreshold: 24
          periodSeconds: 5
        resources:
          requests: {cpu: '2', memory: 8Gi, ephemeral-storage: 15Gi}
          limits: {cpu: '2', memory: 8Gi, ephemeral-storage: 15Gi}
        volumeMounts:
          - {name: scratch, mountPath: /scratch}
          - {name: scratch, mountPath: /home/runner/_work, subPath: work}
          - {name: scratch, mountPath: /home/runner/externals, subPath: externals, readOnly: true}
          - {name: scratch, mountPath: /var/run, subPath: run}
    containers:
      - name: runner
        # Required for job-specific Tailscale TUN; isolated from host namespaces/mounts.
        securityContext: {privileged: true}
        image: ghcr.io/tusharsariyaorg/homelab-ci-runner@sha256:632ba78099718ee6222de48537bd932027e3a4b693095b7e4f200054c5dfc103
        command: [/home/runner/run.sh]
        env:
          - name: HOMELAB_RUNNER_POD_UID
            valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          - {name: DOCKER_HOST, value: 'unix:///var/run/docker.sock'}
          - {name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS, value: '120'}
        resources:
          requests: {cpu: '2', memory: 8Gi, ephemeral-storage: 15Gi}
          limits: {cpu: '2', memory: 8Gi, ephemeral-storage: 15Gi}
        volumeMounts:
          - {name: scratch, mountPath: /home/runner/_work, subPath: work}
          - {name: scratch, mountPath: /var/run, subPath: run}
    volumes:
      - name: scratch
        emptyDir: {sizeLimit: 30Gi}
