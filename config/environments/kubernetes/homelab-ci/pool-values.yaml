dynamic: true
worker: talos-worker-01
# Allocatable already excludes Kubernetes reservations and eviction thresholds.
storageHeadroom: 0
# StrictFIFO: the AI runtime needs the whole worker pool; at the head of the queue it blocks new runner
# admission until admitted instead of being passed indefinitely (playground spec, #255).
strategy: StrictFIFO
power:
  enabled: true
queues:
  - {namespace: homelab-models, name: ai}
  - {namespace: arc-runners, name: ci}
  - {namespace: homelab-jobs, name: argo}
