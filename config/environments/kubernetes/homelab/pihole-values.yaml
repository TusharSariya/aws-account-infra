replicaCount: 1
strategyType: Recreate
image:
  repository: pihole/pihole
  tag: 2026.07.2@sha256:f7d1be836e3bc608b56d82fc9904f5a831cdfbc0dc9c6d58f94e4c985c70038b
nodeSelector:
  node-role.kubernetes.io/control-plane: ""
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: '1', memory: 512Mi}
persistentVolumeClaim:
  enabled: true
  storageClass: laptop-local-retain
  existingClaim: pihole-laptop
  size: 2Gi
  annotations:
    helm.sh/resource-policy: keep
adminPassword: ''
admin:
  enabled: true
  existingSecret: pihole-admin
  passwordKey: password
DNS1: 1.1.1.1
DNS2: 1.0.0.1
podDnsConfig:
  enabled: true
  policy: None
  nameservers: [1.1.1.1, 1.0.0.1]
extraEnvVars:
  TZ: America/St_Johns
  FTLCONF_dns_listeningMode: all
  FTLCONF_database_maxDBdays: '7'
  FTLCONF_dhcp_active: 'false'
  FTLCONF_webserver_domain: pihole-admin.tail2f646b.ts.net
adlists:
  - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
# Triangle sign-in loads ThreatMetrix device-risk checks from this exact hostname.
# The chart imports whitelist.txt only when creating a fresh gravity database.
whitelist:
  - h.online-metrix.net
extraInitContainers:
  - name: allow-triangle-risk-check
    image: pihole/pihole:2026.07.2@sha256:f7d1be836e3bc608b56d82fc9904f5a831cdfbc0dc9c6d58f94e4c985c70038b
    command:
      - /bin/sh
      - -ec
      - |
        # Existing PVCs need a database update; fresh installs use whitelist above.
        [ -f /etc/pihole/gravity.db ] || exit 0
        pihole-FTL sqlite3 -ni /etc/pihole/gravity.db <<'SQL'
        .timeout 30000
        .bail on
        BEGIN IMMEDIATE;
        INSERT INTO domainlist (type, domain, enabled, comment)
        VALUES (0, 'h.online-metrix.net', 1, 'Triangle sign-in device-risk check')
        ON CONFLICT(domain, type) DO UPDATE SET enabled = 1;
        INSERT OR IGNORE INTO domainlist_by_group (domainlist_id, group_id)
        SELECT id, 0 FROM domainlist WHERE type = 0 AND domain = 'h.online-metrix.net';
        COMMIT;
        SQL
    volumeMounts:
      - name: config
        mountPath: /etc/pihole
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 128Mi}
serviceDhcp:
  enabled: false
serviceDns:
  type: ClusterIP
  mixedService: true
  annotations:
    tailscale.com/expose: 'true'
    tailscale.com/proxy-class: primary-applications
    tailscale.com/hostname: pihole-dns
serviceWeb:
  type: ClusterIP
  https:
    enabled: false
virtualHost: pihole-admin.tail2f646b.ts.net
ingress:
  enabled: true
  ingressClassName: tailscale
  annotations:
    tailscale.com/proxy-class: primary-applications
  path: /
  pathType: Prefix
  # The operator derives the hostname from tls.hosts; leave HTTP host matching empty.
  hosts: ['']
  tls:
    - hosts: [pihole-admin]
