# Talos supplies per-node PodCIDRs, bpffs and cgroup v2 mounts.
ipam:
  mode: kubernetes
routingMode: tunnel
tunnelProtocol: vxlan
kubeProxyReplacement: false
# Reach Talos KubePrism directly without depending on pod/service networking.
k8sServiceHost: localhost
k8sServicePort: 7445
bpf:
  autoMount:
    enabled: false
  masquerade: false
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
operator:
  replicas: 1
# Observability UI/relay and their certificates are a separate future change.
hubble:
  enabled: false
