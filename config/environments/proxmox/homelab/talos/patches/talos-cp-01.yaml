machine:
  certSANs:
    - 10.0.0.221
  kubelet:
    nodeIP:
      validSubnets:
        - 10.0.0.221/32
  nodeLabels:
    workload.security/trusted: "true"
cluster:
  apiServer:
    certSANs:
      - 10.0.0.221
  etcd:
    advertisedSubnets:
      - 10.0.0.221/32
  allowSchedulingOnControlPlanes: false
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: talos-cp-01
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: homelab
selector:
  match: mac(link.permanent_addr) == "02:42:00:00:01:00"
---
apiVersion: v1alpha1
kind: LinkConfig
name: homelab
addresses:
  - address: 10.0.0.221/24
routes:
  - gateway: 10.0.0.1
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 10.0.0.231
link: homelab
