machine:
  certSANs:
    - 10.0.0.221
  kubelet:
    nodeIP:
      validSubnets:
        - 10.0.0.221/32
    # The control plane is a 2 vCPU / 5 GiB QEMU guest. Reserve memory for Talos
    # and the kubelet, and let the kubelet evict before the host-level OOM
    # controller starts killing kube-proxy and Cilium in a loop (2026-09-25).
    extraConfig:
      systemReserved:
        memory: 384Mi
      kubeReserved:
        memory: 256Mi
      evictionHard:
        memory.available: 200Mi
      evictionSoft:
        memory.available: 400Mi
      evictionSoftGracePeriod:
        memory.available: 30s
  nodeLabels:
    workload.security/trusted: "true"
cluster:
  apiServer:
    certSANs:
      - 10.0.0.221
    # Soft heap ceiling: Go collects harder instead of letting the API server
    # grow past ~1.5 GiB on a 5 GiB guest. It is not a hard limit.
    env:
      GOMEMLIMIT: 1536MiB
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
    # Metadata for every request wrote ~100 MB of audit log per 45 minutes to the
    # same SSD etcd syncs on. Leases, events, health probes and control-plane
    # component reads carry no audit value; everything else stays at Metadata.
    auditPolicy:
      apiVersion: audit.k8s.io/v1
      kind: Policy
      omitStages:
        - RequestReceived
      rules:
        - level: None
          resources:
            - group: coordination.k8s.io
              resources: [leases]
        - level: None
          resources:
            - group: ""
              resources: [events]
            - group: events.k8s.io
              resources: [events]
        - level: None
          nonResourceURLs:
            - /healthz*
            - /readyz*
            - /livez*
            - /version
            - /openapi/*
        - level: None
          users:
            - system:kube-scheduler
            - system:kube-controller-manager
            - system:apiserver
          verbs: [get, list, watch]
        - level: None
          userGroups: [system:nodes]
          verbs: [get, list, watch]
        - level: Metadata
  etcd:
    advertisedSubnets:
      - 10.0.0.221/32
  allowSchedulingOnControlPlanes: false
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: talos-cp-01
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: homelab
selector:
  match: mac(link.permanent_addr) == "02:42:00:00:01:00"
---
apiVersion: v1alpha1
kind: LinkConfig
name: homelab
addresses:
  - address: 10.0.0.221/24
routes:
  - gateway: 10.0.0.1
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 10.0.0.231
link: homelab
---
# Dedicated laptop disk, never the system or an existing application disk.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: pihole
provisioning:
  diskSelector:
    match: "!system_disk && '/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_homelab-dns' in disk.symlinks"
  minSize: 2GiB
  maxSize: 2GiB
