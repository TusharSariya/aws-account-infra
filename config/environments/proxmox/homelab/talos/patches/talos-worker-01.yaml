machine:
  certSANs:
    - 10.0.0.222
  kubelet:
    nodeIP:
      validSubnets:
        - 10.0.0.222/32
  kernel:
    modules:
      - name: binfmt_misc
  sysctls:
    user.max_user_namespaces: "11255"
  nodeLabels:
    workload.security/shared: "true"
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: talos-worker-01
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: homelab
selector:
  match: mac(link.permanent_addr) == "02:42:00:00:01:02"
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: homelab
clientIdentifier: mac
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-path-provisioner
volumeType: partition
provisioning:
  diskSelector:
    match: "!system_disk && disk.dev_path == '/dev/sdb' && disk.size == 1200u * GiB && '/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1' in disk.symlinks"
  minSize: 1199GiB
  grow: false
filesystem:
  type: xfs
  projectQuotaSupport: true
